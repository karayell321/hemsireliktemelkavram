{q:"Hastalık nedir?",a:"Bireyin fiziksel, ruhsal, entelektüel, sosyal ve gelişim evrelerinde ya da spiritüel fonksiyonlarında gerileme veya azalma",w:["Yalnızca fiziksel bir bozukluk","Yalnızca psikolojik bir bozukluk","Yalnızca sosyal bir bozukluk"],e:"Hastalık bireyin fiziksel, ruhsal, entelektüel, sosyal ve gelişim evrelerinde ya da spiritüel fonksiyonlarında gerileme veya azalmanın meydana gelmesidir."},
{q:"DSÖ'ye göre hastalık nedir?",a:"Fiziksel, akılsal ve sosyal tam bir iyilik halinin yokluğu",w:["Yalnızca fiziksel bozukluk","Yalnızca akılsal bozukluk","Yalnızca sosyal bozukluk"],e:"DSÖ ise hastalığı; fiziksel, akılsal ve sosyal tam bir iyilik halinin yokluğu şeklinde tanımlamıştır."},
{q:"Hemşireler neden hastalıktan çok hastalığın kişideki bireysel etkilerine odaklanmalıdır?",a:"Çünkü birey hasta olmadığı halde kendini hasta, hasta olduğu halde sağlıklı algılayabilir",w:["Çünkü hastalık önemsizdir","Çünkü tanı gereksizdir","Çünkü tedavi yoktur"],e:"Birey herhangi bir hastalığı olsun ya da olmasın kendisini hasta olarak hissedebilir. Bu nedenle hemşireler hastalıktan çok, hastalığın kişideki bireysel etkilerine odaklanmalıdırlar."},
{q:"Hasta olma davranışını etkileyen faktörler arasında hangisi yer alır?",a:"Sosyal statü",w:["Yalnızca genetik","Yalnızca yaş","Yalnızca cinsiyet"],e:"Hasta olma davranışını kişisel özellikler, sosyal statü, sosyal normlar, olanaklar, kişinin çevresi gibi birçok şey etkilemektedir."},
{q:"Kısa süreli ve yaşamı tehdit etmeyen hastalıkların birey ve aileye etkisi nasıldır?",a:"Azdır",w:["Çok fazladır","Yoktur","Herkeste aynıdır"],e:"Kısa süreli ve yaşamı tehdit etmeyen hastalıkların birey ve aileye etkileri az, uzun süren ve yaşamı tehdit eden kronik hastalıkların ise birçok emosyonel ve davranışsal etkileri vardır."},
{q:"Beden imajını etkileyen durumlarda birey hangi aşamalardan geçer?",a:"Şok, geri çekilme, bilgilenme, kabul, rehabilitasyon",w:["Öfke, pazarlık, depresyon, kabul","Yalnızca inkar","Yalnızca öfke"],e:"Bacak amputasyonu gibi beden imajını etkileyecek bir durum olduğunda birey; şok, geri çekilme, bilgilenme, kabul ve rehabilitasyon aşamalarını geçirir."},
{q:"Kendilik kavramındaki etkilenme nasıl gözlenebilir?",a:"Kişilerin rollerindeki değişimler ile",w:["Kan testi ile","Röntgen ile","Yalnızca hasta ifadesi ile"],e:"Kendilik kavramındaki etkilenme çok komplekstir ve ancak kişilerin rollerindeki değişimler ile gözlenebilir."},
{q:"Hastalık durumunda aile rollerinde değişim neye neden olabilir?",a:"Stres ve çatışmalara",w:["Mutluluğa","Huzura","Ekonomik rahatlamaya"],e:"Hastalık durumunda aile içindeki rollerde değişim olur. Bu durum stres ve çatışmalara neden olabilir."},
{q:"Sağlık inanç ve uygulamalarını etkileyen iç değişkenlerden biri nedir?",a:"Entelektüel düzey",w:["Aile","Kültürel özellikler","Sosyoekonomik faktörler"],e:"İç değişkenler: büyüme-gelişme düzeyi, entelektüel düzey, fonksiyonların algılanması, emosyonel faktörler, spiritüel faktörler."},
{q:"Çocuklar için hastaneye yatma ne anlama gelir?",a:"Korku ve anksiyete",w:["Mutluluk","Rahatlama","Eğlence"],e:"Çocuklar için hastalık ve özellikle hastaneye yatma korku ve anksiyete anlamına gelir. Özellikle bilgi eksikliği ve işlemler bu korkunun temel nedenidir."},
{q:"Fonksiyonların algılanması sağlığı nasıl etkiler?",a:"Kişilerin fiziksel fonksiyonları inanç ve uygulamalarını etkiler",w:["Fonksiyonlar sağlığı etkilemez","Yalnızca fiziksel sağlığı etkiler","Yalnızca psikolojik sağlığı etkiler"],e:"Fonksiyonların algılanması: kişilerin fiziksel fonksiyonları inanç ve uygulamalarını etkilemektedir. Örneğin bulantı, kusması olan bir birey kendisini yorgun hissettiği gibi öz bakımını da gerçekleştiremeyebilir."},
{q:"Emosyonel faktörler sağlığı nasıl etkiler?",a:"Stres, depresyon ve korkular sağlık inanç ve uygulamalarını etkiler",w:["Emosyonlar sağlığı etkilemez","Yalnızca olumlu emosyonlar etkiler","Yalnızca olumsuz emosyonlar etkiler"],e:"Emosyonel faktörler: kişilerin stresi, depresyonu ve korkuları sağlık inanç ve uygulamalarını etkileyebilir. Emosyonel durumu iyi olan kişiler hastalıkları ile daha iyi baş edebilirler."},
{q:"Spiritüel faktörler sağlığı nasıl etkiler?",a:"Kişinin ailesi, arkadaşları ile iletişimleri, yaşamın anlamı, yaşam biçimini şekillendirir",w:["Spiritüel faktörler sağlığı etkilemez","Yalnızca dini ritüelleri etkiler","Yalnızca ölümü etkiler"],e:"Spiritüel faktörler: kişinin ailesi, arkadaşları ile iletişimleri, yaşamın anlamı, kişinin yaşam biçiminin nasıl olacağını şekillendiren özellikleridir."},
{q:"Aile sağlık inanç ve uygulamalarını nasıl etkiler?",a:"Kişinin hastalık ciddiyeti algısını, önlemleri ve tepkileri etkiler",w:["Aile sağlığı etkilemez","Yalnızca genetik hastalıkları etkiler","Yalnızca ekonomik durumu etkiler"],e:"Aile: kişinin hastalık ciddiyeti ile ilgili algısını, hastalığa karşı önlemleri ve hastalığa karşı tepkileri etkilemektedir. Örneğin düzenli sağlık kontrolü yaptıran bir annenin kızının da benzer davranışı göstermesi beklenir."},
{q:"Kültür sağlık bakımını nasıl etkiler?",a:"Sağlık bakım sistemine yaklaşımı, kişisel sağlık uygulamalarını, hasta-hemşire iletişimini etkiler",w:["Kültür sağlığı etkilemez","Yalnızca beslenmeyi etkiler","Yalnızca giyimi etkiler"],e:"Kültürel özellikler: kültür sağlık bakım sistemine yaklaşımı, kişisel sağlık uygulamalarını, hasta-hemşire iletişimini etkiler. Hemşire kültürü tanımazsa etkili bakım sunamaz."},
{q:"Sosyoekonomik faktörler sağlığı nasıl etkiler?",a:"Sağlığı korumayı ve sağlık sorunlarında çözüm arama davranışını etkiler",w:["Sosyoekonomik faktörler sağlığı etkilemez","Yalnızca genetik hastalıkları etkiler","Yalnızca yaşam süresini etkiler"],e:"Sosyo-ekonomik faktörler: ekonomik durum kişinin sağlığını korumasını etkilediği gibi sağlık sorunları çıktığında çözüm arama davranışlarını da etkileyecektir."},
{q:"Sağlığı koruma nedir?",a:"Düzenli egzersiz, iyi beslenme gibi sağlığın mevcut durumunu sürdürmeye odaklanma",w:["Hastalık tedavisi","İmmünizasyon","Stres yönetimi"],e:"Sağlığı koruma: düzenli egzersiz yapma, iyi beslenme, sağlığın var olan durumunu sürdürmeye odaklanmaktadır."},
{q:"İyilik kavramı nedir?",a:"Kişinin kendisini sağlıklı hissetmesi için neler yapması gerektiğini öğrenmesi",w:["Hastalık tedavisi","İmmünizasyon","Sağlığı koruma"],e:"İyilik kavramı: kendi sorumluluğunu alma, stres yönetimi, fiziksel farkındalık gibi kişinin kendisini sağlıklı hissetmesi için neler yapması gerektiğini öğrenmesidir."},
{q:"Hastalığın önlenmesi nedir?",a:"İmmünizasyon programları gibi hastalıkları önlemeye yönelik aktiviteler",w:["Düzenli egzersiz","İyi beslenme","Stres yönetimi"],e:"Hastalığın önlenmesi: immünizasyon programları gibi sağlığın seviyesini artırmaya ya da hastalıkları önlemeye yönelik aktiviteleri içerir."},
{q:"Sağlık düzeyinin belirleyicileri arasında hangisi yer alır?",a:"Fizik aktivite",w:["Yalnızca genetik","Yalnızca yaş","Yalnızca cinsiyet"],e:"Sağlık düzeyinin belirleyicileri: fizik aktivite, aşırı kilo ve obezite, sigara kullanımı, madde kullanımı, seksüel davranışın sorumluluğunu alma, mental sağlık, şiddet, çevre kalitesi, immünizasyon, sağlığa ulaşılabilirlik."},
{q:"Smith'in klinik modeli hangi bakış açısına sahiptir?",a:"En dar bakış açısına",w:["En geniş bakış açısına","Orta düzey bakış açısına","Sosyal bakış açısına"],e:"Klinik model: en dar bakış açısına sahip olan modeldir. İnsanların fizyolojik sistemlerinin fonksiyonları ile ilişkili modeldir."},
{q:"Smith'in adaptif modeli neyin birleşimidir?",a:"Klinik model ve rol performans modelinin",w:["Klinik model ve eudaimonistik modelin","Rol performans ve eudaimonistik modelin","Sadece klinik modelin"],e:"Adaptif model (Uyum Modeli): klinik model ve rol performans modelinin birleşimi uyum modelidir. Sağlık, fizik ve sosyal çevre ile bireyin etkili etkileşimidir."},
{q:"Smith'in eudaimonistik modeli nasıl bir modeldir?",a:"En kapsamlı model",w:["En dar model","Orta düzey model","Sosyal model"],e:"Eudaimonistik model: Smith'e göre sağlık kavramının en kapsamlı modelidir."},
{q:"Sağlık İnanç Modeli hangi amaçla kullanılır?",a:"Sağlıkla ilgili davranış değişikliğinin açıklanması, sağlığın sürdürülmesi ve koruyucu sağlık davranışı",w:["Yalnızca hastalık tedavisi","Yalnızca cerrahi girişim","Yalnızca ilaç uygulama"],e:"Model sağlıkla ilgili davranış değişikliğinin açıklanması, sağlığın sürdürülmesi ve koruyucu sağlık davranışı ile ilgili müdahale araştırmalarının planlanmasında kullanılmaktadır."},
{q:"Sağlık İnanç Modeli'nde 'ciddiyet algısı' nedir?",a:"Hastalığın ciddiyet ve kişinin yaşamı için ne kadar tehlikeli olduğunun algısı",w:["Hastalık olma olasılığı","Sağlık davranışının maliyeti","Tedavinin yararı"],e:"Ciddiyet algısı: hastalığın ciddiyet ve kişinin yaşamı için ne kadar ciddi tehlikeli olduğunun algısı."},
{q:"Sağlık İnanç Modeli'nde 'maliyet' nedir?",a:"Sağlık davranışının zaman, para, enerji açısından maliyeti, ağrı ve rahatsızlık gibi yan etkileri",w:["Hastalık olma olasılığı","Hastalığın ciddiyeti","Tedavinin yararı"],e:"Maliyet: sağlık davranışının zaman, para, enerji açısından maliyeti, ağrı ve rahatsızlık gibi olası yan etkileri."},
{q:"Pender'in modeli hangi yıllarda revize edilmiştir?",a:"1987 ve 1996",w:["1980 ve 1990","1990 ve 2000","1970 ve 1980"],e:"Pender tarafından 1980 yılında geliştirilmiş olup 1987 ve 1996 yılında revize edilmiştir."},
{q:"Neuman'ın Sağlık/Hastalık Sürekliliği Modeli'nde çizgi üzerindeki sıralama nedir?",a:"Üst düzey iyilik – iyi düzey – normal – hastalık – ölüm",w:["Ölüm – hastalık – normal – iyi düzey – üst düzey iyilik","Normal – hastalık – ölüm – iyi düzey – üst düzey iyilik","İyi düzey – normal – hastalık – ölüm – üst düzey iyilik"],e:"Çizgi üzerindeki durumlar: üst düzey iyilik (esenlik) → iyi düzey → normal → hastalık → ölüm."},
{q:"Üst Düzey Esenlik Modeli'nin amacı nedir?",a:"Bireyin sağlık potansiyelini en üst düzeye çıkarmak",w:["Hastalığı tedavi etmek","İlaç kullanımını azaltmak","Hastane yatışını azaltmak"],e:"Modelin amacı bireyin sağlık potansiyelini en üst düzeye çıkarmaktır. Sağlık bakımı hastalığın tedavisinden çok, bireyin sağlığını geliştirme ve hastalığı önleme aktivitelerini kapsar."},
{q:"Suchman'a göre 2. evre nedir?",a:"Hasta rolünü üstlenme",w:["Semptomların yaşanması","Tıbbi bakımla temas","Bağımlı hasta rolü"],e:"2. Hasta rolünü üstlenme: Bireyin hasta olduğunu ve yardıma ihtiyacı olduğunun fark edilmesi."},
{q:"Suchman'a göre 3. evre nedir?",a:"Tıbbi bakım ile temas",w:["Semptomların yaşanması","Hasta rolünü üstlenme","Bağımlı hasta rolü"],e:"3. Tıbbi bakım ile temas: Profesyonel yardım almaya karar verilmesi."},
{q:"Hemşirelik Kanunu'nda hemşire unvanı kimlere verilir?",a:"Lisans eğitimi veren fakülte/yüksekokul mezunu ve diploması Sağlık Bakanlığınca tescilli olanlara",w:["Sağlık meslek lisesi mezunlarına","Yalnızca yüksek lisans mezunlarına","Yalnızca doktora mezunlarına"],e:"Türkiye'de üniversitelerin hemşirelik ile ilgili lisans eğitimi veren fakülte ve yüksekokullarından mezun olan ve diplomaları sağlık bakanlığınca tescil edilenlere Hemşire ünvanı verilir."},
{q:"Hemşireler acil haller dışında tedavileri nasıl uygular?",a:"Tabip tarafından yazılı olarak verilen tedavileri uygular",w:["Sözlü talimatla","Kendi kararıyla","Hemşire kararıyla"],e:"Madde 4: Hemşireler; tabip tarafından acil haller dışında yazılı olarak verilen tedavileri uygulamakla görevli ve yetkilidir."},
{q:"Hemşireler her ortamda neyi belirlemekle görevlidir?",a:"Bireyin, ailenin ve toplumun hemşirelik girişimleri ile karşılanabilecek sağlıkla ilgili ihtiyaçlarını",w:["Yalnızca hastanın ilaç ihtiyacını","Yalnızca cerrahi ihtiyacını","Yalnızca beslenme ihtiyacını"],e:"Hemşireler; her ortamda bireyin, ailenin ve toplumun hemşirelik girişimleri ile karşılanabilecek sağlıkla ilgili ihtiyaçlarını belirlemekle görevlidir."},
{q:"Hemşirelik tanılama süreci kapsamında hemşire ne yapar?",a:"Hemşirelik bakımını planlar, uygular, denetler ve değerlendirir",w:["Yalnızca ilaç verir","Yalnızca rapor yazar","Yalnızca hasta kaydı tutar"],e:"Hemşirelik tanılama süreci kapsamında belirlenen ihtiyaçlar çerçevesinde hemşirelik bakımını planlamak, uygulamak, denetlemek ve değerlendirmekle görevli ve yetkilidir."},
{q:"Hemşirenin mesleki sorumlulukları arasında hangisi yer alır?",a:"Mesleki uygulama standartlarının geliştirilmesine katkıda bulunmak",w:["Sağlık ekibinden kaçınmak","Bilgi ve beceriyi geliştirmemek","Araştırmalara katılmamak"],e:"Mesleki sorumluluklar: uygulamaların sorumluluğunu üstlenmek; standartları geliştirmek; bilgi-beceriyi geliştirmek; mesleğin onurunu yansıtmak; araştırmalara katılmak; mesleki örgütü güçlendirmek; ekiple iş birliği yapmak; öğrencilere ortam hazırlamak."},
{q:"Hemşire neden mesleki örgütlenmeye katkıda bulunmalıdır?",a:"Çalışma yaşamı, sosyal ve ekonomik koşulların geliştirilmesi için",w:["Yalnızca maaş için","Yalnızca unvan için","Yalnızca tatil için"],e:"Mesleki örgütlenmenin güçlendirilmesine ve mesleki örgütü aracılığıyla hemşirelerin çalışma yaşamı, sosyal ve ekonomik koşullarının geliştirilmesine katkıda bulunur."},
{q:"Hemşire öğrencilere karşı sorumluluğu nedir?",a:"Uygun öğrenme ortamlarının hazırlanması ve desteklenmesi",w:["Yalnızca not vermek","Yalnızca ders anlatmak","Yalnızca sınav yapmak"],e:"Hemşirelik öğrencilerine uygun öğrenme ortamlarının hazırlanması ve desteklenmesinde sorumluluk üstlenir."},
{q:"Çağdaş hemşirelik rolleri neyi gösterir?",a:"Hemşireliğin sadece hasta bakımıyla sınırlı olmadığını",w:["Hemşireliğin yalnızca hastanede yapıldığını","Hemşireliğin yalnızca ilaç verdiğini","Hemşireliğin yalnızca doktora yardım ettiğini"],e:"Çağdaş hemşirelik rolleri, hemşireliğin sadece hasta bakımıyla sınırlı olmadığını, toplum sağlığından araştırmaya, eğitimden liderliğe kadar geniş bir yelpazede görevler üstlendiğini gösterir."},
{q:"Bakım rolü nedir?",a:"Hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak",w:["Hastaları eğitmek","Araştırma yapmak","Ekip yönetmek"],e:"Bakım rolü (Caregiver): hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak, güvenli ve etkili bakım sunmak."},
{q:"Eğitici rol nedir?",a:"Hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek",w:["İlaç uygulamak","Araştırma yapmak","Ekip yönetmek"],e:"Öğretici/Eğitici rol: hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek."},
{q:"Danışman/rehber rol nedir?",a:"Bireyleri sağlık kararlarında yönlendirmek ve haklarını korumak",w:["İlaç uygulamak","Yara bakımı yapmak","Vital bulguları izlemek"],e:"Danışman/Rehber rol: bireyleri, aileleri veya toplumu sağlık kararlarında yönlendirmek; haklarını korumak."},
{q:"Araştırmacı rol nedir?",a:"Hemşirelik uygulamalarını geliştirmek için araştırma yapmak",w:["İlaç uygulamak","Hasta eğitimi vermek","Ekip yönetmek"],e:"Araştırmacı/Bilimsel rol: hemşirelik uygulamalarını geliştirmek için araştırma yapmak, veri toplamak ve analiz etmek."},
{q:"Yönetici/lider rol nedir?",a:"Hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak",w:["İlaç uygulamak","Araştırma yapmak","Hasta eğitimi vermek"],e:"Yönetici/Lider rol: hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak."},
{q:"Toplum sağlığı hemşiresi rolü nedir?",a:"Bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek",w:["Yalnızca hastane bakımı","Yalnızca ilaç uygulama","Yalnızca araştırma"],e:"Toplum sağlığı hemşiresi: bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek. Aşı kampanyaları, sağlık taramaları, eğitim programları düzenlemek."},
{q:"Liderlik ve politik rol nedir?",a:"Sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek",w:["İlaç uygulamak","Yara bakımı yapmak","Hasta eğitimi vermek"],e:"Liderlik ve Politik rol: sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek."},
{q:"Kuramın bileşenlerinden 'ilişkisel açıklamalar' neyi yapar?",a:"Kavramları ve alt değişkenleri açıklar, kavramların ilişkilerini ölçer",w:["Kavramları sınıflandırır","Ölçülmesini sağlar","Gereksiz kavramları içerir"],e:"İlişkisel açıklamalar/ifadeler: kuramsal ifadeler, işlevsel ifadeler. Kavramları ve alt değişkenleri açıklar, kavramların ilişkilerini ölçer."},
{q:"Kuramın bileşenlerinden 'bağlantılar ve düzenleme' neyi yapar?",a:"Kuramsal açıklamaların somutlaşmasını sağlar, değişkenlerin nasıl ölçüldüğünü gösterir",w:["Kavramları sınıflandırır","Yalnızca tanım yapar","Yalnızca ölçer"],e:"Bağlantılar ve düzenleme: kuramsal açıklamaların somutlaşmasını sağlar; değişkenlerin nasıl ölçüldüğünü gösterir; gereksiz kavramları içermez; tutarsızlıkları ortadan kaldırır."},
{q:"Bir kuramın kabul edilebilmesi için ne gerekir?",a:"Kavramlar, tanımlar, açıklamalar, bağlantılar net olmalı ve önerme/hipotezlerle örüntülenmeli",w:["Yalnızca tek bir kavram içermeli","Yalnızca sözlü olmalı","Yalnızca tek bir bilim insanı tarafından oluşturulmalı"],e:"Bir kuramın tam olarak kabul edilebilmesi için kavramları, tanımları, açıklamaları, bağlantıları ve bunlar arasındaki ilişkiyi net olarak açıklaması; önerme ve hipotezlerle örüntülenmiş olması gerekir."},
{q:"Grand kuramın özelliği nedir?",a:"Kapsam olarak çok büyük ve karmaşıktır",w:["Kapsamı sınırlıdır","Uygulamaya doğrudan temel olur","Yalnızca tanılamada yol gösterir"],e:"Grand kuram: kapsam olarak çok büyük ve karmaşıktır. İleri düzey araştırmaları gerektirir. Özellikle hemşirelik uygulamalarına temel olmaz."},

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function addXP(n){STATE.xp+=n;if(STATE.user)saveUser()}
function checkBadges(){for(const b of BADGES){if(!STATE.badges.includes(b.n)&&b.c(STATE)){STATE.badges.push(b.n);toast(`🏅 Rozet kazandın: ${b.n}!`)}}}

async function saveUser(){
if(!fbReady||!STATE.user)return;
try{
  await db.collection('ogrenciler').doc(STATE.user.no).set({
    ad:STATE.user.ad,soyad:STATE.user.soyad,no:STATE.user.no,
    xp:STATE.xp,correct:STATE.correct,wrong:STATE.wrong,maxCombo:STATE.maxCombo,
    badges:STATE.badges,munlocked:STATE.unlocked,mstars:STATE.stars,cw:STATE.cw||{},
    tfWins:STATE.tfWins||0,matchWins:STATE.matchWins||0,taBest:STATE.taBest||0,hmBest:STATE.hmBest||0,wbBest:STATE.wbBest||0,
    lastUpdate:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}catch(e){console.warn("Kayıt hatası:",e)}
}

async function loadLeaderboard(){
if(!fbReady)return[];
try{
  const snap=await db.collection('ogrenciler').orderBy('xp','desc').limit(10).get();
  return snap.docs.map(d=>d.data());
}catch(e){console.warn("Skor tablosu hatası:",e);return[]}
}

async function loadAllStudents(){
if(!fbReady)return[];
try{
  const snap=await db.collection('ogrenciler').orderBy('xp','desc').get();
  return snap.docs.map(d=>d.data());
}catch(e){console.warn("Öğrenci listesi hatası:",e);return[]}
}

async function deleteStudent(no){
if(!fbReady)return;
try{await db.collection('ogrenciler').doc(no).delete();toast('Öğrenci silindi');}catch(e){toast('Silme hatası')}
}

async function checkStudentExists(no){
if(!fbReady)return false;
try{const d=await db.collection('ogrenciler').doc(no).get();return d.exists}catch(e){return false}
}

function toggleAdminLogin(){const e=$('#adminLogin');if(e)e.classList.toggle('hidden')}

async function doLogin(){
const no=$('#loginNo').value.trim();
const pass=$('#loginPass').value.trim();
if(!no||!pass){toast('Lütfen tüm alanları doldurun');return}
STATE.loading=true;renderAuth();
if(!fbReady){toast('Firebase bağlantısı yok');STATE.loading=false;renderAuth();return}
try{
  const doc=await db.collection('ogrenciler').doc(no).get();
  if(!doc.exists){toast('Öğrenci bulunamadı. Kayıt olun.');STATE.loading=false;renderAuth();return}
  const data=doc.data();
  if(data.pass!==pass){toast('Şifre yanlış!');STATE.loading=false;renderAuth();return}
  STATE.user={ad:data.ad,soyad:data.soyad,no:data.no};
  STATE.xp=data.xp||0;STATE.correct=data.correct||0;STATE.wrong=data.wrong||0;
  STATE.maxCombo=data.maxCombo||0;STATE.badges=data.badges||[];STATE.unlocked=Math.min(data.munlocked||1,MODS.length);
  STATE.stars=data.mstars||{};STATE.cw=data.cw||{};
  STATE.tfWins=data.tfWins||0;STATE.matchWins=data.matchWins||0;STATE.taBest=data.taBest||0;STATE.hmBest=data.hmBest||0;STATE.wbBest=data.wbBest||0;
  STATE.loading=false;
  toast(`Hoş geldin ${data.ad}!`);
  renderMenu();
}catch(e){console.error(e);toast('Giriş hatası');STATE.loading=false;renderAuth()}
}

function doAdminLogin(){
const u=$('#adminUser').value.trim();
const p=$('#adminPass').value.trim();
if(u===ADMIN_USER&&p===ADMIN_PASS){
  STATE.isAdmin=true;STATE.user={ad:"Akademisyen",soyad:"",no:"admin"};
  toast('Hoş geldin Akademisyen!');
  renderAdminPanel();
}else{toast('Kullanıcı adı veya şifre yanlış!')}
}

async function doRegister(){
const ad=$('#regAd').value.trim();
const soyad=$('#regSoyad').value.trim();
const no=$('#regNo').value.trim();
const pass=$('#regPass').value.trim();
const pass2=$('#regPass2').value.trim();
if(!ad||!soyad||!no||!pass){toast('Tüm alanları doldurun');return}
if(pass.length<4){toast('Şifre en az 4 karakter olmalı');return}
if(pass!==pass2){toast('Şifreler uyuşmuyor');return}
if(!fbReady){toast('Firebase bağlantısı yok');return}
STATE.loading=true;renderAuth();
try{
  const exists=await checkStudentExists(no);
  if(exists){toast('Bu numara zaten kayıtlı!');STATE.loading=false;renderAuth();return}
  await db.collection('ogrenciler').doc(no).set({
    ad,soyad,no,pass,xp:0,correct:0,wrong:0,maxCombo:0,badges:[],munlocked:1,mstars:{},
    tfWins:0,matchWins:0,taBest:0,hmBest:0,wbBest:0,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  STATE.user={ad,soyad,no};
  STATE.xp=0;STATE.correct=0;STATE.wrong=0;STATE.maxCombo=0;STATE.badges=[];STATE.unlocked=1;STATE.stars={};STATE.cw={};
  STATE.tfWins=0;STATE.matchWins=0;STATE.taBest=0;STATE.hmBest=0;STATE.wbBest=0;
  STATE.loading=false;
  toast(`Kayıt başarılı! Hoş geldin ${ad}`);
  renderMenu();
}catch(e){console.error(e);toast('Kayıt hatası: '+e.message);STATE.loading=false;renderAuth()}
}

async function loadLeaderboardInto(sel){
const el=$(sel);if(!el)return;
const data=await loadLeaderboard();
if(!data.length){el.innerHTML='<p class="sub">Henüz skor yok. İlk sen ol!</p>';return}
el.innerHTML=data.map((d,i)=>{
const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
const me=STATE.user&&STATE.user.no===d.no?'me':'';
return `<div class="lb-row ${me}">
<div class="lb-rank">${medal}</div>
<div class="lb-name">${d.ad} ${d.soyad}<div class="lb-sub">No: ${d.no} • ${d.correct||0} doğru • ${d.maxCombo||0} kombo</div></div>
<div class="lb-score">${d.xp||0} Puan</div>
</div>`}).join('');
}

// Tekrarlayan soruları ayıkla, havuzu konu sırasına göre 10 dilime böl, her dilimden eşit sayıda seç (karma)
function mixedPool(n){
 const seen=new Set(),uniq=QUESTIONS.filter(q=>!seen.has(q.q)&&seen.add(q.q));
 const parts=10,size=Math.ceil(uniq.length/parts),per=Math.ceil(n/parts);let out=[];
 for(let p=0;p<parts;p++)out=out.concat(shuffle(uniq.slice(p*size,(p+1)*size)).slice(0,per));
 return shuffle(out).slice(0,n);
}
function startBoss(){
STATE.mode="boss";STATE.qi=0;STATE.hp=3;STATE.combo=0;STATE.correct=0;STATE.wrong=0;STATE.bossHp=100;STATE.bossMaxHp=100;STATE.review=[];
levelQuestions=mixedPool(20);

}

function bossPick(i){
if(STATE.answered)return;STATE.answered=true;clearTimer();

const dmg=10+Math.min(STATE.combo,5)*2;STATE.bossHp=Math.max(0,STATE.bossHp-dmg);addXP(1);showCombo(STATE.combo);

fb=`<p><b>💥 Boss sana vurdu!</b> Doğru cevap: <b>${q.a}</b></p>`;

const TR=x=>x.toLocaleUpperCase('tr-TR');
let CW={set:0,words:[],grid:null,dir:'A'};

function cwBuild(words){
 let best=null;
 for(let t=0;t<150;t++){
  const grid=new Map(),placed=[];
  const order=shuffle(words).sort((a,b)=>b[0].length-a[0].length+(Math.random()-.5)*3);
  const key=(r,c)=>r+','+c;
  const can=(w,r,c,d)=>{
   const dr=d==='A'?0:1,dc=d==='A'?1:0,L=w.length;
   if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*L,c+dc*L)))return -1;
   let x=0;
   for(let i=0;i<L;i++){
    const rr=r+dr*i,cc=c+dc*i,e=grid.get(key(rr,cc));
    if(e){if(e.ch!==w[i]||e.dirs.has(d))return -1;x++}
    else if(grid.has(key(rr+dc,cc+dr))||grid.has(key(rr-dc,cc-dr)))return -1;
   }
   return x;
  };
  const put=(o,r,c,d)=>{
   const dr=d==='A'?0:1,dc=d==='A'?1:0;
   o.w.forEach((ch,i)=>{const k=key(r+dr*i,c+dc*i);const e=grid.get(k)||{ch,dirs:new Set()};e.dirs.add(d);grid.set(k,e)});
   placed.push({...o,r,c,d});
  };
  order.forEach((wc,idx)=>{
   const o={w:Array.from(TR(wc[0])),clue:wc[1],raw:TR(wc[0])};
   if(!idx){put(o,0,0,'A');return}
   let cands=[];
   for(const d of ['A','D'])for(const [k,e] of grid){
    const [r0,c0]=k.split(',').map(Number);
    o.w.forEach((ch,i)=>{if(ch!==e.ch)return;
     const r=d==='A'?r0:r0-i,c=d==='A'?c0-i:c0;
     const x=can(o.w,r,c,d);if(x>0)cands.push({r,c,d,x});});
   }
   if(cands.length){const m=Math.max(...cands.map(z=>z.x));const p=shuffle(cands.filter(z=>z.x===m))[0];put(o,p.r,p.c,p.d)}
  });
  const ar=(()=>{const k=[...grid.keys()].map(x=>x.split(',').map(Number));return (Math.max(...k.map(x=>x[0]))-Math.min(...k.map(x=>x[0]))+1)*(Math.max(...k.map(x=>x[1]))-Math.min(...k.map(x=>x[1]))+1)})();
  if(!best||placed.length>best.placed.length||(placed.length===best.placed.length&&ar<best.ar))best={grid,placed,ar};
   }
 const rs=[...best.grid.keys()].map(k=>+k.split(',')[0]),cs=[...best.grid.keys()].map(k=>+k.split(',')[1]);
 const r0=Math.min(...rs),c0=Math.min(...cs);
 best.placed.forEach(p=>{p.r-=r0;p.c-=c0});
 best.H=Math.max(...rs)-r0+1;best.W=Math.max(...cs)-c0+1;
 const sorted=[...best.placed].sort((a,b)=>a.r-b.r||a.c-b.c);let n=0,last='';
 sorted.forEach(p=>{const k=p.r+','+p.c;if(k!==last){n++;last=k}p.n=n});
 return best;
}

function openCrossword(i){
 STATE.mode="cw";CW.set=i;CW.dir='A';
 const set=CW_SETS[i],b=cwBuild(set.w);CW.grid=b;
 const done=(STATE.cw&&STATE.cw[i])||[];
 const num={};b.placed.forEach(p=>{num[p.r+','+p.c]=p.n});
 const cell={};b.placed.forEach(p=>p.w.forEach((ch,k)=>{const r=p.r+(p.d==='D'?k:0),c=p.c+(p.d==='A'?k:0);cell[r+','+c]=ch}));
 let rows='';
 for(let r=0;r<b.H;r++){rows+='<tr>';for(let c=0;c<b.W;c++){const k=r+','+c;
  rows+=cell[k]?`<td class="cwc">${num[k]?`<i>${num[k]}</i>`:''}<input maxlength="1" data-r="${r}" data-c="${c}" autocomplete="off" oninput="cwType(this)" onfocus="cwFocus(this)"></td>`:'<td class="cwx"></td>'}rows+='</tr>'}
 const clues=d=>b.placed.filter(p=>p.d===d).sort((x,y)=>x.n-y.n).map(p=>`<div class="cwq" id="q${p.n}${d}"><b>${p.n}.</b> ${p.clue} <small>(${p.w.length})</small></div>`).join('');
 $('#app').innerHTML=`
 <div class="top"><span class="pill gold">⭐ ${STATE.xp} Puan</span><button class="btn small sec" onclick="renderCrossword()">◀ Bulmacalar</button></div>
 <div class="card"><h2>${set.i} ${set.t}</h2>
 <p class="sub">Kutuya dokun, harfleri yaz. Ardından “Kontrol Et”e bas.</p>
 <div class="cwwrap"><table class="cw">${rows}</table></div>
 <div class="helper" style="margin-top:12px"><button onclick="cwCheck()">✅ Kontrol Et</button><button onclick="openCrossword(${i})">🔀 Yeni Düzen</button></div>
 <h3>➡️ Soldan Sağa</h3>${clues('A')}<h3 style="margin-top:10px">⬇️ Yukarıdan Aşağı</h3>${clues('D')}</div>`;
 b.placed.forEach(p=>{if(done.includes(p.raw))cwFill(p,true)});
}

function cwInput(r,c){return document.querySelector(`.cw input[data-r="${r}"][data-c="${c}"]`)}
function cwFill(p,lock){p.w.forEach((ch,k)=>{const inp=cwInput(p.r+(p.d==='D'?k:0),p.c+(p.d==='A'?k:0));if(inp){inp.value=ch;inp.parentElement.classList.add('ok');if(lock)inp.readOnly=true}});const q=document.getElementById('q'+p.n+p.d);if(q)q.classList.add('solved')}
function cwFocus(inp){
 const r=+inp.dataset.r,c=+inp.dataset.c,ps=CW.grid.placed.filter(p=>p.d==='A'?(p.r===r&&c>=p.c&&c<p.c+p.w.length):(p.c===c&&r>=p.r&&r<p.r+p.w.length));
 if(ps.length&&!ps.some(p=>p.d===CW.dir))CW.dir=ps[0].d;
 document.querySelectorAll('.cwq').forEach(q=>q.classList.remove('act'));
 const a=ps.find(p=>p.d===CW.dir)||ps[0];if(a){const q=document.getElementById('q'+a.n+a.d);if(q)q.classList.add('act')}
}
function cwType(inp){
 inp.value=TR(inp.value).slice(-1);
 if(!inp.value)return;
 const r=+inp.dataset.r+(CW.dir==='D'?1:0),c=+inp.dataset.c+(CW.dir==='A'?1:0);
 const n=cwInput(r,c);if(n)n.focus();
}
function cwCheck(){
 const set=CW.set;STATE.cw=STATE.cw||{};const done=STATE.cw[set]=STATE.cw[set]||[];
 let ok=0,gained=0,bad=0;
 CW.grid.placed.forEach(p=>{
  const got=p.w.map((ch,k)=>{const i=cwInput(p.r+(p.d==='D'?k:0),p.c+(p.d==='A'?k:0));return i?i.value:''}).join('');
  if(got===p.raw){ok++;if(!done.includes(p.raw)){done.push(p.raw);gained++}cwFill(p,true)}
  else if(got.length===p.w.length)bad++;
 });
 if(gained){addXP(gained);checkBadges();document.querySelector('.top .pill.gold').textContent=`⭐ ${STATE.xp} Puan`}
 const total=CW.grid.placed.length;
 toast(ok===total?`🎉 Bulmaca tamam! +${gained} Puan`:`✅ ${ok}/${total} doğru${gained?` • +${gained} Puan`:''}${bad?` • ${bad} kelime hatalı`:''}`);
}

S(4,"Atravmatik Bakım",`<p>Hastaya <strong>fiziksel veya psikolojik travma oluşturmadan</strong> bakım verme yaklaşımıdır. Özellikle pediatri ve yoğun bakımda kullanılır, tüm hastalara uygulanabilir.</p><h3>Amaçlar</h3><ul><li><strong>Fiziksel travmayı azaltmak:</strong> gereksiz iğne/invaziv girişimden kaçınmak, işlemleri birleştirmek.</li><li><strong>Psikolojik travmayı önlemek:</strong> korku, kaygı, yalnızlığı azaltmak (aileyi çocuğun yanında tutmak).</li><li><strong>Ailenin sürece katılımı</strong>nı sağlamak.</li><li><strong>Hastanın kontrol duygusunu</strong> desteklemek (bilgi vermek, karara katmak).</li></ul><h3>İlkeler ve örnekler</h3><ul><li>Bilgilendirme, güvenli ortam, uygun ağrı kontrolü, mahremiyet ve onura saygı, duygusal destek.</li><li>Parenteral uygulama öncesi <em>bölgesel analjezik</em>, bebek masajı, oyuncak/resimle dikkati dağıtma, acı veren işlemleri aynı anda yapma.</li></ul>`,-2);
S(4,"Evde Bakım",`<p>Bireyin sağlık ve sosyal gereksinimlerinin profesyonel ekipler tarafından <strong>kendi evinde</strong> karşılanmasıdır.</p><h3>Kimler alabilir?</h3><p>Yaşlı ve hareket kısıtlı bireyler, kronik hastalar (diyabet, KOAH, kalp yetmezliği), ameliyat sonrası iyileşenler, palyatif bakım gerekenler, engelliler, yara bakımı gerekenler.</p><h3>Amaçlar</h3><p>Yaşam kalitesini yükseltmek, hastaneye bağımlılığı azaltmak, <strong>erken taburculuğu desteklemek</strong>, kronik hastalık yönetimini kolaylaştırmak, aileyi desteklemek.</p><h3>Kapsam</h3><p>Tıbbi hizmetler, hemşirelik hizmetleri (enjeksiyon, pansuman, yara/kateter bakımı), fizyoterapi, psikolojik destek, sosyal hizmetler, bakım hizmetleri (banyo, beslenme, mobilizasyon).</p><h3>Avantaj / Dezavantaj</h3><ul><li><strong>+</strong> Tanıdık ortam (stres azalır), enfeksiyon riski daha az, daha ekonomik, aile katılımı, bağımsızlık korunur.</li><li><strong>−</strong> Profesyonel destek sürekli olmayabilir, acilde ulaşım gecikebilir, aile üzerinde bakım yükü.</li></ul>`,-1);
S(4,"Evde Bakım Hemşiresinin Sorumlulukları",`<ol><li><strong>Bakım gereksinimlerini değerlendirme:</strong> hasta + ev ortamı (temizlik, güvenlik, ısı, ışık) + ailenin bilgi/beceri düzeyi.</li><li><strong>Bakım planı hazırlama:</strong> bireye özel plan; gerekirse hekim, fizyoterapist, diyetisyen, psikologla iş birliği.</li><li><strong>Tedavi ve bakım uygulama:</strong> hekim tedavileri, yara/kateter/sonda bakımı, kan şekeri ve tansiyon ölçümü, yaşamsal bulgu izlemi, acilde ilk müdahale.</li><li><strong>Eğitim ve danışmanlık:</strong> hastalık, ilaç kullanımı, hijyen, beslenme, pozisyon, egzersiz.</li><li><strong>İzlem ve raporlama:</strong> düzenli gözlem, her ziyaret sonrası <em>bakım notu</em> (tarih, uygulama, gözlem, öneri).</li><li><strong>Psikososyal destek:</strong> kaygı, yalnızlık, korkuyu fark eder; gerekirse psikolojik danışmanlığa yönlendirir.</li><li><strong>Etik ve yasal sorumluluk:</strong> mahremiyet, onam, yetki sınırları.</li><li><strong>Ekip çalışması ve koordinasyon.</strong></li></ol>`);
S(4,"Bireyselleştirilmiş Bakım",`<p>Her hastayı <strong>benzersiz</strong> kabul edip gereksinim, değer, inanç, yaşam biçimi ve beklentilerine göre planlanan bakımdır: <em>“Herkese aynı bakım” değil, “her bireye kendi özelliklerine uygun bakım”.</em></p><h3>Amaçlar</h3><p>Fiziksel, duygusal, sosyal, ruhsal bütünlüğü korumak; hastayı bakımın merkezine almak; katılım ve kontrol duygusunu artırmak; yaşam kalitesini yükseltmek; bakımı insan onuruna yakışır yürütmek.</p><h3>Özellikler</h3><ul><li><strong>Hasta merkezli, kapsamlı, katılımcı, saygılı, esnek.</strong></li></ul><h3>Örnekler</h3><ul><li>Diyabetli: beslenme alışkanlığına göre diyet planı.</li><li>Yaşlı: görme/işitme sorununa göre iletişim.</li><li>Dini inanç: bakım zamanı/yöntemi ayarlanır.</li><li>Çocuk: oyunla iletişim, yaşına uygun anlatım.</li></ul>`);
S(4,"Bütüncül Bakım",`<p>Bireyin yalnızca bedensel değil, <strong>zihinsel, duygusal, sosyal, kültürel ve ruhsal</strong> yönlerini de dikkate alarak bakım vermektir.</p><h3>Boyutlar</h3><ul><li><strong>Fiziksel:</strong> beslenme, hijyen, uyku, ağrı kontrolü, ilaç, günlük yaşam aktiviteleri.</li><li><strong>Duygusal:</strong> kaygı, korku, stresi fark etme; güven ve destek ortamı.</li><li><strong>Sosyal:</strong> aile/arkadaş katılımı, sosyal destek sistemleri.</li><li><strong>Ruhsal:</strong> inanç ve değerlere saygı, dini/manevi ihtiyaçlar.</li><li><strong>Kültürel:</strong> dil, giyim, beslenme farklılıklarına saygı.</li></ul><h3>Hemşirenin rolü</h3><p>Hastayı bütün olarak değerlendirir, beden-zihin-ruh dengesini gözetir, etkili iletişim kurar, gerektiğinde psikolog/diyetisyen/sosyal hizmet uzmanıyla iş birliği yapar; <em>empati, saygı, güven, sevgi</em> ilkelerini uygular.</p><p><strong>Örnek:</strong> ameliyat sonrası ağrı kadar korkuya da önem vermek; yalnızlık hisseden yaşlıya sosyal destek sağlamak.</p>`);
S(4,"Palyatif Bakım",`<p>Yaşamı tehdit eden hastalığı olan bireylerin <strong>yaşam kalitesini artırmak, acı ve sıkıntılarını hafifletmek</strong> amacıyla verilen destekleyici bakımdır; aileye de destek sağlar. Amaç hastalığı <em>tedavi etmek değil</em>, rahatlık ve konforu sürdürmektir.</p><h3>Örnek durumlar</h3><p>İleri evre kanser; kronik kalp, böbrek, akciğer yetmezliği; ALS, Alzheimer, Parkinson; yaşamın son dönemindeki yaşlılar.</p><h3>Amaçlar</h3><p>Ağrı ve semptom kontrolü; fiziksel, psikolojik, sosyal, ruhsal destek; aileyi desteklemek; <strong>onurlu ve huzurlu bir son dönem</strong>.</p><h3>Dikkat edilecekler</h3><ul><li>Tedavi edici değil <strong>rahatlatıcı</strong> yaklaşım.</li><li>Ekip çalışması (doktor, hemşire, psikolog, sosyal hizmet uzmanı, manevi danışman).</li><li>Hasta ve aile aktif karar verici.</li><li>İnanç/kültür/değerlere, onur ve mahremiyete saygı; gereksiz müdahaleden kaçınma.</li></ul>`);
S(4,"Bakımın Algılanması ve Niteliği",`<h3>Bakımın niteliğini etkileyen etmenler</h3><p>Bakım uygulamalarının önemsenmemesi, hastane yönetim biçimi, bakımın ekip çalışması olarak görülmemesi, hemşirelerin bakım algısı, mesleki bilgi-beceri yetersizliği, olumsuz çalışma şartları.</p><h3>Kim nasıl algılıyor?</h3><ul><li><strong>Hemşireler:</strong> sempati ve saygı, kendini verme, iletişim, gereksinimlerin karşılanması, bireysel yaklaşım, dürüstlük. En önemli davranışlar: hastanın insan olarak değerliliği, saygı, duyarlılık, hastayla konuşma, bilgilerin gizliliği, dinleme.</li><li><strong>Öğrenciler:</strong> hastaya saygı, yardım ve değer verme, bilgi-beceri, duyarlılık.</li><li><strong>Hasta/aile:</strong> insancıllık, güven-umut, duyarlılık, gülümseme, destekleyici davranış. Türkiye: tedavinin zamanında yapılması, nazik yaklaşım, ulaşılabilirlik, sıcak iletişim.</li></ul><p><strong>Ortak temalar:</strong> saygı, duyarlılık, ilgili olma, değer verme. Hasta/aile ayrıca açık-net bilgi ve soruların yanıtlanmasını bekler.</p>`);
S(4,"Sonuç: Bakımı Özgün Kılan Nedir?",`<ul><li>Bakım <strong>çok boyutludur</strong>; tanımı kültür, değer, deneyim ve ilişkilerden şekillenir.</li><li>Karşılıklı ilişki ve güvene dayanır, ahlaki boyutu vardır; hemşireliğin temel erdemidir.</li><li>Bakımı <em>hemşirelik bakımı</em> yapan: ahlaki ve duyuşsal yönlerin <strong>profesyonel bilgi ve becerilerle birleştirilerek</strong> hemşire-hasta ilişkisine yansıtılmasıdır.</li><li>Bireyin hastalığını nasıl algıladığını anlamadan bakım zordur.</li><li><strong>“Orada olma”</strong> = hastaya varlığını hissettirmek. <strong>Dinleme</strong> = söyleneni anlamak, yorumlamak ve beklenen yanıtı vermek.</li></ul><p class="center"><em>Hemşire aklıyla bakar, yüreğiyle hisseder, bilgisiyle hayat verir.</em></p>`);

S(5,"Hastane ve Hastanın Gereksinimleri",`<p>Bireyler hastaneye <strong>bozulmak üzere olan ya da bozulan sağlıklarını kazanmak</strong> için başvurur. Hastane, birey için yabancı, ürkütücü ve bilinmeyenlerle dolu bir ortamdır; birey hastalığına ek olarak bu çevreye uyum sağlamak zorundadır.</p><ul><li>Kliniğe kabul ve <strong>ilk günler</strong> çok önemlidir; <strong>ilk 24 saat</strong> endişenin en yüksek olduğu dönemdir.</li><li>Kronik ve yatarak tedavi gören hastalar fiziksel çevreden daha çok etkilenir.</li><li>Hemşire hastanın durumunun farkında olmalı, onu anlamaya çalışmalı ve uyum için gerekli düzenlemeleri yapmalıdır.</li></ul><h3>Hastanın gereksinimleri</h3><p>Güven, personele güven, sevgi-saygı, benlik saygısı, bağımsızlık ve inisiyatif, <strong>gizlilik</strong>; yatak çevresinde oturma yeri; gereksinimini karşılayabileceği oda düzeni; kalkabilenler için yemek ve oturma-konuşma odası; tekerlekli sandalyeliler için lavabo, tuvalet, banyo/duş sistemi.</p>`);
S(5,"Hasta Odası Düzeni ve Personel Gereksinimleri",`<ul><li>Her hasta için rahat karyola-yatak (<strong>pencerenin karşısına</strong>), koltuk, aydınlatılmış depo alanı, hareketli yemek masası, etajer, dolap ve <strong>metal çöp kovası</strong>.</li><li><strong>Yataklı Tedavi Kurumları İşletme Yönetmeliği:</strong> odalar bir veya iki kişilik esastır. Tek yataklı oda en az <strong>9 m²</strong>, çok yataklı odada yatak başına en az <strong>7 m²</strong>.</li></ul><h3>Hemşire gereksinimleri</h3><p>Hastaya ulaşma ve gözlem kolaylığı, acilde ekibi çağırma kolaylığı, kalkamayan hastalara bakım için geniş alan, yatağa yakın ve tam donanımlı tedavi odası, servis içinde dolap/tuvalet/malzeme odası.</p><h3>Doktor gereksinimleri</h3><p>Gizlilikte muayene odası, <strong>izolasyon odası</strong>, enfeksiyon yayılımını önleyen düzen, not alma ve eğitim alanı, hemşireye kolay ulaşım, aile ile görüşme odası.</p>`);
S(5,"Güvenli Ortam",`<p>Güvenli ortam: bireyin yaşam aktivitelerini sağlıklı yerine getirdiği ve <strong>güven duygusu</strong> hissettiği ortamdır. Dört koruma:</p><ul><li><strong>Kazalardan</strong> korunma</li><li><strong>Yangınlardan</strong> korunma</li><li><strong>Enfeksiyonlardan</strong> korunma</li><li><strong>Çevre kirliliğinden</strong> korunma</li></ul><p>Güvenli ortam fiziksel, kimyasal, mikroorganizma, radyasyon, psikolojik tehlikelerden uzak, hoşa gitmeyen koku, ses, görüntü ve temastan arınmış olmalıdır.</p><p><strong>Temel ilke:</strong> hastanelerin hastalara zarar vermemesi. Korku ve güvensizlik kaza riskini artırır; hastalar özellikle <em>düşme, yanık ve yanlış ilaç</em> tehlikeleriyle karşılaşabilir.</p><p><strong>Nightingale (1857):</strong> hastanın fiziksel çevresi psikolojik durumunu, hastalığı kabullenmesini ve hastanede yatma süresini etkiler.</p>`);
S(5,"Isı, Nem, Havalandırma",`<h3>Isı</h3><ul><li>Normalde <strong>20–25 °C</strong>. Çocuk/yaşlı odalarında daha sıcak; yatak banyosunda oda biraz daha sıcak tercih edilir. Ani ısı değişikliklerinden kaçınılır.</li></ul><h3>Nem</h3><ul><li>Oran <strong>%30–60</strong>. Solunumu rahatlatmak için artırılabilir.</li><li>Havalandırma sisteminde ve kışın kalorifer yanınca nem düşer → ağız-burun mukozası ve solunum yolları kurur.</li></ul><h3>Havalandırma</h3><ul><li>Kapalı oda havası koku, ter, soluk, nem, ısı ve mikroplarla kirlenir.</li><li><strong>Doğal:</strong> pencere açma. <strong>Yapay:</strong> aspiratör ve klima.</li><li>Klima kaynaklı hastane enfeksiyonları sık görülür → <strong>periyodik kontrol ve filtre temizliği teknik servisçe</strong> yapılır.</li></ul>`);
S(5,"Aydınlatma, Gürültü, Zemin ve Renk",`<h3>Aydınlatma</h3><p>Doğal (gün ışığı) + yapay aydınlatma birlikte. Işık çok parlak olmamalı, doğrudan göze gelmemeli; geceleyin zorunlu haller dışında <strong>aniden ışık açılmamalı</strong>.</p><h3>Gürültü</h3><p>İnfüzyon pompası, aspiratör, asansör, telefon sesleri. Uluslararası sınır: <strong>gündüz 45 dB, gece 30 dB</strong>. <strong>120 dB üstü</strong> ağrı ve işitme kusuruna neden olur.</p><h3>Koridor, zemin, renk</h3><ul><li>Ses yalıtımı (akustik konfor), darbeye ve yangına dayanıklı bölme duvarlar, iyi hava kalitesi, hijyenik ve güvenli.</li><li>Zemin: <strong>kolay temizlenir, dayanıklı, kaygan olmayan, gürültüyü engelleyen</strong>.</li><li>Renk: <strong>sıcak renkler</strong> (kırmızı, sarı, turuncu) kan basıncını yükseltir; <strong>soğuk renkler</strong> (mavi, yeşil) kan basıncı ve nabzı düşürür.</li></ul>`);
S(5,"Hasta Odası Eşyaları ve Teknik Üniteler",`<ul><li><strong>Sandalye:</strong> çok yüksek/alçak olmamalı.</li><li><strong>Karyola:</strong> baş ve ayak kısmı kalkabilen, iki yanında emniyet parmaklığı, tekerlek kilidi, serum askısı yuvaları ve drenaj torbası askıları.</li><li><strong>Refakatçi:</strong> oturma sandalyesi, yatıp dinlenebilecek koltuk/kanepe; kolay temizlenen kaplama.</li><li>En az bir <strong>alkol bazlı el antiseptiği</strong>; mümkünse sabit telefon, TV, mini buzdolabı.</li></ul><h3>Teknik üniteler</h3><ul><li><strong>Yatak başı ünitesi:</strong> merkezi gaz, aydınlatma, elektrik/telefon prizi, acil çağrı; hasta el setiyle kontrol edilir.</li><li><strong>Çağrı sistemi:</strong> her odada çalışır durumda; çalışıp çalışmadığı sürekli kontrol edilir; hasta/refakatçiye kullanımı anlatılır, acil dışında kullanılmaması hatırlatılır.</li><li><strong>Merkezi oksijen:</strong> merkezden duvar içi borularla yatak başına ulaşır.</li><li><strong>Aspiratör:</strong> vakumla sıvı/sekresyon/partikülü emip toplama kavanozunda biriktirir (cerrahi aspiratör).</li></ul>`);

Q(5,"Güvenli ortam için korunulması gereken dört alan hangisidir?","Kaza, yangın, enfeksiyon, çevre kirliliği","Gürültü, ısı, nem, ışık","Hırsızlık, deprem, sel, kirlilik","Tanı, tedavi, bakım, izlem","Güvenli ortam kazalardan, yangından, enfeksiyondan ve kirlilikten korunmayı kapsar.");

Q(5,"Hasta odasında geceleyin ışık açılması gerekiyorsa ne yapılmalıdır?","Zorunlu haller dışında aniden ışık açılmamalıdır","Tüm ışıklar birden açılmalıdır","Doğrudan göze gelen güçlü ışık kullanılmalıdır","Işık hiç kullanılmamalıdır","Işık çok parlak olmamalı ve doğrudan göze gelmemelidir.");

// ---------- MODÜL 7: ATIK YÖNETİMİ ----------
S(6,"Atık ve Atık Yönetimi",`<p><strong>Atık:</strong> üretim ve kullanım faaliyetleri sonucu ortaya çıkan, insan ve çevre sağlığına zarar verecek şekilde alıcı ortama verilmesi sakıncalı her türlü maddedir.</p><p><strong>Atık yönetimi:</strong> atığın kaynağında azaltılması, özelliklerine göre ayrıştırılarak toplanması, taşınması, geçici depolanması, bertarafı, bertaraf sonrası kontrolü ve geri kazanılması gibi işlemleri kapsayan yapılanma biçimidir.</p><h3>İlkeler</h3><ul><li>Atık üretiminin ve zararlılığının önlenmesi ve azaltılması</li><li>Kaçınılmazsa <strong>geri kazanım</strong> veya enerji kaynağı olarak kullanım</li><li>Farklı atıkların <strong>kaynağında ayrı toplanması</strong></li><li>Lisanslı geri kazanım/bertaraf tesislerinde uygun yöntemle bertaraf</li></ul><h3>Ayrıştırmanın önemi</h3><p>Hastalık yayılımının önlenmesi, çalışan sağlığı ve güvenliği, yerel kaynakların etkin kullanımı, çevrenin korunması, bertaraf maliyetlerinin düşürülmesi.</p>`);
S(6,"Hastane Atık Sınıfları",`<p>Hastaneler; elektrikli cihaz, ağır malzeme, kimyasal, radyoaktif madde, enfeksiyöz materyal, kesici-delici ve yanıcı-patlayıcı maddelerin bir arada bulunduğu alanlardır.</p><p><strong>Tıbbi Atıkların Kontrolü Yönetmeliği (EK-2)</strong> sınıflaması:</p><ul><li><strong>Evsel atıklar</strong>: genel atık + ambalaj atığı</li><li><strong>Tıbbi atıklar</strong>: enfeksiyöz, patolojik, kesici-delici</li><li><strong>Tehlikeli atıklar</strong></li></ul><h3>Renk kodları</h3><ul><li><strong>Siyah torba:</strong> genel (evsel) atık</li><li><strong>Mavi torba:</strong> ambalaj (geri dönüşüm) atığı</li><li><strong>Kırmızı torba:</strong> enfeksiyöz tıbbi atık</li><li><strong>Kırmızı kap:</strong> patolojik atık; <strong>sarı-kırmızı kutu:</strong> kesici-delici</li><li><strong>Mavi varil:</strong> tehlikeli atık</li></ul>`);
S(6,"Evsel Nitelikli Atıklar",`<h3>Genel atık</h3><p>Sağlıklı kişilerin bulunduğu alanlar, idari birimler, temizlik hizmetleri, mutfaklar, ambar ve atölyelerden gelir. Kaynağında ayrı toplanır, belediye atıklarıyla uzaklaştırılır, düzenli depolama sahalarında zararsız hale getirilir. <strong>Siyah torbada</strong> biriktirilir.</p><h3>Ambalaj atığı (geri dönüştürülebilir)</h3><p>Tekrar kullanılabilen/geri kazanılabilen kağıt, karton, mukavva, plastik, cam, metal. <strong>Mavi torbada</strong> biriktirilir. Kontamine olmamış olmalıdır.</p>`);
S(6,"Enfeksiyöz Atıklar",`<p>Enfeksiyöz ajanların yayılımını önlemek için taşınması ve imhası özel uygulama gerektiren atıklardır.</p><h3>Örnekler</h3><ul><li>Mikrobiyolojik laboratuvar atıkları, kültür ve stoklar, infeksiyöz vücut sıvıları, serolojik atıklar</li><li>Kan, kan ürünleri ve bunlarla kontamine nesneler</li><li>Kullanılmış ameliyat giysileri, diyaliz atıkları, karantina atıkları</li><li>Bakteri ve virüs içeren hava filtreleri</li></ul><h3>Kırmızı plastik torba özellikleri</h3><ul><li>Yırtılma, delinme, patlamaya dayanıklı; orta yoğunluklu polietilen</li><li>Sızdırmaz, çift taban dikişli, körüksüz</li><li>Çift kat kalınlığı <strong>100 mikron</strong>, en az <strong>10 kg</strong> kaldırma kapasiteli</li><li><strong>“Uluslararası Biyotehlike”</strong> amblemi + <strong>“DİKKAT! TIBBİ ATIK”</strong> ibaresi</li></ul>`);
S(6,"Tıbbi Atık Torbası Kuralları",`<ul><li>Torbalar en fazla <strong>3/4</strong> oranında doldurulur.</li><li>Ağızları sıkıca bağlanır; gerekirse aynı özellikte ikinci torbaya konarak <strong>kesin sızdırmazlık</strong> sağlanır.</li><li>Bu torbalar <strong>hiçbir şekilde geri kazanılmaz ve tekrar kullanılmaz</strong>.</li><li>İçerik hiçbir suretle <strong>sıkıştırılmaz, torbadan çıkarılmaz, boşaltılmaz, başka kaba aktarılmaz</strong>.</li></ul><h3>Taşınma</h3><p>Bu iş için eğitilmiş; <strong>eldiven, maske, çizme ve turuncu koruyucu elbise</strong> giyen personel tarafından, <strong>tekerlekli, kapaklı, paslanmaz</strong> metal/plastik, sadece bu iş için ayrılmış araçlarla toplanır ve taşınır.</p>`);
S(6,"Patolojik ve Kesici-Delici Atıklar",`<h3>Patolojik atıklar</h3><p>Cerrahi girişim/otopsi/anatomi çalışmasından çıkan doku, insan fetüsü, vücut parçaları, plasenta, kesik uzuvlar.</p><ul><li>Diğer tıbbi atıklardan <strong>ayrı</strong>, delinmeye-kırılmaya-patlamaya dayanıklı, su geçirmez, biyotehlike amblemli <strong>kırmızı kaplarda</strong> toplanır.</li><li>En fazla <strong>3/4</strong> doldurulur; dolunca <strong>açılamaz, boşaltılamaz, geri kazanılamaz</strong>.</li></ul><h3>Kesici-delici atıklar</h3><p>Enjektör iğnesi, iğne içeren kesiciler, bistüri, lam-lamel, cam pastör pipeti, kırılmış cam.</p><ul><li>Plastik veya aynı özellikli lamine kartondan, <strong>açılması ve karıştırılması mümkün olmayan</strong> kutularda toplanır.</li><li>Üzerinde <strong>“Uluslararası Biyotehlike”</strong> + <strong>“DİKKAT! KESİCİ ve DELİCİ TIBBİ ATIK”</strong> yazar.</li><li>En fazla <strong>3/4</strong> doldurulur, ağzı kapatılır, <strong>kırmızı plastik torbaya</strong> konur; sıkıştırılmaz, açılmaz, boşaltılmaz, geri kazanılmaz.</li><li><strong>Enjektör kullanımı sonrası uçlar kapatılmaya çalışılmaz</strong>, kutuya açık atılır.</li></ul>`);
S(6,"Tehlikeli Atıklar",`<p>Fiziksel/kimyasal özellikleri ya da yasal nedenlerle <strong>özel işleme tabi</strong> atıklardır.</p><ol><li><strong>Tehlikeli kimyasallar:</strong> formaldehid, fotografik kimyasallar, organik-inorganik kimyasallar, yüksek düzey dezenfektanlar, laboratuvar sıvı atıkları.</li><li><strong>Sitotoksik ve sitostatik ilaçlar:</strong> kanserde kullanılan hücre öldürücü/çoğalmayı durdurucu ilaçlar; kemoterapi hazırlama ünitesi koruyucu giysileri.</li><li><strong>Amalgam atıkları</strong> (civa bileşimli).</li><li><strong>Farmasötik atıklar:</strong> kullanım tarihi geçmiş ilaç, bozulmuş aşı, serum.</li><li><strong>Ağır metal içerenler:</strong> civa, kadmiyum, kurşun (termometre, tansiyon aleti, radyasyon koruyucu paneller), film banyoları, gümüşlü x-ray filmler.</li><li><strong>Basınçlı kaplar:</strong> oksijen/etilen oksit gaz silindirleri, gaz kartuşları, aerosol kutuları.</li></ol><p><strong>Diğer:</strong> piller, aküler, florasan lambalar, kartuş-toner, bilgisayar-monitör, yağ-yakıt ve hava filtreleri, entübasyon tüpü.</p>`);
S(6,"Tehlikeli Atıkların Toplanması ve Taşınması",`<ul><li><strong>Sağlam, sızmaya dayanıklı mavi atık varillerinde</strong>, diğer atıklardan ayrı biriktirilir.</li><li>Toplamaya başlanan tarihte atık bilgilerini içeren <strong>etiket doldurulup varile yapıştırılır</strong>.</li><li>Katı, sıvı, gaz özelliklerine ve türüne göre ayrı varillerde biriktirilir.</li><li>Toplanmaya başladığı tarihten itibaren <strong>180 gün</strong> dolmadan atık deposuna gönderilir.</li><li>Varil <strong>2/3</strong> oranında doldurulur, kelepçeleri kapalı tutulur.</li><li>Eldiven, maske ve koruyucu giysili personel tarafından geçici atık merkezine getirilir.</li></ul>`);
S(6,"Radyoaktif Atıklar",`<p>Serbestleştirme sınırlarının üzerinde aktivite içeren ve bir daha kullanılması düşünülmeyen nükleer/radyoaktif maddeler ile radyoaktif bulaşmış yapı, sistem, bileşen ve malzemelerdir. <strong>Katı, sıvı, gaz</strong> olmak üzere 3 türlüdür.</p><h3>Katı</h3><ul><li>Kap üzerinde <strong>“Uluslararası Radyoaktif Atıklar Amblemi”</strong>; gerekirse uygun malzemeyle zırhlanır.</li><li>Dolan tıbbi atık torbaları bağlanıp etiketlenerek <strong>bekletme deposunda aktivite &lt;1 mikroSv/saat</strong> olana dek tutulur; sonra tıbbi atık olarak değerlendirilir.</li><li>Radyoaktif olmayan atık ve tehlikeli kimyasal bu kaba atılmaz.</li></ul><h3>Sıvı</h3><ul><li>İzin verilen sınırlarda, belirlenen <strong>lavabodan su ile seyreltilerek</strong> kanalizasyona bırakılır; lavaboda radyoaktif atık amblemi bulunur.</li><li>Yüksek aktivite → bekletme sistemlerinde bekletildikten sonra bırakılır. İçinde tehlikeli kimyasal varsa <strong>tehlikeli atık</strong> sayılır.</li></ul><h3>Gaz</h3><p>Lisans sahibi sorumluluğunda, lisanslama aşamasında belirlenen koşullarda <strong>atmosfere</strong> verilir.</p>`);
S(6,"Atıkların Bertarafı",`<ul><li><strong>Evsel atıklar:</strong> il/ilçe belediyesi iş birliğiyle uzaklaştırılır.</li><li><strong>Ambalaj atıkları:</strong> ilgili firma iş birliğiyle (kağıt: ilgili firma, cam: şişe cam kurumu).</li><li><strong>Tıbbi atıklar:</strong> anlaşmalı firmanın tıbbi atık aracıyla yetkililere teslim edilir.</li><li><strong>Tehlikeli atıklar:</strong> Tehlikeli Atıkların Kontrolü Yönetmeliği'ne uygun uzaklaştırılır.</li></ul><p class="center"><strong>Atık yönetiminden Enfeksiyon Kontrol Hemşiresi sorumludur.</strong></p>`);

// ---------- MODÜL 8: HASTA KABUL, NAKİL, TABURCULUK ----------
S(7,"Hasta Kabul",`<p>Kişinin hastaneye gelmesiyle başlayıp tedavisine karar verilmesiyle son bulan süreçtir.</p><h3>Amaçlar</h3><ul><li>Hastayı güvenli biçimde kabul etmek</li><li>Kayıt ve <strong>kimlik doğruluğunu</strong> sağlamak</li><li>Gereksinimlerini belirlemek</li><li>Güvenlik, mahremiyet ve konforu sağlamak</li><li>Hasta ve ailesini bilgilendirmek</li></ul><h3>Türler</h3><ul><li><strong>Planlı kabul:</strong> yaşamı tehdit eden ciddi tehlike yoktur; belirtilen gün ve saatte tedavi/tetkik için gelinir.</li><li><strong>Acil kabul:</strong> yaşamı tehdit eden durumlarda, çoğunlukla ambulansla; en gerekli yardımı hemşireler sağlar.</li></ul><h3>Anksiyete nedenleri</h3><p>Hastane ortamı, hastalıkla ilgili korku, kendisine ne yapılacağını bilmeme, iyileşip iyileşmeyeceğini bilmeme. Hemşire dinlemeye istekli olmalı, amaç ve beklentileri açıkça anlatmalı, kararlara katılımı sağlamalıdır.</p>`);
S(7,"Kabulde Ekip Üyelerinin Sorumlulukları",`<ul><li><strong>Hekim:</strong> tıbbi tedavinin başlatılması ve dosyaya kaydı, <em>anamnez</em>, fiziksel muayene, tanı testlerini belirleme. Kabul işlemi tedavi gerektiren hekim tarafından başlatılır; hasta yazıyla kliniğe gönderilir, nöbetçi hekim muayene eder ve klinik hemşiresine bildirir.</li><li><strong>Tıbbi sekreter:</strong> randevu düzenleme, yatış ön bilgisi verme, <strong>dosya açma</strong>, tanıtım kartı hazırlama.</li><li><strong>Hemşire:</strong> <strong>Hazırlık → Karşılama → Kimlik doğrulama → Odaya yerleştirme → Değerlendirme → Bilgilendirme → Belgeleme</strong></li></ul><h3>Hazırlık</h3><p>Hastanın geleceği önceden bildirilir; temiz yatak takımı, çalışır acil çağrı sistemi, ateş-tansiyon-saturasyon cihazları hazırlanır; oksijen, tekerlekli sandalye, izolasyon odası gibi özel gereksinimler planlanır. Eller yıkanır, yatak <strong>en düşük seviyede, düz pozisyonda</strong> hazırlanır; aspiratör, oksijen gereçleri, serum askısı çalışır durumda olmalıdır.</p>`);
S(7,"Karşılama ve Kimlik Doğrulama",`<ul><li>Hasta güler yüzle karşılanır, hemşire kendini tanıtır; hastaya <strong>ismiyle</strong> hitap edilir.</li><li><strong>En az iki kimlik tanımlayıcı</strong> (ad-soyad + TC kimlik no / bileklik) kullanılır; yatış belgesi (karar, tanı, tedavi planı) kontrol edilir.</li><li><strong>Hasta tanıtım bilekliği:</strong> protokol numarası (büyük punto), TC kimlik no, ad-soyad, doğum tarihi, doğum yeri, hekim adı.</li><li>Kimlik saptanamayan acil hastada hastane yönetimi <strong>polise haber verir</strong>; hastayı getirenlerden ve hastanın üzerindeki kimlik/telefondan bilgi alınır.</li><li>Değerli eşyalar sorumlu hemşire/görevli tarafından <strong>zimmetle alınıp kilitli yerde</strong> saklanır; taburculuk/nakilde güvence altına alınır.</li></ul><h3>Klinik tanıtımı</h3><p>Banyo-tuvalet, çağrı zili, acil haber verme, doktor ve hemşire odası, yemek ve ziyaret saatleri, dinlenme salonu, tetkikler, kişisel eşya yeri, kliniğin dışına çıkarken hemşireye haber verme anlatılır.</p>`);
S(7,"Hemşirelik Kabul Değerlendirmesi",`<p>Bilgiler <strong>gözlem ve görüşme</strong> ile (objektif + subjektif veri) toplanır.</p><ul><li><strong>Fiziksel durum:</strong> vital bulgular (ateş, nabız, solunum, tansiyon, O₂).</li><li><strong>Tıbbi öykü:</strong> kronik hastalık, alerji, sürekli ilaç.</li><li><strong>Psikososyal durum:</strong> kaygı düzeyi, iletişim biçimi, refakatçi.</li><li><strong>Düşme riski:</strong> Morse, Hendrich II vb.</li><li><strong>Ağrı:</strong> 0–10 skalası.</li><li><strong>Beslenme:</strong> son yemek saati, diyet kısıtlamaları.</li></ul><h3>Kayıt</h3><p><strong>Hemşire Gözlem Formu</strong> ve <strong>Hasta Kabul Formu</strong>na kaydedilir; kliniğe kabulden sonraki <strong>ilk 24 saat</strong> içinde tamamlanır; elektronik hasta kayıt sistemine (HIS) girilir; ilgili hekim bilgilendirilir.</p>`);
S(7,"Hastanın Başka Bir Üniteye Nakli",`<p>Gereksinim olduğunda hastane içinde başka üniteye nakil edilir (acil/yoğun bakımdan servise, kat veya oda değişikliği). <strong>Nakil kararını hekim verir.</strong></p><ul><li>Nakil <strong>en az iki personelle</strong> (biri hemşire/yardımcı personel) yapılır; monitörizeyse cihaz bağlantıları korunur; güvenlik önlemleri (emniyet kemeri, yatak kenarlıkları, oksijen takibi) alınır.</li><li>Eşyalar kaybolmamalı, ilaçlar doğru etiketlenmeli, durum çizelgesi ve bakım planı paylaşılmalı.</li><li>Hasta hakkında <strong>sözlü ve yazılı rapor</strong>: ad-soyad, yaş, hekim, kabuldeki tanı, cerrahi girişim, mevcut durum, alerji, ilaçlar, laboratuvar verileri, gerekli araç-gereç.</li></ul><h3>Basamaklar</h3><p>Nakil formu ve klinik adı → hasta/aileye neden açıklanır → duygular için zaman ayrılır → gerekirse <strong>yazılı onam</strong> → nakil yöntemi (sandalye/sedye) → Hemşirelik Bakım Nakil Formu → malzeme ve giysiler → olası sorunlara girişim (aspirasyon, pansuman) → vital bulgu, bilinç, damar yolu, sıvı hızı kontrolü → gidilen birim bilgilendirilir → sorular yanıtlanır.</p><p><em>Beklenmeyen durum:</em> hazırlıkta durum kötüleşirse hekim çağrılır.</p>`);
S(7,"Taburculuk Planlaması",`<p>Hastanın hastaneden ayrılıp bakımını evde sürdürebilmesi için <strong>sistemli hazırlanmasıdır</strong>. Taburculuk planlaması <strong>hasta hastaneye kabul edildiği anda başlar</strong>.</p><h3>Amaçlar</h3><ul><li>Evde sürdürülecek bakım ve işlemleri öğretmek</li><li>Evde bakım korku ve endişelerini gidermek</li><li>Bakım ve tedavinin eksiksiz sürmesini sağlamak</li><li>Hastanın hastalığı üzerindeki denetimini artırmak; hastanın geri dönüşünü önlemek</li></ul><p>Plan <strong>koordine, disiplinler arası, erken başlatılmış</strong>, dikkatle hazırlanmış ve hasta/aileyi içine almış olmalıdır. En önemli nokta hasta ve bakım verenler arasındaki <strong>bilgi değişimidir</strong>; sorumluluk genellikle hemşiredir. Hemşire öğrenme düzeyi, sosyoekonomik durum ve ev koşullarını değerlendirir, gerekirse sosyal hizmet, diyetisyen, fizyoterapistle çalışır, <strong>Taburculuk Planlama Formu</strong>nu doldurur.</p>`);
S(7,"Taburculuk Planlamasının Aşamaları",`<p><strong>Veri toplama → Planlama → Uygulama → Değerlendirme</strong></p><h3>Veri toplama</h3><p>Hastanın hisleri ve korkuları; sağlık-hastalık inançları, diyet, kültürel/dini uygulamalar; evin yapısal engelleri, sıcak su, zararlı etkenler; ekonomik durum, sosyal destek, yalnız yaşama; bakım verenin yaşı, cinsiyeti, yakınlığı, deneyimi, korku ve beklentileri.</p><h3>Planlama – METHOD</h3><ul><li><strong>M</strong>edication: ilaç tedavisi</li><li><strong>E</strong>nvironment: çevre (ev güvenliği, duygusal ve ekonomik destek)</li><li><strong>T</strong>reatment: tedavinin evde sürme amacı</li><li><strong>H</strong>ealth education: sağlık eğitimi</li><li><strong>O</strong>utpatient: ayaktan takip (randevu, yardım çağırma)</li><li><strong>D</strong>iet: diyet</li></ul><h3>Uygulama</h3><p>Bilgi ve eğitim hemşirelik notlarına yazılır, <strong>taburculuk özeti</strong> çıkarılır, taburculuk formu doldurulup <strong>bir kopyası hastaya</strong> verilir.</p><h3>Değerlendirme</h3><p>Taburculuktan birkaç hafta sonra <strong>ev ziyareti</strong>, mümkün değilse <strong>telefon görüşmesi</strong> veya <strong>poliklinik</strong> kontrolü. Kayıtlar açık-doğru yazılır ve saklanır.</p>`);
S(7,"Özel Taburculuk Durumları",`<h3>Kendi isteğiyle taburculuk</h3><p>Tıbbi olarak önerilmemesine rağmen ayrılmak isteyen hasta, <strong>hekim ve kurumun sorumluluk taşımadığına dair belge</strong> imzalar. Belgeyi imzalamadan önce <strong>olası riskler</strong> hakkında bilgilendirilmelidir.</p><h3>Ölüm durumunda yapılacaklar</h3><ul><li>Ölümün nasıl oluştuğu bakım planına kısaca yazılır; <strong>ölüm belgesi</strong> doldurulur.</li><li><strong>Organ bağışı</strong> durumu kimlikten ve aileden araştırılır.</li><li>Dini inançlar dikkate alınarak ölüm bakımı verilir, <strong>morga</strong> gönderilir.</li><li>Aileye haber verilir, destek sağlanır; kayıtlar saklanır.</li><li>Diğer hastalarda stres yaratmayacak şekilde <strong>sakin</strong> hareket edilir.</li></ul><p><strong>Taburculuk kayıt örneği:</strong> “Vital bulgular stabil, dren ve kateterler çıkarıldı, yara bakımı-ilaç-diyet-kontrol randevusu eğitimi verildi, hasta ve yakını anladığını ifade etti.”</p>`);

S(8,"Risk ve Hasta Güvenliği",`<p><strong>Risk:</strong> zarar veya kayıp durumuna yol açabilecek bir olayın ortaya çıkma olasılığıdır.</p><p>Sağlık bakımı doğası gereği risklidir: farklı meslek grupları, yetkinlik gerektirmesi, ileri teknoloji, bilginin hızlı değişmesi, hataların geri dönüşsüz olması, zamana karşı yarış ve baskı.</p><p><strong>Risk yönetimi:</strong> hasta ve çalışan sağlığını olumsuz etkileyecek risk faktörlerinin belirlenmesi, ölçülmesi ve en alt düzeye indirilmesi sürecidir.</p><p><strong>Hasta güvenliği:</strong> sağlık hizmeti sırasında hastaların zarar görmesini önlemeye yönelik tüm uygulama, politika ve kültürel yaklaşımlardır; DSÖ'ye göre kalitenin ayrılmaz unsurudur. Güvenlik temel insan gereksinimidir; tehlike, zarar ya da riskten uzak olmaktır.</p><p><strong>Temel hedef:</strong> hataları hastaya ulaşmadan önlemek ve önlenebilir hataların ortaya çıkmasını engelleyecek yeni tasarımlar yapmaktır.</p>`);
S(8,"Temel Kavramlar",`<ul><li><strong>Tıbbi hata:</strong> planlanan eylemin yanlış uygulanması veya doğru planın uygulanmaması (yanlış doz). “Yapılan yanlışlar” ve “yapılmayan doğrular” kapsama girer.</li><li><strong>Advers olay:</strong> sağlık hizmeti sırasında hastaya zarar veren, önlenebilir/önlenemeyen olay (ameliyat sonrası enfeksiyon). <strong>Önlenebilir advers olay:</strong> hizmet uygun verilseydi oluşmayacak zarar.</li><li><strong>Near miss (neredeyse hata):</strong> hata gerçekleşmeden fark edilip önlenen olay.</li><li><strong>İstenmeyen olay (incident):</strong> hasta/çalışan güvenliğini olumsuz etkileyen her olay.</li><li><strong>Kök neden / RCA:</strong> hatanın altta yatan nedeni / olayın nedenlerini bulan sistematik inceleme.</li><li><strong>Olay bildirim sistemi:</strong> hataların cezalandırılmadan bildirilmesi.</li><li><strong>Güvenlik kültürü:</strong> “hata gizlenmez, öğrenme fırsatıdır”.</li><li><strong>Hata zinciri:</strong> küçük hataların eklenerek büyük olaya dönüşmesi.</li></ul><p><strong>Döngü:</strong> Risk → Hata → Olay → Zarar → Öğrenme → Önleme.</p>`);
S(8,"Tıbbi Hatalar",`<p>ABD'de yılda ≈250.000 ölüm tıbbi hatalara bağlıdır; dünyada 3. sık ölüm nedeni, <strong>önlenebilir nedenler arasında 1. sıradadır</strong>.</p><h3>Gruplandırma</h3><ul><li><strong>Tanıda hatalar:</strong> yanlış/gecikmiş tanı, gerekli tetkikin yapılmaması, sonuca uygun hareket edilmemesi.</li><li><strong>Tedavi hataları:</strong> cerrahi/ilaç hatası, doz-veriliş yolu hatası, gecikme.</li><li><strong>Koruyucu tedavi hataları:</strong> profilaksi yapılmaması, yetersiz izlem.</li><li><strong>Diğer:</strong> iletişim, ekipman (defibrilatör, IV pompa), hastane enfeksiyonları.</li></ul><p><strong>Türüne göre:</strong> medikasyon hataları (yanlış ilaç, doz, yol, etkileşim, alerji) ve cerrahi hatalar (yanlış teknik, zamanlama, yetersiz deneyim, yanlış ameliyat).</p><p>Hata sonrası sorulacaklar: Ne oldu? Niçin oldu? İnsani, ekipman ve çevresel faktörler neler? Başka bölge etkilendi mi?</p>`);
S(8,"Güvenliği Etkileyen Faktörler",`<h3>Hastaya ait</h3><ul><li><strong>Yaş/gelişim:</strong> yenidoğan, küçük çocuk, yaşlı.</li><li><strong>Hareketlilik:</strong> felç, kas güçsüzlüğü, denge kaybı.</li><li><strong>Duyusal-algısal:</strong> görme, işitme, dokunma kaybı.</li><li><strong>Bilişsel farkındalık:</strong> bilinçsiz, yarı bilinçli, oryantasyon bozukluğu.</li><li><strong>Emosyonel durum:</strong> aşırı stres, depresyon dikkat ve algıyı azaltır.</li><li><strong>İletişim becerisi:</strong> yorgunluk, stres, ilaç etkiler.</li></ul><h3>Çevreye ait</h3><p>Isı, nem, hava akımı, aydınlatma, gürültü, hava kirliliği, yetersiz temizlik, kaygan zemin.</p>`);
S(8,"Uluslararası Hasta Güvenliği Hedefleri ve Kimlik",`<p><strong>JCI – IPSG hedefleri:</strong> hasta kimliğinin doğrulanması; etkili iletişim (sözlü/telefon orderları, kritik test sonuçları, vardiya devri); yüksek riskli ilaç güvenliği; alarm sistemleri; doğru taraf-prosedür-hasta cerrahisi; sağlık hizmeti enfeksiyonlarının azaltılması; düşme/intihar gibi risklerin önlenmesi.</p><h3>Hasta kimliğinin doğrulanması</h3><ul><li>Amaç: doğru hastaya doğru işlem.</li><li>Belirteçler (kol bandında): ad-soyad, protokol no, TC kimlik no, doğum tarihi. <strong>En az iki</strong> tanımlayıcı kullanılır.</li><li>İlaç, kan transfüzyonu, numune alma ve cerrahi öncesi mutlaka kontrol edilir.</li><li>Kol bandı değiştirilir: <strong>kliniğe nakil, alerji saptanması, tanımlayıcının özelliğini kaybetmesi</strong>.</li></ul>`);
S(8,"Etkili İletişim ve SBAR",`<p>İletişim aksaklığı hatalara neden olur. Sık sorunlar: kısaltma/sembol kullanımı, sözlü-telefonla istem, kritik test sonuçlarının iletilmesi.</p><h3>Sözlü istem kuralları</h3><ul><li>Yalnızca <strong>acil durumda, hekim steril</strong>se alınır.</li><li>İlgili forma yazılıp <strong>teker teker istemi verene okunur</strong>; gerekirse ilaç adı kodlama ile tekrar edilir.</li><li><strong>En geç 24 saat</strong> içinde hekim tedavi planına yazar.</li><li>Okunaklı yazılır, kısaltma kullanılmaz (“.5 mg” → 5 mg hatası; <strong>0.5 mg</strong> yazılmalı). Kısaltmalar hastanenin onaylı listesinde olmalı.</li></ul><h3>SBAR</h3><ul><li><strong>S</strong>ituation (durum): ne oluyor?</li><li><strong>B</strong>ackground (geçmiş): öykü/mevcut durum.</li><li><strong>A</strong>ssessment (değerlendirme): klinik değerlendirme.</li><li><strong>R</strong>ecommendation (öneri/talep): ne yapılmasını istiyorsun?</li></ul><p>Hasta devri, doktora bildirim, acil çağrı ve konsültasyonda kullanılır.</p>`);
S(8,"İlaç Güvenliği",`<p>İlaç hatası hasta güvenliğini etkileyen <strong>en yaygın hata</strong>dır; hemşirelerin en çok dava edildiği hatalardandır. Dağılım: hekim order'ları %39–49, hemşire uygulamaları %26–38, uyarlama %11–12, eczane %11–14. En sık: <strong>doz hataları</strong>, yanlış ilaç, sıklık, alerji, yol hatası, atlanan doz.</p><h3>Genel ilkeler</h3><ul><li>Sakin ortamda dikkatli hazırlanır; <strong>başkasının hazırladığı ilaç verilmez</strong>; ilaç hastanın yanında bırakılmaz; etiketi okunmayan kullanılmaz; <strong>alerji</strong> kontrol edilir.</li><li>İlaçlar kapalı, kişiye özel kaplarda, kimlik bilgisiyle hazırlanır; tedavi planı hekim tarafından yazılır, kaşelenir, imzalanır (ad, zaman, doz, yol, süre).</li><li>İlaçları <strong>hemşire</strong> uygular; stajyer uygulaması hemşire gözetiminde olur. Hasta getirdiği ilaçları hemşire teslim alır, <strong>miat kontrolü</strong> yapar, hekim kontrol eder.</li><li>Pediatrik dozlu ilaçlar ayrı raflarda; <strong>benzer yazılı-okunuşlu-ambalajlı ilaçlar</strong> ayrı raflarda ve liste ile.</li><li>Depo <strong>25 °C ve %60 nem altında</strong>; ısı-nem takibi, buzdolabı derece kaydı, kalibrasyon.</li><li><strong>Ciddi ve beklenmeyen advers etki 15 gün içinde TÜFAM'a</strong> (Türkiye Farmakovijilans Merkezi) bildirilir.</li></ul>`);
S(8,"Yeşil/Kırmızı Reçete ve Yüksek Riskli İlaçlar",`<ul><li><strong>Kırmızı reçete:</strong> bağımlılık potansiyeli yüksek narkotik (opioid) analjezikler – morfin, metadon, fentanil, petidin.</li><li><strong>Yeşil reçete:</strong> psikotrop ilaçlar – benzodiazepinler (diazepam, alprazolam), bazı uyku ilaçları, antidepresanlar.</li><li>2017'den itibaren <strong>e-reçete</strong>; her reçetenin tekil numarası vardır. Düzenleme TİTCK/Sağlık Bakanlığı yetkisindedir.</li><li>Eczane “Yeşil ve Kırmızı Reçeteli İlaç Defteri” tutar (tarih, reçete no, ilaç, hasta TC, hekim, teslim alan imzası).</li><li>Hastanede <strong>kilitli dolapta</strong>, yetkili gözetiminde saklanır; her kullanım/teslim/imha kayıtlanır; sayım günlük veya haftalık; kayıp-çalıntıda <strong>İl Sağlık Müdürlüğü'ne derhal bildirim</strong>; imha tutanak ve komisyonla.</li><li>Devir teslim kayıtlarında: hangi hastaya kaç adet, tarih, kim uyguladı, teslim eden/alan imzaları.</li><li><strong>Yüksek riskli ilaçlar</strong>: liste belirlenir, karışmayacak şekilde depolanır, eczanede renkli işaretlenir.</li></ul>`);
S(8,"Transfüzyon ve Radyasyon Güvenliği",`<h3>Transfüzyon güvenliği</h3><ul><li>Hasta kimliği ve kan ürünü bilgileri (kan grubu, çapraz karşılaştırma sonucu, miktar, veriliş süresi) <strong>iki sağlık çalışanı</strong> tarafından doğrulanır.</li><li>İlk <strong>15 dakika 2 ml/dk</strong> ile başlanır; reaksiyon yoksa <strong>4 ml/dk</strong>'ya çıkılır.</li><li>Transfüzyon boyunca <strong>her 30 dakikada</strong> vital bulgular izlenir ve kaydedilir.</li></ul><h3>Radyasyon güvenliği</h3><p>İyonize ışınlar düşük dozda bile ileride kanser gibi sorunlara yol açabilir. Hastalar görüntüleme ünitesine <strong>tek tek</strong> alınır, koruyucu donanım kullanır, <strong>yalnızca çekim bölgesi</strong> ışınlanır, kapılar kapalı tutulur, yakınlar gerekmedikçe alınmaz, <strong>gebe/gebelik şüphesi</strong> olanlar bilgilendirilir.</p>`);
S(8,"Güvenli Cerrahi",`<p>DSÖ: yılda <strong>234 milyon</strong> ameliyat; 7 milyonunda komplikasyon, 1 milyonunda ölüm. <strong>“Güvenli Cerrahi Hayat Kurtarır”</strong> projesi ve <strong>Cerrahi Güvenlik Kontrol Listesi</strong> geliştirildi (25 ülke, 3000+ hastane).</p><h3>10 ana hedef</h3><ol><li>Doğru hasta, doğru taraf</li><li>Anestezi zararını engelleme</li><li>Hava yolu ve solunum kaybını engelleme</li><li>Aşırı kan kaybını engelleme</li><li>Bilinen alerjiyi sorgulama</li><li>Cerrahi alanda alet ve spanç kalmasını engelleme</li><li>Patoloji numunelerini güvenceye alma</li><li>Ameliyathanede takım ruhu</li><li>Doğru kayıt</li><li>Cerrahi alan enfeksiyonunu engelleme</li></ol><p><strong>Kontrol listesi 4 aşamada</strong> doldurulur: klinikten ayrılmadan önce, anestezi öncesi, ameliyat kesisinden önce, hasta ameliyathaneden çıkmadan önce. Olumsuzluklar Olay Bildirim Formu ile Kalite Yönetim Birimine bildirilir.</p>`);
S(8,"Onam, Tıbbi Cihaz, Olay Bildirimi ve Renkli Kodlar",`<h3>Bilgilendirilmiş onam</h3><p>Cerrahi/invaziv girişim, anestezi-sedasyon, kan ve kan ürünü, yüksek riskli tedavi öncesi alınır. İçerik: risk-komplikasyonlar, süre, nasıl ve kim yapacak, beklenen fayda, uygulanmazsa sonuçlar, alternatifler; hasta/vasi/veli ve hekim ad-soyad-imza; tarih ve saat.</p><h3>Tıbbi cihaz güvenliği</h3><p>“Tıbbi cihaz sorumlu ekibi” bakım, onarım, ölçme, ayar ve kalibrasyon planı yapar. <strong>Kalibrasyon etiketi:</strong> firma adı, kalibrasyon tarihi, geçerlilik süresi, sertifika numarası.</p><h3>Olay bildirimi</h3><p>Amaç hataların nedenlerini bulmak, sistem eksiklerini gidermek ve ders çıkarmaktır; <strong>birimleri/kişileri cezalandırmak değildir</strong>.</p><h3>Ulusal renkli kodlar</h3><p>Acil durum yönetimi uyarı sistemleridir: hazırlıklı olmayı sağlar, çalışanları haberdar eder, kısa-net mesaj verir, zaman kazandırır, paniği önler.</p>`);
S(8,"Hasta Düşmeleri",`<p>Hastanelerde <strong>en sık görülen kaza</strong> düşmelerdir. JCI: “hastada yaralanmaya neden olan ya da olmayan <strong>plansızca yere iniş</strong>”. Hastane tıbbi hatalarının yaklaşık <strong>%21–40</strong>'ını oluşturur; yaralanma, fonksiyon kaybı, uzun yatış, maliyet artışı, anksiyete ve korkuya yol açar.</p><h3>Bireysel risk faktörleri</h3><p>İleri yaş (65+), yürüme-denge bozukluğu, postural hipotansiyon, baş dönmesi, önceki düşme, çoklu/psikoaktif ilaç, demans, nörolojik bozukluk, görme ve bilişsel sorunlar.</p><h3>Çevresel risk faktörleri</h3><p>Islak zemin/küvet, tutunacak destek eksikliği, eşik ve yükseklik farkı, dengesiz merdiven, yetersiz/aşırı aydınlatma, sabit olmayan nesneler, dar alanda çok eşya, uygun olmayan ayakkabı.</p>`);
S(8,"Düşme Riski Ölçekleri",`<ul><li><strong>Hendrich II:</strong> erişkin kliniklerinde yaygın. Konfüzyon (4), depresyon (2), boşaltımda değişim (1), baş dönmesi (1), erkek cinsiyet (1), antiepileptik (2), benzodiazepin (1), kalkıp yürüme testi (0–4). En yüksek <strong>16</strong>; <strong>≥5 yüksek risk</strong>. Türkçe geçerlik: Atay, San, Aycan (2009).</li><li><strong>Morse (1985, Janice Morse):</strong> 6 kriter – düşme öyküsü (25), ikincil tanı (15), mobilizasyon desteği (0/15/30), IV yol/heparin (20), yürüyüş/transfer (0/10/20), mental durum (0/15). <strong>0–24 düşük, 25–50 orta, ≥51 yüksek risk.</strong></li><li><strong>İtaki:</strong> 17 yaş ve üzeri, major-minör risk faktörleri, 19 madde.</li><li><strong>Harizmi:</strong> 0–16 yaş çocuklar, 9 madde.</li></ul>`);
S(8,"Düşmeleri Önleme",`<ul><li><strong>Güvenli çevre:</strong> yeterli aydınlatma, düzenli ortam, yemek masası-etajer-sandalye yatağa yakın, kuru ve kaymaz zemin, ıslak zeminde uyarı levhası, tuvalet/küvette destek ve lastik kaplama.</li><li>Hasta <strong>ilk ayağa kalkışında destek</strong> sağlanır; tekerlekli sandalye/sedye/karyola tekerlekleri <strong>kilitlenir</strong>.</li><li>Çağrı zili, telefon ve yardımcı araçlar <strong>uzanmadan</strong> erişilecek mesafede tutulur.</li><li>Sedye ve yatak kenarlıkları kaldırılır; işlem bitince <strong>yeniden yükseltilmesi unutulmaz</strong>.</li><li>Kaymayan ayakkabı/terlik/çorap; hasta odasına düşme riski görseli asılır.</li><li>Hasta ve yakınlarına bilgi verilir; yakın ayrılırken hemşireye haber verir; hasta yardım isteme yolunu bilir.</li><li>Refakatçisiz hasta <strong>saat başı</strong> ziyaret edilir; kapı açık tutulur.</li><li>Güvenli transfer araçları; çalışanlara periyodik eğitim.</li><li><strong>Teknoloji:</strong> sensörler (giyilebilir / giyilemeyen) düşmeyi gerçekleşmeden algılar; hemşire istasyonuna bağlı <strong>video kamera</strong> izlemi (sürekli izlem sınırlı olduğundan sensörle birlikte önerilir).</li></ul>`);

S(8,"İlaç Hatalarının Oluştuğu Aşamalar",`<p>İlaç süreci zincirdir; her halkada hata olabilir:</p><h3>Doktor istemi sürecinde</h3><ul><li>Yanlış tanı – yanlış ilaç seçimi; yetersiz hikâye (gebelik, alerji, özel durumlar)</li><li>Endikasyon olmaması, <strong>kontrendike ilaç</strong></li><li>Okunaksız el yazısı, <strong>ondalık noktanın yanlış kullanımı</strong>, kısaltma kullanımı, yanlış doz</li></ul><h3>Hemşire istemi sürecinde</h3><ul><li>Okunaklı olmayan veya <strong>kısaltmalı</strong> istemin alınması</li><li>Yol, doz, form, süre bilgisi eksik istemin alınması</li><li>İstemin Hemşire Gözlem Formu'na yanlış kaydedilmesi</li><li><strong>Sözlü istemlerin doğrulanmaması</strong></li></ul><h3>Eczane sürecinde</h3><ul><li>İstemin yanlış okunması, yanlış etiketleme, etiketin iyi yapıştırılmaması</li><li>İlaçların kapalı kaplarda ve kişiye özel hazırlanmaması</li><li>İlacın yanlış hasta poşetine konması veya yanlış farmasötik formun gönderilmesi</li><li>Saklama koşullarının sağlanmaması</li></ul><h3>İlaç uygulama sürecinde (doğrulanmayanlar)</h3><p><strong>Hasta kimliği, ilaç, farmasötik form, doz, uygulama yolu, zaman ve sıklık, veriliş süresi.</strong></p>`);
S(8,"İlaç Hataları Sınıflandırma Sistemi (İHSS) ve Olay Bildirim Formu",`<p><strong>İHSS:</strong> Sağlık Bakanlığı Sağlıkta Kalite ve Akreditasyon Daire Başkanlığı tarafından, hasta güvenliğini tehdit edebilecek ilaç hatalarının analizinde <strong>standart bir yöntem</strong> kullanmak ve sağlık tesisleri arasında <strong>dil birliği</strong> sağlamak için oluşturulmuş bir <em>kod oluşturma aracıdır</em>.</p><ul><li>Hatanın <strong>yeri</strong> (klinik…), <strong>kişi</strong> (hemşire…), <strong>zaman</strong> (örn. 08:01–12:00), <strong>işlem</strong> (uygulama), hata türü (örn. yanlış zaman) seçilir ve bir <strong>hata kodu</strong> oluşur (örn. HKL.HM.Z3.I4H).</li></ul><h3>Olay Bildirim Formu</h3><p>Olay bilgisi, olayın türü (hasta/çalışan/ekipman…), bildiren kişi, hastanın durumu ve olay sonrası alınan önlemler yazılır; amaç <strong>öğrenmek ve önlemek</strong>, birimleri ya da kişileri cezalandırmak değildir.</p><h3>Güvenli Cerrahi Kontrol Listesi (T.C. Sağlık Bakanlığı formu)</h3><p>Dört bölüm: <strong>I. Klinikten ayrılmadan önce</strong> (hasta kimliği, ameliyat bölgesi, onam), <strong>II. Anestezi verilmeden önce</strong> (bölge işaretleme, pulse oksimetre, alerji, hava yolu, kan kaybı riski), <strong>III. Ameliyat kesisinden önce</strong> (ekip kendini tanıtır, kritik olaylar, profilaktik antibiyotik, kan şekeri), <strong>IV. Ameliyathaneden çıkmadan önce</strong> (yapılan ameliyat, alet-spanç-kompres sayımı, numune etiketi, sonraki bakım).</p>`);
Q(8,"Ondalık noktanın yanlış kullanımı ve okunaksız el yazısı hangi süreçteki hatalara örnektir?","Doktor istemi sürecinde yapılan hatalar","Eczane sürecinde yapılan hatalar|İlaç uygulama sürecinde yapılan hatalar|Taburculuk sürecinde yapılan hatalar","Kısaltma kullanımı ve yanlış doz da doktor istemi hatalarındandır.");
Q(8,"Aşağıdakilerden hangisi hemşire istemi sürecinde yapılan hatalardan biridir?","Sözlü istemlerin doğrulanmaması","İlacın yanlış hasta poşetine konması","Yanlış tanı koyma","İlacın yanlış etiketlenmesi","Poşet ve etiketleme hataları eczane sürecine aittir.");
Q(8,"İlacın yanlış hasta poşetine konması hangi süreçte yapılan hatadır?","Eczane süreci","Doktor istemi süreci|Hemşire istemi süreci|Taburculuk süreci","Eczane süreci hataları: yanlış okuma, etiketleme, saklama koşullarının sağlanmaması vb.");
Q(8,"İlaç uygulama sürecinde doğrulanması gereken unsurlardan biri DEĞİLDİR?","Hastanın sigorta türü","Hasta kimliği","Doz","Uygulama yolu ve zamanı","Ayrıca ilaç, farmasötik form, sıklık ve veriliş süresi doğrulanır.");
Q(8,"İlaç Hataları Sınıflandırma Sistemi (İHSS) hangi amaçla oluşturulmuştur?","İlaç hatalarının analizinde standart yöntem ve sağlık tesisleri arasında dil birliği sağlamak","Hemşireleri cezalandırmak","İlaç fiyatlarını belirlemek","Reçete yazmak","Yer, kişi, zaman ve işlem seçilerek bir hata kodu oluşturulur.");
Q(8,"Güvenli Cerrahi Kontrol Listesi'nde 'ekip üyelerinin kendini tanıtması' ve 'profilaktik antibiyotik' hangi aşamadadır?","Ameliyat kesisinden önce","Klinikten ayrılmadan önce|Anestezi verilmeden önce|Ameliyathaneden çıkmadan önce","Alet-spanç-kompres sayımı ve numune etiketi ise son aşamada kontrol edilir.");
S(5,"Mahremiyet ve Hasta Odası Tasarımı",`<ul><li><strong>Gizlilik:</strong> perde veya paravanla yatak çevresi ayrılır; muayene ve işlemler başkalarının görmeyeceği şekilde yapılır.</li><li>Bitişik odalar simetrik yerine, aynı düzenin ardışık olarak tekrarlanması şeklinde konumlandırılırsa <strong>oda arasındaki duvarda oluşabilecek ses köprüleri azalır</strong>.</li><li>Prof. Roger S. Ulrich (Chalmers Teknoloji Üniversitesi, İsveç): iyi tasarım endişeyi azaltabilir, kan basıncını düşürebilir, ameliyat sonrası durumu iyileştirebilir, ağrı kesici ihtiyacını azaltabilir ve <strong>hastanede kalış süresini kısaltabilir</strong>.</li></ul>`);
Q(5,"Bitişik hasta odaları nasıl konumlandırılırsa odalar arası ses köprüleri azalır?","Aynı düzenin ardışık olarak tekrarlanmasıyla (simetrik yerleşim yerine)","Tüm yataklar ortak duvara yaslanarak","Odalar ayna görüntüsü simetrik dizilerek","Duvarlar kaldırılarak","Ses yalıtımı hasta konforu ve iyileşmesi için önemlidir.");
Q(5,"Hasta odası tasarımına göre iyi tasarımın etkilerinden biri hangisidir?","Hastanede kalış süresini kısaltabilir","Ağrı kesici ihtiyacını artırır","Ameliyat sonrası durumu kötüleştirir","Kan basıncını yükseltir","Ulrich: endişeyi azaltır, kan basıncını düşürür, ağrı kesici ihtiyacını azaltır.");
Q(6,"Enfekte deney hayvanı leşleri hangi atık grubundadır?","Enfeksiyöz atık","Patolojik atık|Genel atık|Ambalaj atığı","Biyolojik deneylerde kullanılan kobay leşleri ise patolojik atıktır.");
Q(6,"Biyolojik deneylerde kullanılan kobay leşleri hangi tıbbi atık grubundadır?","Patolojik atık","Enfeksiyöz atık|Kesici-delici atık|Radyoaktif atık","Enfekte deney hayvanı leşleri, organ parçaları ve kanı ise enfeksiyöz atıktır.");
