{q:"Negatif sağlık nedir?",a:"Sağlıksızlık (engellilik, yaralanma, sakatlık ve hastalık)",w:["Tam iyilik hali","Hastalık olmaması","Dengeli sağlık"],e:"Negatif sağlık: 'Sağlıksızlık' (engellilik, yaralanma, sakatlık ve hastalık…)"},
{q:"Nötral sağlık nedir?",a:"Hastalık veya rahatsızlık olmadığı, dengeli sağlık",w:["Sağlıksızlık","Tam iyilik hali","Ölüm"],e:"Nötral sağlık, herhangi bir hastalık veya rahatsızlık durumunun olmadığı, dengeli bir sağlık kavramını belirtmektedir."},
{q:"Pozitif sağlık nedir?",a:"Tam bir iyilik durumu",w:["Sağlıksızlık","Hastalık olmaması","Dengeli sağlık"],e:"Pozitif sağlık: sağlığın pozitif yönü tanımda 'tam bir iyilik durumu' şeklinde ifade edilmektedir."},
{q:"Orem'e göre sağlık nedir?",a:"Bireyin bedensel ve işlevsel olarak bir bütün içinde olma durumu",w:["Tam iyilik hali","Hastalık olmaması","Potansiyelini kullanma"],e:"Orem; sağlığı bireyin bedensel ve işlevsel olarak bir bütün içinde olma durumu olarak belirtmiştir."},
{q:"Nightingale'e göre sağlık nedir?",a:"İyi olma ve kişinin var olan potansiyelini en üst düzeyde kullanma",w:["Tam iyilik hali","Hastalık olmaması","Bütün içinde olma"],e:"Nightingale; sağlığı iyi olma ve kişinin var olan potansiyelini mümkün olduğu en üst düzeyde kullanma olarak tanımlamıştır."},
{q:"Peplau'ya göre sağlık nedir?",a:"Kişilik ve insan süreçlerinin yapılanmacılığın, yaratıcılığın ve üretkenliğin devamı",w:["Tam iyilik hali","14 temel gereksinim","Bütün içinde olma"],e:"Hildegard E. Peplau (1952): Sağlığı; kişilik ve diğer insan süreçleri olan yapılanmacılığın, yaratıcılığın ve üretkenliğin devamı olarak tanımlamıştır."},
{q:"Tıbbi açıdan 'disease' ile bireyin deneyimi 'illness' arasındaki fark nedir?",a:"Disease objektif patolojik anormallik; illness bireyin öznel deneyimi",w:["Disease öznel; illness objektiftir","İkisi aynı şeydir","Disease psikolojik; illness fizikseldir"],e:"Disease (objektif): belirli işaret ve semptomlarla kendini gösteren patolojik anormallik. Illness (subjektif): bireyin acı, rahatsızlık duyma durumu."},
{q:"Kronik hastalığı tanımlayan seçenek hangisidir?",a:"Genellikle 6 aydan uzun, aralıklarla tekrarlayan, uyum gerektiren durum",w:["Kısa sürede ortaya çıkan ciddi durum","Birkaç günde iyileşen durum","Yalnızca yaşlılarda görülen durum"],e:"Kronik hastalık: genellikle altı aydan daha uzun süreli olan ve belli aralıklarla tekrarı olan bir durumdur."},
{q:"Hasta olma davranışında 'dışsal değişken' hangisidir?",a:"Kültür, ekonomik durum, sağlık sisteminin özellikleri, sosyal destek",w:["Hastalığı algılayış biçimi","Semptomlara karşı kişisel davranış","Bireyin hastalık algısı"],e:"Dışsal değişkenler: sosyal gruplar, kişinin kültürü, ekonomik durumu, sağlık sisteminin özellikleri, sosyal desteği."},
{q:"Bacak amputasyonu gibi beden imajını etkileyen durumda birey hangi aşamalardan geçer?",a:"Şok, geri çekilme, bilgilenme, kabul, rehabilitasyon",w:["Öfke, pazarlık, depresyon, hızlı kabul","Yalnızca inkar ve öfke","Yalnızca şok ve kabul"],e:"Bacak amputasyonu gibi beden imajını etkileyecek bir durum olduğunda birey; şok, geri çekilme, bilgilenme, kabul ve rehabilitasyon aşamalarını geçirir."},
{q:"Sağlık inanç ve uygulamalarını etkileyen İÇ değişken hangisidir?",a:"Büyüme-gelişme dönemi",w:["Aile","Sosyoekonomik durum","Kültürel özellikler"],e:"İç değişkenler: büyüme-gelişme düzeyi, entelektüel düzey, fonksiyonların algılanması, emosyonel faktörler, spiritüel faktörler."},
{q:"Akut hastalık nedir?",a:"Kısa sürede ortaya çıkmış ve ciddi olan, birçok fonksiyonu etkileyebilen durum",w:["6 aydan uzun süren durum","Aralıklarla tekrarlayan durum","Yalnızca hafif seyreden durum"],e:"Akut hastalık: kısa sürede ortaya çıkmıştır ve ciddidir. Birçok fonksiyonu etkileyebilir."},
{q:"Hasta olma davranışını etkileyen içsel değişken nedir?",a:"Bireyin hastalık ve semptomlarını nasıl algıladığı",w:["Kültür","Ekonomik durum","Sosyal destek"],e:"İçsel değişkenler: bireyin hastalık ve hastalığın semptomlarını nasıl algıladığı hastalığa karşı olan davranışlarını etkiler."},
{q:"Hastalık tanısı almayla bireyler hangi tepkileri gösterir?",a:"Anksiyete, şok, inkar, öfke, içe kapanma",w:["Yalnızca mutluluk","Yalnızca kabul","Yalnızca umut"],e:"Hastalık tanısı almayla beraber bireyler anksiyete, şok, inkar, öfke, içe kapanma gibi tepkiler gösterir."},
{q:"Sağlığa sosyal/psikolojik boyut katan, 'rolleri yerine getirememe = hasta olabilir' diyen Smith modeli hangisidir?",a:"Rol performans modeli",w:["Klinik model","Eudaimonistik model","Adaptif model"],e:"Rol performans modeli: sağlık kavramına sosyal ve psikolojik boyutlar katmıştır. Rollerini yerine getiremiyorsa klinik olarak sağlıklı görünse de hasta olabilir."},
{q:"Sağlık İnanç Modelini kim, neden geliştirdi?",a:"Rosenstock; 1950'lerde tarama programlarına katılımın yetersizliğini açıklamak için",w:["Pender; 1980'de sağlığı geliştirmek için","Neuman; 1990'da süreklilik için","Dunn; 1977'de esenlik için"],e:"1950'lerin başında, hastalıkların önlenmesi ve erken tanısında yer alan tarama programlarına katılımın yetersizliğini açıklamak için Rosenstock tarafından geliştirilmiştir."},
{q:"'Bireyin davranışında önceki davranışları etkilidir' diyen model hangisidir?",a:"Pender'in Sağlığı Geliştirme Modeli",w:["Sağlık İnanç Modeli","Suchman modeli","Smith modeli"],e:"Pender'in Sağlığı Geliştirme Modeli (1980, revize 1987, 1996): bireylerin davranışı üzerinde önceki davranışlarının etkili olduğu belirtilmektedir."},
{q:"Sağlığı 'ölümden üst düzey iyiliğe uzanan çizgide sürekli değişen' gören ve 1990'da oluşturulan model?",a:"Neuman'ın Sağlık/Hastalık Sürekliliği",w:["Dunn'ın Üst Düzey Esenlik","Smith'in klinik modeli","Pender'in Sağlığı Geliştirme Modeli"],e:"Neuman (1990) tarafından oluşturulmuştur. Sağlık bir çizgi üzerinde sürekli değişir: üst düzey iyilik, iyi düzey, normal, hastalık, ölüm."},
{q:"Suchman'a göre 'kontrolün hekime bırakıldığı' evre hangisidir?",a:"Bağımlı hasta rolü (4. evre)",w:["Hasta rolünü üstlenme","Tıbbi bakımla temas","İyileşme ve rehabilitasyon"],e:"Suchman (1965) 5 evre: 1) semptomların yaşanması 2) hasta rolünü üstlenme 3) tıbbi bakımla temas 4) bağımlı hasta rolü (kontrolün hekime bırakılması) 5) iyileşme ve rehabilitasyon."},
{q:"Smith'in klinik modeline göre sağlık nedir?",a:"Hastalık kavramının tersi",w:["Rolleri yerine getirme","Biyolojik olarak en iyi durumda olma","Fizik ve sosyal çevreyle etkili etkileşim"],e:"Klinik model: en dar bakış açısına sahip olan modeldir. İnsanların fizyolojik sistemlerinin fonksiyonları ile ilişkilidir. Sağlık hastalık kavramının tersidir."},
{q:"Smith'in eudaimonistik modeli neyi tanımlar?",a:"Kişinin biyolojik olarak en iyi durumda olmak istediğini ve yapmak istediğini başarabilmesi",w:["Rolleri yerine getirmesi","Hastalığın tersi olması","Fizik ve sosyal çevreyle etkileşim"],e:"Eudaimonistik model: Smith'e göre sağlık kavramının en kapsamlı modelidir. Sağlıklı kişi biyolojik olarak en iyi durumda ne olmak istiyorsa ve ne yapmak istiyorsa onu başarabildiği bir durumdur."},
{q:"Sağlık İnanç Modeli'nin esasları arasında hangisi yer alır?",a:"Hassasiyet/duyarlılık algısı",w:["Öz-etkililik algısı","Kişilerarası etkiler","Durumsal etkiler"],e:"Sağlık İnanç Modeli esasları: hassasiyet/duyarlılık algısı, ciddiyet algısı, yarar, tedavi algısı, maliyet, ipuçları."},
{q:"Pender'in Sağlığı Geliştirme Modeli'nde 'davranışa özgü kavramlar' arasında hangisi yer alır?",a:"Öz-etkililik algısı",w:["Hassasiyet algısı","Ciddiyet algısı","Maliyet algısı"],e:"Pender modelinde davranışa özgü kavramlar: yarar algısı, engel algısı, öz-etkililik algısı, aktiviteyle ilişkili etki, kişilerarası etkiler, durumsal etkiler."},
{q:"Üst Düzey Esenlik Modeli kim tarafından revize edilmiştir?",a:"Dunn (1977)",w:["Neuman (1990)","Pender (1980)","Rosenstock (1950)"],e:"Üst Düzey Esenlik Modeli 1950'nin sonlarında geliştirilmiştir. Dunn (1977) tarafından revize edilmiştir."},
{q:"Suchman'a göre 1. evre nedir?",a:"Semptomların yaşanması",w:["Hasta rolünü üstlenme","Tıbbi bakımla temas","Bağımlı hasta rolü"],e:"1. Semptomların yaşanması: Bir şeylerin yolunda olmadığının fark edilmesi."},
{q:"Suchman'a göre 5. evre nedir?",a:"İyileşme ve rehabilitasyon",w:["Semptomların yaşanması","Hasta rolünü üstlenme","Bağımlı hasta rolü"],e:"5. İyileşme ve rehabilitasyon: Hasta rolünün terk edilmesi."},
{q:"ICN'ye göre hemşirelik nedir?",a:"Birey/aile/toplum sağlığını koruma-geliştirmeye yardım eden, hastalıkta iyileştirme ve rehabilitasyona katılan meslek",w:["Yalnızca hastalıkta tedavi uygulayan meslek","Hekimin yardımcı personeli","Yalnızca hastanede çalışan meslek"],e:"ICN'e göre hemşirelik; kişinin, ailenin ve toplumun sağlığını koruma ve geliştirmeye yardım eden, hastalık halinde iyileştirme, rehabilite etmeye katılan bir meslek grubudur."},
{q:"ANA (1980) hemşireliği nasıl tanımlar?",a:"Var olan ve olabilecek sağlık sorunlarına karşı insan tepkilerinin tanı ve tedavisi",w:["Bilim ve sanattan oluşan sağlık disiplini","Hekim talimatlarını uygulama mesleği","Yalnızca bakım veren meslek"],e:"ANA (Amerikan Hemşireler Birliği) (1980): Hemşireliği; var olan ve olabilecek olan sağlık sorunlarına karşı gösterilen insan tepkilerinin tanı ve tedavisidir olarak tanımlamıştır."},
{q:"Hemşirelik Kanunu hangi kanun no. ve tarihle değiştirildi?",a:"5634 sayılı, 02.05.2007",w:["1219 sayılı, 1928","4924 sayılı, 1990","5634 sayılı, 01.01.2000"],e:"02.05.2007 tarihinde yayınlanan Hemşirelik Kanunu (Kanun no. 5634) ile hemşirelik tanımı ve görevleri düzenlenmiştir."},
{q:"Aşağıdakilerden hangisi hemşirenin mesleki sorumluluğu DEĞİLDİR?",a:"Sağlık ekibiyle iletişim ve iş birliğinden kaçınmak",w:["Standartların geliştirilmesine katkı","Öğrencilere uygun öğrenme ortamı hazırlamak","Araştırmalara katılmak"],e:"Sorumluluklar arasında meslektaşları ve sağlık ekibiyle saygılı, yapıcı ve etkin iletişim ve iş birliği içinde çalışmak vardır. Kaçınmak değil."},
{q:"Diyabetliye insülin uygulamayı ve kan şekeri takibini öğretmek hangi rol örneğidir?",a:"Öğretici / Eğitici rol",w:["Bakım rolü","Danışman / Rehber rol","Araştırmacı rol"],e:"Öğretici/Eğitici rol: hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek. Örnek: Diyabetli hastaya insülin uygulama ve kan şekeri takibini öğretmek."},
{q:"Yoğun bakım hemşiresinin kritik hastanın solunum desteğini sağlaması hangi rol örneğidir?",a:"Bakım rolü",w:["Eğitici rol","Danışman rol","Araştırmacı rol"],e:"Bakım rolü (Caregiver): hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak, güvenli ve etkili bakım sunmak."},
{q:"Kanser hastasının tedavi seçeneklerini açıklayarak karar sürecine destek olmak hangi rol örneğidir?",a:"Danışman / Rehber rol",w:["Bakım rolü","Eğitici rol","Yönetici rol"],e:"Danışman/Rehber rol: bireyleri, aileleri veya toplumu sağlık kararlarında yönlendirmek; haklarını korumak."},
{q:"Yoğun bakımda bası yarası önleme yöntemlerinin etkinliğini araştırmak hangi rol örneğidir?",a:"Araştırmacı / Bilimsel rol",w:["Bakım rolü","Eğitici rol","Yönetici rol"],e:"Araştırmacı/Bilimsel rol: hemşirelik uygulamalarını geliştirmek için araştırma yapmak, veri toplamak ve analiz etmek."},
{q:"Hastane hemşirelik müdürünün servislerin personel planlamasını yönetmesi hangi rol örneğidir?",a:"Yönetici / Lider rol",w:["Bakım rolü","Eğitici rol","Araştırmacı rol"],e:"Yönetici/Lider rol: hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak."},
{q:"Sağlık ocağında çocukluk çağı aşılarını organize etmek hangi rol örneğidir?",a:"Toplum sağlığı hemşiresi",w:["Bakım rolü","Eğitici rol","Araştırmacı rol"],e:"Toplum sağlığı hemşiresi: bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek. Aşı kampanyaları, sağlık taramaları düzenlemek."},
{q:"Ulusal hemşirelik derneklerinde politika geliştirmeye katılmak hangi rol örneğidir?",a:"Liderlik ve Politik rol",w:["Bakım rolü","Eğitici rol","Araştırmacı rol"],e:"Liderlik ve Politik rol: sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek."},
{q:"Hemşirelik Kanunu Madde 4'e göre hemşireler acil haller dışında tedavileri nasıl uygular?",a:"Tabip tarafından yazılı olarak verilen tedavileri uygular",w:["Sözlü talimatla","Kendi kararıyla","Hasta istediği zaman"],e:"Madde 4: Hemşireler; tabip tarafından acil haller dışında yazılı olarak verilen tedavileri uygulamakla görevli ve yetkilidir."},
{q:"THD (1981) hemşireliği nasıl tanımlar?",a:"Bireyin, ailenin ve toplumun sağlığını ve esenliğini koruma, geliştirme ve hastalık halinde iyileşme amacına yönelik bilim ve sanattan oluşan sağlık disiplini",w:["Yalnızca hastalık tedavisi","Hekim yardımcılığı","Yalnızca bakım hizmeti"],e:"THD (Türk Hemşireler Derneği) (1981) hemşireliği; bireyin, ailenin ve toplumun sağlığını ve esenliğini koruma, geliştirme ve hastalık halinde iyileşme amacına yönelik hemşirelik hizmetlerinin planlanması, örgütlenmesi, uygulanması ve değerlendirilmesinden, bu kişilerin eğitiminden sorumlu bilim ve sanattan oluşan bir sağlık disiplini şeklinde tanımlamıştır."},
{q:"Kuram nedir?",a:"Olayları açıklayan, kavramlar arası ilişkiyi sağlayan genel ilke",w:["Kanıtlanmış tek bir gözlem","Bir kavramın sözlük tanımı","Deneysel bir sonuç"],e:"Kuram 'görüş' demektir; olayları açıklayan genel ilkedir; kavramlar arasındaki ilişkiyi sağlar; bilimsel bilginin ortaya çıkmasını sağlar."},
{q:"Kapsamı çok büyük ve soyut olan, doğrudan uygulamaya temel olmayan kuram türü hangisidir?",a:"Grand kuram",w:["Orta ölçekli kuram","Öngörü kuramı","Betimleyici kuram"],e:"Grand kuram: kapsam olarak çok büyük ve karmaşıktır. İleri düzey araştırmaları gerektirir. Özellikle hemşirelik uygulamalarına temel olmaz."},
{q:"Hemşirelikte kuramsal çalışma türleri arasında 'Orta düzey hemşirelik kuramcıları' hangi grupta yer alır?",a:"Mercer, Mishel, Reed, Kolcaba, Beck, Swanson",w:["Nightingale, Watson, Ray","Levine, Rogers, Orem, King","Orlando, Pender, Leininger, Newman"],e:"Orta düzey hemşirelik kuramcıları: Mercer, Mishel, Reed, Kolcaba, Beck, Swanson."},
{q:"'1860: Çevre koşullarını düzenleyerek iyileşmeyi kolaylaştırmak' hangi kuramcının amacıdır?",a:"Nightingale",w:["Peplau","Henderson","Abdellah"],e:"Nightingale (1860): Çevre koşullarını düzenleyerek iyileşmeyi kolaylaştırmak."},
{q:"Henderson ve Roper-Logan-Tierney hangi kuram grubuna girer?",a:"Gereksinim kuramları",w:["Etkileşim kuramları","Sonuç kuramları","Bakım kuramları"],e:"Gereksinim kuramları: bireylerin fiziksel ve mental gereksinimlerini karşılamak için bireylere yardım etmeye temellenmiştir. Ör: Henderson, Roper, Logan-Tierney."},
{q:"Orlando ve Peplau hangi kuram grubuna girer?",a:"Etkileşim kuramları",w:["Gereksinim kuramları","Sonuç kuramları","Felsefeler"],e:"Etkileşim kuramları: bakım sürecine ve hemşire/hasta arasındaki ilişkinin devamlılığına yoğunlaşmıştır. Ör: Orlando, Peplau."},
{q:"Neuman ve Roy hangi kuram grubuna girer?",a:"Bakımın sonucunu temel alan kuramlar",w:["Gereksinim kuramları","Etkileşim kuramları","Felsefeler"],e:"Bakımın sonucunu temel alan kuramlar: bakımın yeterliliğine ve bireyin sonuçtan memnun olup olmadığına önem verir. Ör: Neuman, Roy."},
{q:"Tüm kuramcıların ortak yönü nedir?",a:"Birey kendi sorumluluğunu alıncaya kadar onun sorumluluğunu üstlenme",w:["Yalnızca ilaç uygulama","Yalnızca cerrahi girişim","Yalnızca tanı koyma"],e:"Tüm kuramcıların ortak yönleri: birey kendi sorumluluğunu alıncaya kadar onun sorumluluğunu üstlenme; sağlığın sürdürülmesi veya yeniden kazanılması için çevreyi kontrol etme ya da değiştirme; belirli amaçlara ulaşmada bireye yardımcı olma."},
{q:"Kuramın bileşenleri arasında hangisi yer alır?",a:"Kavramlar ve tanımlar",w:["Hipotezler ve testler","Deneyler ve sonuçlar","İlaçlar ve tedaviler"],e:"Kuramın bileşenleri: kavramlar ve tanımlar; ilişkisel açıklamalar/ifadeler; bağlantılar ve düzenleme."},
{q:"Kuramların analizinde 'netlik' neyi sorgular?",a:"Bu kuram ne kadar net?",w:["Bu kuram ne kadar sade?","Bu kuram ne kadar genellenebilir?","Bu kuram ne kadar önemli?"],e:"Kuramların analizi: netlik (ne kadar net?), sadelik (ne kadar sade?), genellenebilirlik (ne kadar genellenebilir?), deneysel kesinlik (nasıl ulaşılabilir/test edilebilir?), erişilebilir sonuçlar (ne kadar önemli?)."},
{q:"Orem'in kuramı hangi grupta yer alır?",a:"Kavramsal modeller ve grand kuramlar",w:["Felsefeler","Orta düzey hemşirelik kuramları","Hemşirelik kuramları"],e:"Kavramsal modeller ve grand kuramlar: Levine, Rogers, Orem, King, Neuman, Roy, Johnson."},
{q:"Watson'un kuramı hangi grupta yer alır?",a:"Felsefeler",w:["Kavramsal modeller","Hemşirelik kuramları","Orta düzey kuramlar"],e:"Felsefeler: Nightingale, Watson, Ray, Benner, Martinsen, Erikson."},
{q:"Kolcaba'nın Konfor Kuramı hangi grupta yer alır?",a:"Orta düzey hemşirelik kuramları",w:["Felsefeler","Grand kuramlar","Hemşirelik kuramları"],e:"Orta düzey hemşirelik kuramları: Mercer, Mishel, Reed, Kolcaba, Beck, Swanson."},

{q:"Orta ölçekli kuramların özelliği nedir?",a:"Kapsamı sınırlıdır ve bir fenomenin uygulamaya nasıl aktarılacağını gösterir",w:["Çok büyük ve karmaşıktır","Doğrudan uygulamaya temel olmaz","Yalnızca teoriktir"],e:"Orta ölçekli kuramlar: kapsam ve soyut kavramlar açısından daha sınırlıdır. Belli bir fenomenin uygulamaya nasıl aktarılacağını gösterir."},
{q:"Betimleyici/açıklayıcı kuramların özelliği nedir?",a:"Kuram gelişim sürecinin ilk basamağıdır",w:["Sonuçları önceden tahmin eder","Çok büyük ve karmaşıktır","Uygulamaya doğrudan temel olur"],e:"Betimleyici/açıklayıcı kuramlar: kuram gelişim sürecinin ilk basamağıdır. Fenomenin oluşturulma nedenini ve sonuçlarını tanımlar, yorumlar."},
{q:"Öngörü kuramlarının özelliği nedir?",a:"Bir fenomenin sonuçlarını önceden tahmin eder",w:["Kuram gelişiminin ilk basamağıdır","Çok büyük ve karmaşıktır","Yalnızca tanılamada yol gösterir"],e:"Öngörü kuramları: bir fenomenin veya hemşirelik uygulamalarının sonuçlarını önceden tahmin eder ve belirler. Hemşirelik uygulamalarının araştırmalarla test edilmesini sağlar."},
{q:"Kavram haritasında ana kavram nasıl seçilir?",a:"Metnin en önemli düşüncesi, en genel kavramı veya teması",w:["İlk cümlesi","En kısa kelimesi","En zor kelimesi"],e:"Haritalanacak metin iyice okunmalı; metnin en önemli düşüncesi, en genel kavramı veya teması ana kavram olarak seçilmeli."},
{q:"Kavram haritasında aynı önem seviyesindeki kavramlar nasıl gösterilir?",a:"Aynı hiyerarşik düzeyde ve aynı renk/şekilde",w:["Farklı düzeylerde","Farklı renklerde","Rastgele"],e:"Aynı önem seviyesindeki kavramlar aynı hiyerarşik düzeyde bulunmalı, aynı düzeyde bulunan kavramlar aynı renk ya da şekilde olmalı."},
{q:"Kavram haritasında kavramlar neden kutu ya da yuvarlak içine alınır?",a:"Birbirlerinden kolay ayırt edilebilmeleri için",w:["Güzel görünmesi için","Yer kazanmak için","Zaman kazanmak için"],e:"Kavramlar birbirlerinden kolay ayırt edilebilsin diye ya kutu ya da yuvarlak içine alınmalı."},
{q:"Kavram haritasında başlık nasıl olmalıdır?",a:"Güçlü bir temeli olan ve öğrencilerin önceki bildiklerini harekete geçiren",w:["Kısa ve anlamsız","Uzun ve karmaşık","Sadece sayıdan oluşan"],e:"Haritaya güçlü bir temeli olan başlık seçilmeli; ayrıca bu başlık öğrencilerin önceki bildiklerini harekete geçirmeli."},
{q:"Kavram haritaları hangi tür öğrenmeyi destekler?",a:"Anlamlı öğrenmeyi",w:["Ezber öğrenmeyi","Pasif öğrenmeyi","Rastgele öğrenmeyi"],e:"Kavram haritaları anlamlı öğrenmeyi destekler; ezber yerine neden-sonuç ilişkisi kurmayı öğretir."},
{q:"Orem'e göre insan ve çevre ilişkisi nasıldır?",a:"Bir bütün oluştururlar ve birindeki değişiklik öz-bakım sistemini etkiler",w:["Ayrıdırlar ve etkileşmezler","Yalnızca çevre insanı etkiler","Yalnızca insan çevreyi etkiler"],e:"Orem'e göre insan ve çevre birbirleriyle bir bütün oluştururlar ve bunların birindeki değişiklik öz-bakım sistemini etkileyebilir."},
{q:"Henderson'a göre insana bakım vermek için ne gerekir?",a:"Onu tanımak ve gereksinimlerini bilmek",w:["Yalnızca hastalığını bilmek","Yalnızca ilaçlarını bilmek","Yalnızca yaşını bilmek"],e:"Henderson'a göre insana bakım vermek için onu tanımak ve gereksinimlerini bilmek önemlidir."},
{q:"Abdellah'a göre hasta birey nasıldır?",a:"Bir bütündür, parçaları onun sorunudur",w:["Parçalardan oluşur ve her parça ayrıdır","Yalnızca fiziksel bir varlıktır","Yalnızca psikolojik bir varlıktır"],e:"Abdellah'a göre hasta birey bir bütündür, parçaları ise onun sorunudur ve bütün parçalarından büyük değildir."},
{q:"Genel Sistem Teorisinde 'homeostazi' ne demektir?",a:"İç denge",w:["Dış denge","Enerji akışı","Geri bildirim"],e:"Sistemin homeostazisi (iç denge) vardır. Yaşayan tüm sistemler açık sistemlerdir."},
{q:"Genel Sistem Teorisinde bir parçadaki değişiklik neyi etkiler?",a:"Diğer parçaları",w:["Hiçbir şeyi","Yalnızca kendini","Yalnızca üst sistemi"],e:"Bir parçadaki değişiklik diğerini etkiler. Sistem alt ve üst sistemlerden oluşur."},
{q:"Diyabetik hastada pnömoni gelişmesi neye örnektir?",a:"Alt sistemlerdeki değişimin diğer sistemleri etkilemesine",w:["Yalnızca solunum sisteminin etkilenmesine","Yalnızca kan şekerinin etkilenmesine","Yalnızca hastaneye yatışa"],e:"Diyabetik bir hasta pnömoni olsa alt sistemlerde değişim olur. Enfeksiyon kan şekerinin değişimine neden olacak. Bu nedenle hastaneye yatması gerekecek."},
{q:"Maslow'a göre hangi ihtiyaçlar önceliklidir?",a:"Fizyolojik ihtiyaçlar",w:["Güvenlik ihtiyaçları","Ait olma ihtiyaçları","Kendini gerçekleştirme"],e:"Maslow piramidinin en altında fizyolojik ihtiyaçlar yer alır ve bunlar önceliklidir."},
{q:"Temel gereksinimler birbiriyle ilişkili midir?",a:"Evet, bir gereksinimin karşılanamaması diğerini etkiler",w:["Hayır, bağımsızdırlar","Yalnızca fizyolojik olanlar ilişkilidir","Yalnızca sosyal olanlar ilişkilidir"],e:"Temel insan gereksinimleri birbiriyle ilişkilidir. Bir gereksinimin karşılanamaması diğerini etkiler."},
{q:"Hemşire neden hastanın gereksinimlerini ve öncelik sırasını bilmelidir?",a:"Başarılı bakım verebilmek için",w:["Zaman kazanmak için","Kâğıt işlerini tamamlamak için","Yalnızca rapor yazmak için"],e:"Hemşire, hastaya ya da sağlıklı bireye verdiği bakımda, başarılı olabilmesi için temel insan gereksinimlerini ve bunların öncelik sırasını iyi bilmelidir."},
{q:"Neden her birey kendine özgü ve özeldir?",a:"Çünkü benzer iki insan yoktur; her birey farklıdır",w:["Çünkü herkes aynıdır","Çünkü gereksinimler aynıdır","Çünkü bakım aynıdır"],e:"Tüm insanların ortak ihtiyaçları olmasına rağmen, birbirinin benzeri iki insan da bulunamaz. Her birey kendine özgü ve özeldir."},
{q:"Nightingale'e göre havalandırma nasıl yapılmalıdır?",a:"Hava cereyanı yaratmaksızın, pencereler yoluyla",w:["Kapılar açılarak","Klima ile","Vantilatör ile"],e:"Nightingale'e göre kötü ve küf kokulu bir hava hastalıklara kaynak oluşturduğundan hava cereyanı yaratmaksızın, odaların pencereler yoluyla havalandırmasını önermiştir."},
{q:"Nightingale'e göre gürültü neden önemlidir?",a:"Ani gürültüler uyku düzenini bozar",w:["Gürültü hastalığa neden olur","Gürültü iyileşmeyi hızlandırır","Gürültü önemsizdir"],e:"Nightingale'e göre hastaların çoğu sessiz ortamlarda uyudukları için özellikle ani gürültüler uyku düzenini bozacaktır. Hasta odasının önünde, hastanın durumunun tartışılmaması da önemlidir."},
{q:"Nightingale'e göre koku nasıl yönetilmelidir?",a:"Hastalığa sebep olabilecek zararlı kokular çevreden uzaklaştırılmalıdır",w:["Kokular önemsizdir","Kokular hastalığı iyileştirir","Kokular uykuyu düzenler"],e:"Nightingale'e göre hastalığa sebep olabilecek zararlı kokuların çevreden uzaklaştırılması bakımın kapsamındadır."},
{q:"Nightingale'e göre ısıtma nasıl olmalıdır?",a:"Hastanın beden ısısının azalmasına karşı yerel sıcak uygulamalar",w:["Oda sıcaklığı yüksek tutulmalı","Hasta kalın battaniyeyle örtülmeli","Pencere açık tutulmalı"],e:"Nightingale'e göre hastanın beden ısısının azalmasına karşı uyanık davranarak yerel sıcak uygulamalar yardımı ile ısının korunması sağlanmalıdır."},
{q:"Hava kirliliğinin en temel nedenleri nelerdir?",a:"Fabrikalar ve otomobiller",w:["Ormanlar ve bitkiler","Rüzgâr ve yağmur","Güneş ve ay"],e:"Hava, su, toprak ve besin kirliliği, organik ve inorganik gazlar, parçacıklar hava kirliliğine neden olmaktadır. Fabrikalar ve otomobiller hava kirliliğinin en temel nedenleridir."},
{q:"Gece gündüz arasında ışık farkı neden önemlidir?",a:"Kişilerin hem fizik hem de ruh sağlığı için",w:["Yalnızca görme için","Yalnızca uyku için","Yalnızca çalışma için"],e:"Gece gündüz arasında farkın olması kişilerin hem fizik hem de ruh sağlığı açısından önemlidir."},
{q:"Kliniklerde gece yüksek sesin etkisi nedir?",a:"Hastaların uyku sorunu ve buna bağlı stres yaşaması",w:["Daha iyi uyumaları","Daha hızlı iyileşmeleri","Daha mutlu olmaları"],e:"Gece kliniklerde oluşan yüksek ses nedeniyle hastaların uyku sorunu ve buna bağlı stres yaşadıkları bildirilmektedir."},
{q:"Hoşa gitmeyen kokuların etkisi nedir?",a:"Yaşam kalitesini düşürür ve stresi artırır",w:["İyileşmeyi hızlandırır","Uykuyu düzenler","Mutluluk verir"],e:"Hoşa gitmeyen kokular kişinin yaşam kalitesini düşürdüğü ve stresini arttırdığı belirtilmektedir."},
{q:"Biyolojik dış çevre nedir?",a:"Güneş, ısı, mikroorganizmalar ve evrendeki diğer tüm canlılar",w:["Yaş, genetik özellikler, ırk","İklim, gürültü, coğrafya","Aile, gruplar, toplum"],e:"Biyolojik dış çevre: güneş, ısı, mikroorganizmalar ve evrendeki diğer tüm canlılar."},
{q:"Sosyal çevre nedir?",a:"İnsanın yakın, geniş ve evrensel çevresi ile etkileşim süreci",w:["Yalnızca aile","Yalnızca fiziksel ortam","Yalnızca mikroorganizmalar"],e:"Sosyal çevre: insanın yakın çevresi (aile), geniş çevresi (grup, toplum) ve evrensel çevresi (ülke, dünya, uzay) ile etkileşim sürecine bağlı, bireyin toplumlaşma olgusunu sağlayan bir ortamdır."},
{q:"Grup nedir?",a:"Belirli amaç ve fonksiyonları yerine getirmek için bir araya gelen topluluklar",w:["Aynı yönetim altında yaşayanlar","Ortak kültürü olanlar","Aynı bölgede yaşayanlar"],e:"Grup: belirli zamanlarda belirli amaç ve fonksiyonları yerine getirmek için bir araya gelen topluluklardır. Örnek: Türk Kızılayı Sağlık grupları."},
{q:"Toplum nedir?",a:"Aynı yönetim altında, aynı bölgede yaşayan ve ortak kültürü olan gruplar",w:["Belirli amaç için bir araya gelenler","Yalnızca aile","Yalnızca akrabalar"],e:"Toplum: aynı yönetim altında, aynı bölgede yaşayan ve ortak kültürü olan gruplardır."},
{q:"Toplum sağlığını etkileyen faktörler arasında hangisi yer alır?",a:"Ekonomik özellikler",w:["Yalnızca iklim","Yalnızca coğrafya","Yalnızca genetik"],e:"Toplum sağlığını etkileyen faktörler: ekonomik özellikler, kültür/ırk/sağlık hakkındaki inançlar, endüstrileşme, uygunsuz ve kalabalık yaşam ortamları, sağlık bakım kurumlarının çeşidi ve tipi, hükümetlerin sağlık bakım için planlarının kalitesi."},
{q:"Kültürün 'öğrenilir' özelliği ne anlama gelir?",a:"Kişi davranışları, tutumları ve inançları içinde yaşadığı kültürel aile sisteminden öğrenir",w:["Kültür doğuştandır","Kültür genetik aktarılır","Kültür değişmez"],e:"Kültür öğrenilir: kişi davranışları, tutumları ve inançları içinde yaşadığı, onu destekleyen ve eğiten kültürel aile sisteminden öğrenir."},
{q:"Kültürün 'değişir ama durağandır' özelliği ne anlama gelir?",a:"Dil, normlar, gelenek ve göreneklerin sabit olması ile ilgilidir",w:["Kültür asla değişmez","Kültür her gün değişir","Kültür sadece bireyseldir"],e:"Kültür değişir, fakat aynı zamanda durağandır, sabittir. Dil, normlar, gelenek ve göreneklerin sabit olması ile ilgilidir."},
{q:"Kültürün bileşenleri arasında hangisi yer alır?",a:"İletişim sistemi",w:["Genetik yapı","Biyolojik ritim","Kan dolaşımı"],e:"Her kültürün bileşenleri ve örüntüleri vardır: iletişim sistemi, aile sistemi, gelenekler, görenekler, adetler ve dil."},
{q:"Din kültürel değişken olarak neyi etkiler?",a:"Acı çekme, hastalığa anlam verme, yetersizlik hissetme ve ölümü kabul etme",w:["Yalnızca beslenme","Yalnızca giyim","Yalnızca barınma"],e:"Bireyin inancı, sıklıkla acı çekme, hastalığa anlam verme, yetersizlik hissetme ve ölümü kabul etmede etkilidir."},
{q:"Aile yapısı kültürden nasıl etkilenir?",a:"Ailedeki sayı ve gelişimsel düzey aile işlevlerinde değişime neden olur",w:["Aile yapısı kültürden etkilenmez","Aile yapısı yalnızca ekonomiden etkilenir","Aile yapısı yalnızca iklimden etkilenir"],e:"Aile yapısı: ailenin özellikleri içinde yaşadığı toplumun kültürel özelliklerinden etkilenir. Ailedeki sayı ve ailedekilerin gelişimsel düzeyi aile işlevlerinde değişimlere neden olur."},
{q:"Beslenme davranışları kültürden nasıl etkilenir?",a:"Kültürel etkiler nedeniyle kişilerin beslenme biçimleri etkilenir",w:["Beslenme kültürden etkilenmez","Beslenme yalnızca genetikle belirlenir","Beslenme yalnızca ekonomik düzeyle belirlenir"],e:"Beslenme davranışları: kültürel etkiler nedeniyle kişilerin beslenme biçimleri etkilenmektedir."},
{q:"Sağlığın tanımı ilk kez kim tarafından ve hangi yıl yapılmıştır?",a:"DSÖ, 1947",w:["Orem, 1971","Nightingale, 1860","Peplau, 1952"],e:"Dünya Sağlık Örgütü (DSÖ) 1947'de sağlığı tanımlamıştır."},
{q:"Sağlık kavramını etkileyen 'yaşam stili' neyi içerir?",a:"Alışkanlıklar ve yaşam prensipleri",w:["Genetik faktörler","Çevresel faktörler","Sağlık bakımı"],e:"Yaşam stili (alışkanlıklar, yaşam prensipleri) sağlık kavramını etkileyen dört unsurdan biridir."},
{q:"Sağlığın negatif yönü nedir?",a:"Sağlıksızlık (engellilik, yaralanma, sakatlık ve hastalık)",w:["Tam iyilik hali","Hastalık olmaması","Dengeli sağlık"],e:"Negatif sağlık: 'Sağlıksızlık' (engellilik, yaralanma, sakatlık ve hastalık…)"},
{q:"Sağlığın pozitif yönü nedir?",a:"Tam bir iyilik durumu",w:["Sağlıksızlık","Hastalık olmaması","Dengeli sağlık"],e:"Pozitif sağlık: sağlığın pozitif yönü tanımda 'tam bir iyilik durumu' şeklinde ifade edilmektedir."},
{q:"Hastalık nedir?",a:"Bireyin fiziksel, ruhsal, entelektüel, sosyal ve gelişim evrelerinde ya da spiritüel fonksiyonlarında gerileme veya azalma",w:["Yalnızca fiziksel bir bozukluk","Yalnızca psikolojik bir bozukluk","Yalnızca sosyal bir bozukluk"],e:"Hastalık bireyin fiziksel, ruhsal, entelektüel, sosyal ve gelişim evrelerinde ya da spiritüel fonksiyonlarında gerileme veya azalmanın meydana gelmesidir."},
{q:"DSÖ'ye göre hastalık nedir?",a:"Fiziksel, akılsal ve sosyal tam bir iyilik halinin yokluğu",w:["Yalnızca fiziksel bozukluk","Yalnızca akılsal bozukluk","Yalnızca sosyal bozukluk"],e:"DSÖ ise hastalığı; fiziksel, akılsal ve sosyal tam bir iyilik halinin yokluğu şeklinde tanımlamıştır."},
{q:"Hemşireler neden hastalıktan çok hastalığın kişideki bireysel etkilerine odaklanmalıdır?",a:"Çünkü birey hasta olmadığı halde kendini hasta, hasta olduğu halde sağlıklı algılayabilir",w:["Çünkü hastalık önemsizdir","Çünkü tanı gereksizdir","Çünkü tedavi yoktur"],e:"Birey herhangi bir hastalığı olsun ya da olmasın kendisini hasta olarak hissedebilir. Bu nedenle hemşireler hastalıktan çok, hastalığın kişideki bireysel etkilerine odaklanmalıdırlar."},
{q:"Hasta olma davranışını etkileyen faktörler arasında hangisi yer alır?",a:"Sosyal statü",w:["Yalnızca genetik","Yalnızca yaş","Yalnızca cinsiyet"],e:"Hasta olma davranışını kişisel özellikler, sosyal statü, sosyal normlar, olanaklar, kişinin çevresi gibi birçok şey etkilemektedir."},
{q:"Kısa süreli ve yaşamı tehdit etmeyen hastalıkların birey ve aileye etkisi nasıldır?",a:"Azdır",w:["Çok fazladır","Yoktur","Herkeste aynıdır"],e:"Kısa süreli ve yaşamı tehdit etmeyen hastalıkların birey ve aileye etkileri az, uzun süren ve yaşamı tehdit eden kronik hastalıkların ise birçok emosyonel ve davranışsal etkileri vardır."},
{q:"Beden imajını etkileyen durumlarda birey hangi aşamalardan geçer?",a:"Şok, geri çekilme, bilgilenme, kabul, rehabilitasyon",w:["Öfke, pazarlık, depresyon, kabul","Yalnızca inkar","Yalnızca öfke"],e:"Bacak amputasyonu gibi beden imajını etkileyecek bir durum olduğunda birey; şok, geri çekilme, bilgilenme, kabul ve rehabilitasyon aşamalarını geçirir."},
{q:"Kendilik kavramındaki etkilenme nasıl gözlenebilir?",a:"Kişilerin rollerindeki değişimler ile",w:["Kan testi ile","Röntgen ile","Yalnızca hasta ifadesi ile"],e:"Kendilik kavramındaki etkilenme çok komplekstir ve ancak kişilerin rollerindeki değişimler ile gözlenebilir."},
{q:"Hastalık durumunda aile rollerinde değişim neye neden olabilir?",a:"Stres ve çatışmalara",w:["Mutluluğa","Huzura","Ekonomik rahatlamaya"],e:"Hastalık durumunda aile içindeki rollerde değişim olur. Bu durum stres ve çatışmalara neden olabilir."},
{q:"Sağlık inanç ve uygulamalarını etkileyen iç değişkenlerden biri nedir?",a:"Entelektüel düzey",w:["Aile","Kültürel özellikler","Sosyoekonomik faktörler"],e:"İç değişkenler: büyüme-gelişme düzeyi, entelektüel düzey, fonksiyonların algılanması, emosyonel faktörler, spiritüel faktörler."},
{q:"Çocuklar için hastaneye yatma ne anlama gelir?",a:"Korku ve anksiyete",w:["Mutluluk","Rahatlama","Eğlence"],e:"Çocuklar için hastalık ve özellikle hastaneye yatma korku ve anksiyete anlamına gelir. Özellikle bilgi eksikliği ve işlemler bu korkunun temel nedenidir."},
{q:"Fonksiyonların algılanması sağlığı nasıl etkiler?",a:"Kişilerin fiziksel fonksiyonları inanç ve uygulamalarını etkiler",w:["Fonksiyonlar sağlığı etkilemez","Yalnızca fiziksel sağlığı etkiler","Yalnızca psikolojik sağlığı etkiler"],e:"Fonksiyonların algılanması: kişilerin fiziksel fonksiyonları inanç ve uygulamalarını etkilemektedir. Örneğin bulantı, kusması olan bir birey kendisini yorgun hissettiği gibi öz bakımını da gerçekleştiremeyebilir."},
{q:"Emosyonel faktörler sağlığı nasıl etkiler?",a:"Stres, depresyon ve korkular sağlık inanç ve uygulamalarını etkiler",w:["Emosyonlar sağlığı etkilemez","Yalnızca olumlu emosyonlar etkiler","Yalnızca olumsuz emosyonlar etkiler"],e:"Emosyonel faktörler: kişilerin stresi, depresyonu ve korkuları sağlık inanç ve uygulamalarını etkileyebilir. Emosyonel durumu iyi olan kişiler hastalıkları ile daha iyi baş edebilirler."},
{q:"Spiritüel faktörler sağlığı nasıl etkiler?",a:"Kişinin ailesi, arkadaşları ile iletişimleri, yaşamın anlamı, yaşam biçimini şekillendirir",w:["Spiritüel faktörler sağlığı etkilemez","Yalnızca dini ritüelleri etkiler","Yalnızca ölümü etkiler"],e:"Spiritüel faktörler: kişinin ailesi, arkadaşları ile iletişimleri, yaşamın anlamı, kişinin yaşam biçiminin nasıl olacağını şekillendiren özellikleridir."},
{q:"Aile sağlık inanç ve uygulamalarını nasıl etkiler?",a:"Kişinin hastalık ciddiyeti algısını, önlemleri ve tepkileri etkiler",w:["Aile sağlığı etkilemez","Yalnızca genetik hastalıkları etkiler","Yalnızca ekonomik durumu etkiler"],e:"Aile: kişinin hastalık ciddiyeti ile ilgili algısını, hastalığa karşı önlemleri ve hastalığa karşı tepkileri etkilemektedir. Örneğin düzenli sağlık kontrolü yaptıran bir annenin kızının da benzer davranışı göstermesi beklenir."},
{q:"Kültür sağlık bakımını nasıl etkiler?",a:"Sağlık bakım sistemine yaklaşımı, kişisel sağlık uygulamalarını, hasta-hemşire iletişimini etkiler",w:["Kültür sağlığı etkilemez","Yalnızca beslenmeyi etkiler","Yalnızca giyimi etkiler"],e:"Kültürel özellikler: kültür sağlık bakım sistemine yaklaşımı, kişisel sağlık uygulamalarını, hasta-hemşire iletişimini etkiler. Hemşire kültürü tanımazsa etkili bakım sunamaz."},
{q:"Sosyoekonomik faktörler sağlığı nasıl etkiler?",a:"Sağlığı korumayı ve sağlık sorunlarında çözüm arama davranışını etkiler",w:["Sosyoekonomik faktörler sağlığı etkilemez","Yalnızca genetik hastalıkları etkiler","Yalnızca yaşam süresini etkiler"],e:"Sosyo-ekonomik faktörler: ekonomik durum kişinin sağlığını korumasını etkilediği gibi sağlık sorunları çıktığında çözüm arama davranışlarını da etkileyecektir."},
{q:"Sağlığı koruma nedir?",a:"Düzenli egzersiz, iyi beslenme gibi sağlığın mevcut durumunu sürdürmeye odaklanma",w:["Hastalık tedavisi","İmmünizasyon","Stres yönetimi"],e:"Sağlığı koruma: düzenli egzersiz yapma, iyi beslenme, sağlığın var olan durumunu sürdürmeye odaklanmaktadır."},
{q:"İyilik kavramı nedir?",a:"Kişinin kendisini sağlıklı hissetmesi için neler yapması gerektiğini öğrenmesi",w:["Hastalık tedavisi","İmmünizasyon","Sağlığı koruma"],e:"İyilik kavramı: kendi sorumluluğunu alma, stres yönetimi, fiziksel farkındalık gibi kişinin kendisini sağlıklı hissetmesi için neler yapması gerektiğini öğrenmesidir."},
{q:"Hastalığın önlenmesi nedir?",a:"İmmünizasyon programları gibi hastalıkları önlemeye yönelik aktiviteler",w:["Düzenli egzersiz","İyi beslenme","Stres yönetimi"],e:"Hastalığın önlenmesi: immünizasyon programları gibi sağlığın seviyesini artırmaya ya da hastalıkları önlemeye yönelik aktiviteleri içerir."},
{q:"Sağlık düzeyinin belirleyicileri arasında hangisi yer alır?",a:"Fizik aktivite",w:["Yalnızca genetik","Yalnızca yaş","Yalnızca cinsiyet"],e:"Sağlık düzeyinin belirleyicileri: fizik aktivite, aşırı kilo ve obezite, sigara kullanımı, madde kullanımı, seksüel davranışın sorumluluğunu alma, mental sağlık, şiddet, çevre kalitesi, immünizasyon, sağlığa ulaşılabilirlik."},
{q:"Smith'in klinik modeli hangi bakış açısına sahiptir?",a:"En dar bakış açısına",w:["En geniş bakış açısına","Orta düzey bakış açısına","Sosyal bakış açısına"],e:"Klinik model: en dar bakış açısına sahip olan modeldir. İnsanların fizyolojik sistemlerinin fonksiyonları ile ilişkili modeldir."},
{q:"Smith'in adaptif modeli neyin birleşimidir?",a:"Klinik model ve rol performans modelinin",w:["Klinik model ve eudaimonistik modelin","Rol performans ve eudaimonistik modelin","Sadece klinik modelin"],e:"Adaptif model (Uyum Modeli): klinik model ve rol performans modelinin birleşimi uyum modelidir. Sağlık, fizik ve sosyal çevre ile bireyin etkili etkileşimidir."},
{q:"Smith'in eudaimonistik modeli nasıl bir modeldir?",a:"En kapsamlı model",w:["En dar model","Orta düzey model","Sosyal model"],e:"Eudaimonistik model: Smith'e göre sağlık kavramının en kapsamlı modelidir."},
{q:"Sağlık İnanç Modeli hangi amaçla kullanılır?",a:"Sağlıkla ilgili davranış değişikliğinin açıklanması, sağlığın sürdürülmesi ve koruyucu sağlık davranışı",w:["Yalnızca hastalık tedavisi","Yalnızca cerrahi girişim","Yalnızca ilaç uygulama"],e:"Model sağlıkla ilgili davranış değişikliğinin açıklanması, sağlığın sürdürülmesi ve koruyucu sağlık davranışı ile ilgili müdahale araştırmalarının planlanmasında kullanılmaktadır."},
{q:"Sağlık İnanç Modeli'nde 'ciddiyet algısı' nedir?",a:"Hastalığın ciddiyet ve kişinin yaşamı için ne kadar tehlikeli olduğunun algısı",w:["Hastalık olma olasılığı","Sağlık davranışının maliyeti","Tedavinin yararı"],e:"Ciddiyet algısı: hastalığın ciddiyet ve kişinin yaşamı için ne kadar ciddi tehlikeli olduğunun algısı."},
{q:"Sağlık İnanç Modeli'nde 'maliyet' nedir?",a:"Sağlık davranışının zaman, para, enerji açısından maliyeti, ağrı ve rahatsızlık gibi yan etkileri",w:["Hastalık olma olasılığı","Hastalığın ciddiyeti","Tedavinin yararı"],e:"Maliyet: sağlık davranışının zaman, para, enerji açısından maliyeti, ağrı ve rahatsızlık gibi olası yan etkileri."},
{q:"Pender'in modeli hangi yıllarda revize edilmiştir?",a:"1987 ve 1996",w:["1980 ve 1990","1990 ve 2000","1970 ve 1980"],e:"Pender tarafından 1980 yılında geliştirilmiş olup 1987 ve 1996 yılında revize edilmiştir."},
{q:"Neuman'ın Sağlık/Hastalık Sürekliliği Modeli'nde çizgi üzerindeki sıralama nedir?",a:"Üst düzey iyilik – iyi düzey – normal – hastalık – ölüm",w:["Ölüm – hastalık – normal – iyi düzey – üst düzey iyilik","Normal – hastalık – ölüm – iyi düzey – üst düzey iyilik","İyi düzey – normal – hastalık – ölüm – üst düzey iyilik"],e:"Çizgi üzerindeki durumlar: üst düzey iyilik (esenlik) → iyi düzey → normal → hastalık → ölüm."},
{q:"Üst Düzey Esenlik Modeli'nin amacı nedir?",a:"Bireyin sağlık potansiyelini en üst düzeye çıkarmak",w:["Hastalığı tedavi etmek","İlaç kullanımını azaltmak","Hastane yatışını azaltmak"],e:"Modelin amacı bireyin sağlık potansiyelini en üst düzeye çıkarmaktır. Sağlık bakımı hastalığın tedavisinden çok, bireyin sağlığını geliştirme ve hastalığı önleme aktivitelerini kapsar."},
{q:"Suchman'a göre 2. evre nedir?",a:"Hasta rolünü üstlenme",w:["Semptomların yaşanması","Tıbbi bakımla temas","Bağımlı hasta rolü"],e:"2. Hasta rolünü üstlenme: Bireyin hasta olduğunu ve yardıma ihtiyacı olduğunun fark edilmesi."},
{q:"Suchman'a göre 3. evre nedir?",a:"Tıbbi bakım ile temas",w:["Semptomların yaşanması","Hasta rolünü üstlenme","Bağımlı hasta rolü"],e:"3. Tıbbi bakım ile temas: Profesyonel yardım almaya karar verilmesi."},
{q:"Hemşirelik Kanunu'nda hemşire unvanı kimlere verilir?",a:"Lisans eğitimi veren fakülte/yüksekokul mezunu ve diploması Sağlık Bakanlığınca tescilli olanlara",w:["Sağlık meslek lisesi mezunlarına","Yalnızca yüksek lisans mezunlarına","Yalnızca doktora mezunlarına"],e:"Türkiye'de üniversitelerin hemşirelik ile ilgili lisans eğitimi veren fakülte ve yüksekokullarından mezun olan ve diplomaları sağlık bakanlığınca tescil edilenlere Hemşire ünvanı verilir."},
{q:"Hemşireler acil haller dışında tedavileri nasıl uygular?",a:"Tabip tarafından yazılı olarak verilen tedavileri uygular",w:["Sözlü talimatla","Kendi kararıyla","Hemşire kararıyla"],e:"Madde 4: Hemşireler; tabip tarafından acil haller dışında yazılı olarak verilen tedavileri uygulamakla görevli ve yetkilidir."},
{q:"Hemşireler her ortamda neyi belirlemekle görevlidir?",a:"Bireyin, ailenin ve toplumun hemşirelik girişimleri ile karşılanabilecek sağlıkla ilgili ihtiyaçlarını",w:["Yalnızca hastanın ilaç ihtiyacını","Yalnızca cerrahi ihtiyacını","Yalnızca beslenme ihtiyacını"],e:"Hemşireler; her ortamda bireyin, ailenin ve toplumun hemşirelik girişimleri ile karşılanabilecek sağlıkla ilgili ihtiyaçlarını belirlemekle görevlidir."},
{q:"Hemşirelik tanılama süreci kapsamında hemşire ne yapar?",a:"Hemşirelik bakımını planlar, uygular, denetler ve değerlendirir",w:["Yalnızca ilaç verir","Yalnızca rapor yazar","Yalnızca hasta kaydı tutar"],e:"Hemşirelik tanılama süreci kapsamında belirlenen ihtiyaçlar çerçevesinde hemşirelik bakımını planlamak, uygulamak, denetlemek ve değerlendirmekle görevli ve yetkilidir."},
{q:"Hemşirenin mesleki sorumlulukları arasında hangisi yer alır?",a:"Mesleki uygulama standartlarının geliştirilmesine katkıda bulunmak",w:["Sağlık ekibinden kaçınmak","Bilgi ve beceriyi geliştirmemek","Araştırmalara katılmamak"],e:"Mesleki sorumluluklar: uygulamaların sorumluluğunu üstlenmek; standartları geliştirmek; bilgi-beceriyi geliştirmek; mesleğin onurunu yansıtmak; araştırmalara katılmak; mesleki örgütü güçlendirmek; ekiple iş birliği yapmak; öğrencilere ortam hazırlamak."},
{q:"Hemşire neden mesleki örgütlenmeye katkıda bulunmalıdır?",a:"Çalışma yaşamı, sosyal ve ekonomik koşulların geliştirilmesi için",w:["Yalnızca maaş için","Yalnızca unvan için","Yalnızca tatil için"],e:"Mesleki örgütlenmenin güçlendirilmesine ve mesleki örgütü aracılığıyla hemşirelerin çalışma yaşamı, sosyal ve ekonomik koşullarının geliştirilmesine katkıda bulunur."},
{q:"Hemşire öğrencilere karşı sorumluluğu nedir?",a:"Uygun öğrenme ortamlarının hazırlanması ve desteklenmesi",w:["Yalnızca not vermek","Yalnızca ders anlatmak","Yalnızca sınav yapmak"],e:"Hemşirelik öğrencilerine uygun öğrenme ortamlarının hazırlanması ve desteklenmesinde sorumluluk üstlenir."},
{q:"Çağdaş hemşirelik rolleri neyi gösterir?",a:"Hemşireliğin sadece hasta bakımıyla sınırlı olmadığını",w:["Hemşireliğin yalnızca hastanede yapıldığını","Hemşireliğin yalnızca ilaç verdiğini","Hemşireliğin yalnızca doktora yardım ettiğini"],e:"Çağdaş hemşirelik rolleri, hemşireliğin sadece hasta bakımıyla sınırlı olmadığını, toplum sağlığından araştırmaya, eğitimden liderliğe kadar geniş bir yelpazede görevler üstlendiğini gösterir."},
{q:"Bakım rolü nedir?",a:"Hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak",w:["Hastaları eğitmek","Araştırma yapmak","Ekip yönetmek"],e:"Bakım rolü (Caregiver): hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak, güvenli ve etkili bakım sunmak."},
{q:"Eğitici rol nedir?",a:"Hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek",w:["İlaç uygulamak","Araştırma yapmak","Ekip yönetmek"],e:"Öğretici/Eğitici rol: hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek."},
{q:"Danışman/rehber rol nedir?",a:"Bireyleri sağlık kararlarında yönlendirmek ve haklarını korumak",w:["İlaç uygulamak","Yara bakımı yapmak","Vital bulguları izlemek"],e:"Danışman/Rehber rol: bireyleri, aileleri veya toplumu sağlık kararlarında yönlendirmek; haklarını korumak."},
{q:"Araştırmacı rol nedir?",a:"Hemşirelik uygulamalarını geliştirmek için araştırma yapmak",w:["İlaç uygulamak","Hasta eğitimi vermek","Ekip yönetmek"],e:"Araştırmacı/Bilimsel rol: hemşirelik uygulamalarını geliştirmek için araştırma yapmak, veri toplamak ve analiz etmek."},
{q:"Yönetici/lider rol nedir?",a:"Hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak",w:["İlaç uygulamak","Araştırma yapmak","Hasta eğitimi vermek"],e:"Yönetici/Lider rol: hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak."},
{q:"Toplum sağlığı hemşiresi rolü nedir?",a:"Bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek",w:["Yalnızca hastane bakımı","Yalnızca ilaç uygulama","Yalnızca araştırma"],e:"Toplum sağlığı hemşiresi: bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek. Aşı kampanyaları, sağlık taramaları, eğitim programları düzenlemek."},
{q:"Liderlik ve politik rol nedir?",a:"Sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek",w:["İlaç uygulamak","Yara bakımı yapmak","Hasta eğitimi vermek"],e:"Liderlik ve Politik rol: sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek."},
{q:"Kuramın bileşenlerinden 'ilişkisel açıklamalar' neyi yapar?",a:"Kavramları ve alt değişkenleri açıklar, kavramların ilişkilerini ölçer",w:["Kavramları sınıflandırır","Ölçülmesini sağlar","Gereksiz kavramları içerir"],e:"İlişkisel açıklamalar/ifadeler: kuramsal ifadeler, işlevsel ifadeler. Kavramları ve alt değişkenleri açıklar, kavramların ilişkilerini ölçer."},
{q:"Kuramın bileşenlerinden 'bağlantılar ve düzenleme' neyi yapar?",a:"Kuramsal açıklamaların somutlaşmasını sağlar, değişkenlerin nasıl ölçüldüğünü gösterir",w:["Kavramları sınıflandırır","Yalnızca tanım yapar","Yalnızca ölçer"],e:"Bağlantılar ve düzenleme: kuramsal açıklamaların somutlaşmasını sağlar; değişkenlerin nasıl ölçüldüğünü gösterir; gereksiz kavramları içermez; tutarsızlıkları ortadan kaldırır."},
{q:"Bir kuramın kabul edilebilmesi için ne gerekir?",a:"Kavramlar, tanımlar, açıklamalar, bağlantılar net olmalı ve önerme/hipotezlerle örüntülenmeli",w:["Yalnızca tek bir kavram içermeli","Yalnızca sözlü olmalı","Yalnızca tek bir bilim insanı tarafından oluşturulmalı"],e:"Bir kuramın tam olarak kabul edilebilmesi için kavramları, tanımları, açıklamaları, bağlantıları ve bunlar arasındaki ilişkiyi net olarak açıklaması; önerme ve hipotezlerle örüntülenmiş olması gerekir."},
{q:"Grand kuramın özelliği nedir?",a:"Kapsam olarak çok büyük ve karmaşıktır",w:["Kapsamı sınırlıdır","Uygulamaya doğrudan temel olur","Yalnızca tanılamada yol gösterir"],e:"Grand kuram: kapsam olarak çok büyük ve karmaşıktır. İleri düzey araştırmaları gerektirir. Özellikle hemşirelik uygulamalarına temel olmaz."},
{q:"Orta ölçekli kuramların özelliği nedir?",a:"Kapsamı sınırlıdır ve bir fenomenin uygulamaya nasıl aktarılacağını gösterir",w:["Çok büyük ve karmaşıktır","Doğrudan uygulamaya temel olmaz","Yalnızca teoriktir"],e:"Orta ölçekli kuramlar: kapsam ve soyut kavramlar açısından daha sınırlıdır. Belli bir fenomenin uygulamaya nasıl aktarılacağını gösterir."},
{q:"Betimleyici/açıklayıcı kuramların özelliği nedir?",a:"Kuram gelişim sürecinin ilk basamağıdır",w:["Sonuçları önceden tahmin eder","Çok büyük ve karmaşıktır","Uygulamaya doğrudan temel olur"],e:"Betimleyici/açıklayıcı kuramlar: kuram gelişim sürecinin ilk basamağıdır. Fenomenin oluşturulma nedenini ve sonuçlarını tanımlar, yorumlar."},
{q:"Öngörü kuramlarının özelliği nedir?",a:"Bir fenomenin sonuçlarını önceden tahmin eder",w:["Kuram gelişiminin ilk basamağıdır","Çok büyük ve karmaşıktır","Yalnızca tanılamada yol gösterir"],e:"Öngörü kuramları: bir fenomenin veya hemşirelik uygulamalarının sonuçlarını önceden tahmin eder ve belirler. Hemşirelik uygulamalarının araştırmalarla test edilmesini sağlar."},
{q:"Hemşirelikte kuramsal çalışma türlerinden 'felsefeler' neyi sağlar?",a:"Mantıksal tartışmalar veya görüşmeler analizler süresince hemşirelik fenomeninin anlaşılmasını",w:["Uygulamaya doğrudan temel olmayı","Ölçüm yapmayı","Test etmeyi"],e:"Felsefeler: mantıksal tartışmalar veya görüşmeler analizler süresince hemşirelik fenomeninin anlaşılmasını sağlar."},

function getRank(xp){let r=RANKS[0];for(const k of RANKS)if(xp>=k.xp)r=k;return r}
function nextRank(xp){for(const k of RANKS)if(xp<k.xp)return k;return null}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function addXP(n){STATE.xp+=n;if(STATE.user)saveUser()}
function checkBadges(){for(const b of BADGES){if(!STATE.badges.includes(b.n)&&b.c(STATE)){STATE.badges.push(b.n);toast(`🏅 Rozet kazandın: ${b.n}!`)}}}
function showCombo(n){if(n<2)return;const d=document.createElement('div');d.className='combo';d.textContent=`${n}x KOMBO!`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

async function saveUser(){
if(!fbReady||!STATE.user)return;
try{
  await db.collection('ogrenciler').doc(STATE.user.no).set({
    ad:STATE.user.ad,soyad:STATE.user.soyad,no:STATE.user.no,
    xp:STATE.xp,correct:STATE.correct,wrong:STATE.wrong,maxCombo:STATE.maxCombo,
    badges:STATE.badges,unlocked:STATE.unlocked,stars:STATE.stars,
    lastUpdate:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}catch(e){console.warn("Kayıt hatası:",e)}
}

}

function toggleAdminLogin(){const e=$('#adminLogin');if(e)e.classList.toggle('hidden')}

async function doLogin(){
const no=$('#loginNo').value.trim();
const pass=$('#loginPass').value.trim();
if(!no||!pass){toast('Lütfen tüm alanları doldurun');return}
STATE.loading=true;renderAuth();
if(!fbReady){toast('Firebase bağlantısı yok');STATE.loading=false;renderAuth();return}
try{
  const doc=await db.collection('ogrenciler').doc(no).get();
  if(!doc.exists){toast('Öğrenci bulunamadı. Kayıt olun.');STATE.loading=false;renderAuth();return}
  const data=doc.data();
  if(data.pass!==pass){toast('Şifre yanlış!');STATE.loading=false;renderAuth();return}
  STATE.user={ad:data.ad,soyad:data.soyad,no:data.no};
  STATE.xp=data.xp||0;STATE.correct=data.correct||0;STATE.wrong=data.wrong||0;
  STATE.maxCombo=data.maxCombo||0;STATE.badges=data.badges||[];STATE.unlocked=data.unlocked||1;
  STATE.stars=data.stars||{};
  STATE.loading=false;
  toast(`Hoş geldin ${data.ad}!`);
  renderMenu();
}catch(e){console.error(e);toast('Giriş hatası');STATE.loading=false;renderAuth()}
}

function doAdminLogin(){
const u=$('#adminUser').value.trim();
const p=$('#adminPass').value.trim();
if(u===ADMIN_USER&&p===ADMIN_PASS){
  STATE.isAdmin=true;STATE.user={ad:"Akademisyen",soyad:"",no:"admin"};
  toast('Hoş geldin Akademisyen!');
  renderAdminPanel();
}else{toast('Kullanıcı adı veya şifre yanlış!')}
}

async function doRegister(){
const ad=$('#regAd').value.trim();
const soyad=$('#regSoyad').value.trim();
const no=$('#regNo').value.trim();
const pass=$('#regPass').value.trim();
const pass2=$('#regPass2').value.trim();
if(!ad||!soyad||!no||!pass){toast('Tüm alanları doldurun');return}
if(pass.length<4){toast('Şifre en az 4 karakter olmalı');return}
if(pass!==pass2){toast('Şifreler uyuşmuyor');return}
if(!fbReady){toast('Firebase bağlantısı yok');return}
STATE.loading=true;renderAuth();
try{
  const exists=await checkStudentExists(no);
  if(exists){toast('Bu numara zaten kayıtlı!');STATE.loading=false;renderAuth();return}
  await db.collection('ogrenciler').doc(no).set({
    ad,soyad,no,pass,xp:0,correct:0,wrong:0,maxCombo:0,badges:[],unlocked:1,stars:{},
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  STATE.user={ad,soyad,no};
  STATE.xp=0;STATE.correct=0;STATE.wrong=0;STATE.maxCombo=0;STATE.badges=[];STATE.unlocked=1;STATE.stars={};
  STATE.loading=false;
  toast(`Kayıt başarılı! Hoş geldin ${ad}`);
  renderMenu();
}catch(e){console.error(e);toast('Kayıt hatası: '+e.message);STATE.loading=false;renderAuth()}
}

async function loadLeaderboardInto(sel){
const el=$(sel);if(!el)return;
const data=await loadLeaderboard();
if(!data.length){el.innerHTML='<p class="sub">Henüz skor yok. İlk sen ol!</p>';return}
el.innerHTML=data.map((d,i)=>{
const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
const me=STATE.user&&STATE.user.no===d.no?'me':'';
return `<div class="lb-row ${me}">
<div class="lb-rank">${medal}</div>
<div class="lb-name">${d.ad} ${d.soyad}<div class="lb-sub">No: ${d.no} • ${d.correct||0} doğru • ${d.maxCombo||0} kombo</div></div>
<div class="lb-score">${d.xp||0} XP</div>
</div>`}).join('');
}

function startLevel(idx){
STATE.level=idx;STATE.qi=0;STATE.hp=5;STATE.combo=0;STATE.correct=0;STATE.wrong=0;STATE.streak=0;STATE.used5050=false;STATE.usedHint=false;STATE.review=[];
const topic=SLIDES[idx].t;
let pool=QUESTIONS.filter(q=>q.e.toLowerCase().includes(topic.toLowerCase().split(' ')[0])||q.q.toLowerCase().includes(topic.toLowerCase().split(' ')[0]));
if(pool.length<5)pool=shuffle(QUESTIONS).slice(0,10);
levelQuestions=shuffle(pool).slice(0,10);
showQuestion();
}

function showQuestion(){
if(STATE.qi>=levelQuestions.length){levelComplete();return}
const q=levelQuestions[STATE.qi];
const opts=shuffle([{t:q.a,ok:true},...q.w.map(w=>({t:w,ok:false}))]);
STATE.currentOpts=opts;STATE.answered=false;
const hp=STATE.hp;const pct=(STATE.qi/levelQuestions.length)*100;
$('#app').innerHTML=`
<div class="top">
<span class="pill gold">⭐ ${STATE.xp} XP</span>
<span class="pill hp">${'❤️'.repeat(Math.max(0,hp))}${'🖤'.repeat(Math.max(0,5-hp))}</span>
<span class="pill">${STATE.combo>1?'🔥 '+STATE.combo+'x':''}</span>
</div>
<div class="pg"><i style="width:${pct}%"></i></div>
<div class="card">
<h2>Soru ${STATE.qi+1}/${levelQuestions.length}</h2>
<p style="font-size:1.05rem;font-weight:600;margin-bottom:14px">${q.q}</p>
<div id="opts">${opts.map((o,i)=>`<button class="op" onclick="pick(${i})">${o.t}</button>`).join('')}</div>
<div class="helper">
<button onclick="use5050()" ${STATE.used5050?'disabled':''}>✂️ 50/50</button>
<button onclick="useHint()" ${STATE.usedHint?'disabled':''}>💡 İpucu</button>
</div>
<div id="fb"></div>
</div>`;
}

function pick(i){
if(STATE.answered)return;STATE.answered=true;
const q=levelQuestions[STATE.qi];const o=STATE.currentOpts[i];
document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(STATE.currentOpts[j].ok)b.classList.add('g');else if(j===i)b.classList.add('r')});
let fb='';
if(o.ok){
STATE.correct++;STATE.combo++;STATE.streak++;
if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;
const bonus=Math.min(STATE.combo,5)*2;const xp=10+bonus;addXP(xp);showCombo(STATE.combo);
fb=`<p><b>✅ Doğru!</b> +${xp} XP ${bonus>0?`(kombo +${bonus})`:''}</p>`;
}else{
STATE.wrong++;STATE.combo=0;STATE.streak=0;STATE.hp--;
STATE.review.push({q:q.q,correct:q.a,chosen:o.t,e:q.e});
fb=`<p><b>❌ Yanlış!</b> Doğru cevap: <b>${q.a}</b></p>`;
}
fb+=`<div class="ex">📖 ${q.e}</div>`;
checkBadges();
const last=STATE.qi+1>=levelQuestions.length;const dead=STATE.hp<=0;
fb+=`<button class="btn" onclick="${dead?'gameOver()':last?'levelComplete()':'nextQ()'}">${dead?'Canın bitti…':last?'Seviyeyi Bitir 🏁':'Sonraki ▶'}</button>`;
$('#fb').innerHTML=fb;
document.querySelector('.top').innerHTML=`<span class="pill gold">⭐ ${STATE.xp} XP</span><span class="pill hp">${'❤️'.repeat(Math.max(0,STATE.hp))}${'🖤'.repeat(Math.max(0,5-STATE.hp))}</span><span class="pill">${STATE.combo>1?'🔥 '+STATE.combo+'x':''}</span>`;
}

function nextQ(){STATE.qi++;showQuestion()}
function use5050(){if(STATE.used5050)return;STATE.used5050=true;const wrong=[...document.querySelectorAll('.op')].map((b,i)=>({b,i})).filter(x=>!STATE.currentOpts[x.i].ok);shuffle(wrong).slice(0,Math.max(0,wrong.length-1)).forEach(x=>{x.b.disabled=true;x.b.style.opacity='.3'});toast('✂️ 50/50 kullanıldı!')}
function useHint(){if(STATE.usedHint)return;STATE.usedHint=true;const q=levelQuestions[STATE.qi];toast('💡 '+q.e.slice(0,80)+'…')}

function gameOver(){
STATE.mode="gameover";
$('#app').innerHTML=`
<div class="top"><span class="pill gold">⭐ ${STATE.xp} XP</span></div>
<div class="card center">
<div class="big">💔</div>
<h2>Canların Bitti!</h2>
<p class="sub">${STATE.correct} doğru, ${STATE.wrong} yanlış yaptın.</p>
<button class="btn" onclick="startLevel(${STATE.level})">Tekrar Dene 🔁</button><br><br>
<button class="btn sec" onclick="renderMenu()">🏠 Menüye Dön</button>
</div>
${STATE.review.length?`<div class="card"><h2>📝 Yanlışlarını Gözden Geçir</h2>${STATE.review.map(r=>`<div class="review-item"><b>${r.q}</b><br>Senin cevabın: <span style="color:var(--no)">${r.chosen}</span><br>Doğru: <span style="color:var(--ok)">${r.correct}</span></div>`).join('')}</div>`:''}`;
}

function levelComplete(){
STATE.mode="complete";
const stars=STATE.hp>=5?3:STATE.hp>=3?2:1;
if(!STATE.stars[STATE.level]||STATE.stars[STATE.level]<stars)STATE.stars[STATE.level]=stars;
if(STATE.level+1>=STATE.unlocked&&STATE.level+1<SLIDES.length)STATE.unlocked=STATE.level+1;
const bonus=stars*20+STATE.hp*5;addXP(bonus);checkBadges();
$('#app').innerHTML=`
<div class="top"><span class="pill gold">⭐ ${STATE.xp} XP</span></div>
<div class="card center">
<div class="big">${stars===3?'🏆':'🎉'}</div>
<h2>Seviye Tamamlandı!</h2>
<p style="font-size:1.5rem">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
<p class="sub">${STATE.correct} doğru • ${STATE.wrong} yanlış • Kalan can: ${STATE.hp}</p>
<p><b>Bonus: +${bonus} XP</b></p>
<button class="btn" onclick="renderMenu()">🏠 Menüye Dön</button><br><br>
<button class="btn sec" onclick="startLevel(${STATE.level})">Tekrar Oyna 🔁</button>
</div>
${STATE.review.length?`<div class="card"><h2>📝 Yanlışlarını Gözden Geçir</h2>${STATE.review.map(r=>`<div class="review-item"><b>${r.q}</b><br>Senin cevabın: <span style="color:var(--no)">${r.chosen}</span><br>Doğru: <span style="color:var(--ok)">${r.correct}</span></div>`).join('')}</div>`:''}`;
}

// ==================== BOSS ====================
function startBoss(){
STATE.mode="boss";STATE.qi=0;STATE.hp=5;STATE.combo=0;STATE.correct=0;STATE.wrong=0;STATE.bossHp=100;STATE.bossMaxHp=100;STATE.review=[];
levelQuestions=shuffle(QUESTIONS).slice(0,20);
showBossQuestion();
}

function showBossQuestion(){
if(STATE.qi>=levelQuestions.length||STATE.bossHp<=0){bossEnd();return}
const q=levelQuestions[STATE.qi];
const opts=shuffle([{t:q.a,ok:true},...q.w.map(w=>({t:w,ok:false}))]);
STATE.currentOpts=opts;STATE.answered=false;
$('#app').innerHTML=`
<div class="top">
<span class="pill gold">⭐ ${STATE.xp} XP</span>
<span class="pill hp">${'❤️'.repeat(Math.max(0,STATE.hp))}${'🖤'.repeat(Math.max(0,5-STATE.hp))}</span>
<span class="pill">${STATE.combo>1?'🔥 '+STATE.combo+'x':''}</span>
</div>
<div class="card boss">
<h2>🐉 Boss Savaşı – Soru ${STATE.qi+1}/${levelQuestions.length}</h2>
<div class="boss-hp"><i style="width:${STATE.bossHp/STATE.bossMaxHp*100}%"></i></div>
<p class="center" style="font-size:.85rem;color:var(--mu)">Boss Canı: ${STATE.bossHp}/${STATE.bossMaxHp}</p>
<p style="font-size:1.05rem;font-weight:600;margin:14px 0">${q.q}</p>
<div id="opts">${opts.map((o,i)=>`<button class="op" onclick="bossPick(${i})">${o.t}</button>`).join('')}</div>
<div id="fb"></div>
</div>`;
}

function bossPick(i){
if(STATE.answered)return;STATE.answered=true;
const q=levelQuestions[STATE.qi];const o=STATE.currentOpts[i];
document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(STATE.currentOpts[j].ok)b.classList.add('g');else if(j===i)b.classList.add('r')});
let fb='';
if(o.ok){
STATE.correct++;STATE.combo++;if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;
const dmg=10+Math.min(STATE.combo,5)*2;STATE.bossHp=Math.max(0,STATE.bossHp-dmg);addXP(15);showCombo(STATE.combo);
fb=`<p><b>⚔️ Vuruş!</b> Boss'a ${dmg} hasar! +15 XP</p>`;
}else{
STATE.wrong++;STATE.combo=0;STATE.hp--;
STATE.review.push({q:q.q,correct:q.a,chosen:o.t,e:q.e});
fb=`<p><b>💥 Boss sana vurdu!</b> Doğru cevap: <b>${q.a}</b></p>`;
}
fb+=`<div class="ex">📖 ${q.e}</div>`;
checkBadges();
const last=STATE.qi+1>=levelQuestions.length||STATE.bossHp<=0||STATE.hp<=0;
fb+=`<button class="btn" onclick="${STATE.hp<=0?'gameOver()':last?'bossEnd()':'nextBoss()'}">${STATE.hp<=0?'Yenildin…':STATE.bossHp<=0?'Boss Yenildi! 🎉':last?'Bitir':'Sonraki ▶'}</button>`;
$('#fb').innerHTML=fb;
}

function nextBoss(){STATE.qi++;showBossQuestion()}

function bossEnd(){
STATE.mode="bossend";
const won=STATE.bossHp<=0;
if(won){addXP(100);toast('🏆 Boss yenildi! +100 XP')}
checkBadges();
$('#app').innerHTML=`
<div class="top"><span class="pill gold">⭐ ${STATE.xp} XP</span></div>
<div class="card center">
<div class="big">${won?'🏆':'💀'}</div>
<h2>${won?'Boss Yenildi!':'Boss Savaşı Bitti'}</h2>
<p class="sub">${STATE.correct} doğru • ${STATE.wrong} yanlış</p>
${won?'<p><b>+100 XP Bonus!</b></p>':''}
<button class="btn" onclick="renderMenu()">🏠 Menüye Dön</button>
</div>`;
}

// ==================== AKADEMİSYEN PANELİ ====================
async function renderAdminPanel(){
STATE.mode="admin";
$('#app').innerHTML=`
<div class="top">
<span class="pill gold">🔐 Akademisyen Paneli</span>
<button class="btn small sec" onclick="logout()">Çıkış</button>
</div>
<div class="card">
<h1>📊 Öğrenci Yönetim Paneli</h1>
<p class="sub">Tüm öğrencileri görüntüle, skorları incele, öğrenci sil.</p>
<div class="stat-grid">
<div class="stat"><div class="val" id="totalStudents">—</div><div class="lbl">Toplam Öğrenci</div></div>
<div class="stat"><div class="val" id="avgXP">—</div><div class="lbl">Ortalama XP</div></div>
<div class="stat"><div class="val" id="maxXP">—</div><div class="lbl">En Yüksek XP</div></div>
<div class="stat"><div class="val" id="totalAttempts">—</div><div class="lbl">Toplam Soru</div></div>
</div>
<button class="btn" onclick="loadAdminData()">🔄 Verileri Yenile</button>
</div>
<div class="card">
<h2>👥 Öğrenci Listesi</h2>
<div id="studentList"><p class="sub">Yükleniyor…</p></div>
</div>`;
loadAdminData();
}

async function loadAdminData(){
const students=await loadAllStudents();
const total=students.length;
const avgXP=total?Math.round(students.reduce((s,x)=>s+(x.xp||0),0)/total):0;
const maxXP=total?Math.max(...students.map(x=>x.xp||0)):0;
const totalAttempts=students.reduce((s,x)=>s+(x.correct||0)+(x.wrong||0),0);
const el1=$('#totalStudents');if(el1)el1.textContent=total;
const el2=$('#avgXP');if(el2)el2.textContent=avgXP;
const el3=$('#maxXP');if(el3)el3.textContent=maxXP;
const el4=$('#totalAttempts');if(el4)el4.textContent=totalAttempts;
const list=$('#studentList');if(!list)return;
if(!students.length){list.innerHTML='<p class="sub">Henüz öğrenci yok.</p>';return}
list.innerHTML=`
<table class="admin-table">
<thead><tr><th>#</th><th>Ad Soyad</th><th>No</th><th>XP</th><th>D/Y</th><th>Kombo</th><th>Rozet</th><th></th></tr></thead>
<tbody>
${students.map((s,i)=>`<tr>
<td>${i+1}</td>
<td>${s.ad} ${s.soyad}</td>
<td>${s.no}</td>
<td><b style="color:var(--pr)">${s.xp||0}</b></td>
<td>${s.correct||0}/${s.wrong||0}</td>
<td>${s.maxCombo||0}x</td>
<td>${(s.badges||[]).length}</td>
<td><button class="btn small danger" onclick="adminDelete('${s.no}')">Sil</button></td>
</tr>`).join('')}
</tbody></table>`;
}

async function adminDelete(no){
if(!confirm('Bu öğrenciyi silmek istediğinize emin misiniz?'))return;
await deleteStudent(no);
loadAdminData();
}

// ==================== BAŞLAT ====================
renderAuth();
</script></body></html>
