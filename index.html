// ---------- MODÜL 10: HAREKET GEREKSİNİMİ ----------
S(9,"Vücut Mekaniği ve Hareketlilik",`<p><strong>Vücut mekaniği:</strong> hareket ederken, eğilirken; ayakta durma, oturma ve yatma pozisyonlarında kas, iskelet ve sinir sistemlerinin düzenli birlikte çalışmasıdır.</p><p><strong>Neden önemli?</strong> Yaşlı nüfusun artışı, kronik hastalıklar, trafik kazaları ve yatağa bağımlı hastalara bakım veren personelin kendi sağlığını koruması. Yanlış hareketle oluşan sırt, bel ve eklem ağrıları yaygın, zor ve pahalı bir sağlık sorunudur; doğru vücut mekaniği <strong>hasta kadar hemşire için de</strong> önemlidir.</p><p><strong>Hareketlilik:</strong> bireyin amaca yönelik olarak çevrede yer değiştirebilmesi için kas gruplarının kasılıp gevşeme yeteneğidir. Hareket kas, eklem ve kemiğin işbirliğiyle sağlanır; koordinasyonu <strong>sinir sistemi</strong> yapar.</p><p>Kasılma sırasında kemikler üzerinde gerilim oluşur, kemikler de kaslara “<strong>yük</strong>” denen karşı güç uygular. <strong>Kasılma gücü yükü aşınca hareket oluşur.</strong></p>`);
S(9,"Kas Terimleri ve Hareket Terimleri",`<h3>Kas terimleri</h3>${UL(["<strong>Kas tonüsü:</strong> kasların dinlenirken sahip olduğu hafif, sürekli kasılma düzeyi (postür, denge).","<strong>Hipotoni:</strong> kullanılmama sonucu tonüsün azalması; belirti: gevşeklik, zayıf kas gücü, hipermobilite, bebekte “bez bebek” görünümü.","<strong>Hipertrofi:</strong> fazla çalışma sonucu kasın büyümesi (sporcu).","<strong>Kas atrofisi:</strong> hipotoninin uzamasıyla kas liflerinin kısalıp küçülmesi.","<strong>Atoni:</strong> kas tonüsünün kaybı."])}<h3>Hareket terimleri</h3>${UL(["<strong>Abduksiyon:</strong> orta çizgiden uzaklaşma (kolu yana açmak).","<strong>Adduksiyon:</strong> orta çizgiye yaklaşma.","<strong>Fleksiyon:</strong> eklemde bükülme, açının azalması (dirseği bükmek).","<strong>Ekstansiyon:</strong> açının artması, düzleşme (fleksiyonun tersi).","<strong>Sirkumdiksiyon:</strong> dairesel hareket; omuz ve kalça gibi çok yönlü eklemlerde."])}`);
S(9,"Denge ve Ağırlık Merkezi",`<p>Denge <strong>serebellum ve iç kulak</strong> aracılığıyla sinir sistemi tarafından sağlanır. Gereken kas gücü; ağırlık merkezinin yüksekliği ve dayanma yüzeyinin alanıyla ilişkilidir.</p><p><strong>Ağırlık merkezi:</strong> ayaktayken pelvis merkezinde, göbek ile simfisis pubis arasındadır. <strong>Çekül doğrultusu</strong> ağırlık merkezinden geçen dikey çizgi; <strong>dayanma yüzeyi</strong> cismin temas ederek durduğu yüzeydir.</p><h3>Dengenin üç kuralı</h3>${OL(["Ağırlık merkezi dayanma yüzeyine <strong>yakın</strong> olmalı.","Ağırlık çizgisi dayanma yüzeyinden <strong>geçmeli</strong>.","Dayanma yüzeyi <strong>geniş</strong> olmalı."])}<p>Dengeyi artırmak için <strong>ayaklar açılır</strong> ve sırt düz tutularak <strong>kalça-diz bükülür</strong>.</p>`);
S(9,"Genel Vücut Mekaniği İlkeleri",UL(["Ağırlık merkezi taban alanına yakın olmalı; <strong>dizler bükülerek</strong> eğilince yük büyük kas gruplarına dağılır, sırta az yük biner.","Kaldırırken kaldıraç gibi araçlar kullanılmalı.","<strong>Sürtünme azaltılmalı</strong>: yüzey dar, <strong>itme yerine çekme</strong>.","Hareket yerçekimine uygun: kaldırmak yerine yuvarlamak/döndürmek; düz zeminde hareket yokuştan kolaydır.","Yerden eşya alırken <strong>belden eğilmez</strong>, gövde dik, dizler bükülür.","Çok sayıda kas grubu birlikte çalıştırılır; <strong>yüz ve gövde hareket yönünde</strong> olmalı (omurga dönmesin).","Çok aşağıda/yukarıda bulunan cismi hareket ettirmek daha çok güç ister.","Taşınan yük kişinin vücut ağırlığının <strong>%35'inden</strong> ağırsa özel taşıma aracı kullanılır."]));
S(9,"Duruş Bozuklukları",`<p>Duruş bozukluğu nedenleri: kas gelişiminin zayıflığı, merkezi sinir sistemi yaralanmaları, kas-iskelet travmaları.</p>${UL(["<strong>Kifoz:</strong> sırt omurlarının dışa çıkıp kamburluk yapması.","<strong>Lordoz:</strong> bel omurlarında içe kıvrımın artması; gebelikte geçici fizyolojik lordoz görülebilir.","<strong>Skolyoz:</strong> omurganın sağa/sola “S” şeklini alması; omuzlar asimetrik.","<strong>Kunduracı göğsü:</strong> sternum içe çökük. <strong>Kuş göğsü:</strong> sternum dışa çıkık.","<strong>Ayak düşmesi:</strong> uzun süre ayağı desteklenmeyen hastada ayağın öne düşmesi.","<strong>Düz tabanlık:</strong> tarsal-metatarsal ligamentlerin gevşemesiyle ayak tabanının düşmesi.","<strong>Halluks valgus:</strong> başparmağın içe; <strong>halluks varus:</strong> dışa dönmesi.","<strong>Geni valgum:</strong> X bacak. <strong>Geni varum:</strong> O (parantez) bacak."])}`);
S(9,"Doğru Duruş, Oturuş, Yatış ve Taşıma",`<h3>Ayakta duruş</h3><p>Baş dik, omuzlar geride, kollar yanda, dizler hafif gergin, ayaklar karşıya bakar, tabanlar yere tam basar.</p><h3>Oturma</h3><p>Baş dik, omurga sandalye arkalığına temas eder, ayaklar yerde; <strong>50 dakikadan uzun</strong> aynı pozisyonda oturulmaz.</p><h3>Yatış</h3><p>Yatak düz, rahat ve destekleyici; omurga düz; yastık omuzlara kadar inmeli, boyun-bel kavisleri korunmalı; <strong>sert/ortopedik yatak</strong> tercih edilir, yer ve tahta uygun değildir; sırt üstüyken baldır altına küçük yastık konabilir.</p><h3>Taşıma</h3><p>Yük çok ağır olmamalı, kollarla aynı hizada ve vücuda yakın olmalı; <strong>bir ayak önde</strong>, diz kıvrık, vücut belden bükülmez; ağırlık hissedildikten ve doğrulduktan sonra yürünür.</p>`);
S(9,"Koruyucu Yatış Pozisyonları",`${UL(["<strong>Supine (sırt üstü):</strong> baş-boyun-omuz yastıkla desteklenir; üst kol/ön kol altına ince yastık; <strong>dizlerin altına küçük havlu rulo</strong>; ayaklar <strong>dorsal fleksiyonda</strong> (bilek 90°), tabanlar ayak tahtasıyla desteklenir; avuç içine küçük rulo.","<strong>Prone (yüzüstü):</strong> dinlendirici ve gevşetici; baş yana çevrilip altına <strong>küçük</strong> yastık; kollar başın iki yanında; kilolu hastada göğüs-karın arasına ince yastık; bacak altına yastık, <strong>ayak başparmakları yatağa değmez</strong>. Büyük yastık boyun lateral fleksiyonuna neden olur. Solunum güçlüğünde hemen yan/sırt üstü çevrilir.","<strong>Lateral (yan):</strong> sırtın çıkıntılı noktalarına (vertebra, skapula, koksiks) basıyı kaldırır; altta kalan kol avuç içi yukarı, <strong>radial nabız kontrol edilir</strong>; üst kol omuz hizasında yastıkta; alttaki bacak hafif bükülü, <strong>üstteki bacak 90° bükülüp yastıkla desteklenir</strong>.","<strong>Fowler:</strong> yatak başı <strong>45-60°</strong>; <strong>semi fowler 30°</strong>; <strong>dik (tam) fowler 90°</strong>; diz altı ve ayaklar desteklenir; felçli hastada kollar omuz seviyesinde yastıkta; bacakların dışa dönmesine karşı kalça kenarına rulo."])}`);
S(9,"Muayene ve Tedavi Edici Pozisyonlar",`<h3>Muayene pozisyonları</h3>${UL(["<strong>Sims (yarı yüzüstü):</strong> rektal, vajinal, kolon uygulamaları; üst bacak karna çekili, alt bacak serbest; alttaki kol arkada, üstteki önde.","<strong>Dorsal rekümbent:</strong> Foley kateter takılması ve vajinal ilaç; sırtüstü, bacaklar bükülü ve açık.","<strong>Knee-chest (diz-göğüs/secde):</strong> rektal ve uretral muayene; dizler 90°, göğüs yatağa temas, genital bölge yukarıda.","<strong>Litotomi:</strong> doğum ve vajinal muayene; sırtüstü, bacaklar askıda ve açık."])}<h3>Tedavi edici pozisyonlar</h3>${UL(["<strong>Ortopne:</strong> kalp-akciğer yetmezliği ve <strong>torasentez</strong> yapılacak hastalar; fowler + yemek masasına konan yastığa yaslanma.","<strong>Trendelenburg:</strong> <strong>postural drenaj</strong> (sekresyon çıkarma); ayaklar 30° yükseltilir, baş altından yastık alınır."])}`);
S(9,"Hastayı Yatakta Hareket Ettirme (Genel Hazırlık)",`<p>Her pozisyon değişiminde ortak basamaklar:</p>${OL(["Eller yıkanır, <strong>kimlik doğrulanır</strong>, işlem açıklanır, <strong>mahremiyet</strong> sağlanır.","<strong>Yatak frenleri</strong> kontrol edilir; yatak <strong>bel seviyesine</strong> getirilir; çalışılan taraftaki kenarlık indirilir.","Yatak düz konuma ya da hastanın tolere edebileceği düzeye indirilir; gerekirse tek kullanımlık eldiven.","Önce <strong>dren, serum, sonda</strong> bağlantılarının güvenliği kontrol edilir (mümkünse serum çıkarılır).","İşlem sonu: yastık/destekler, kenarlıklar kaldırılır, <strong>yatak en düşük seviyeye</strong> getirilir, eldiven çıkarılır, <strong>el hijyeni</strong>, hemşire gözlem formuna kayıt."])}<p><strong>Hemşirenin duruşu:</strong> yüz ve gövde hastaya dönük, bir ayak önde diğeri arkada, dizler bükük ve <strong>öndeki diz yatağa dayalı</strong>, bel bükülmez; vücut ağırlığı <strong>öndeki ayaktan arkadakine</strong> aktarılır (sürtünme azalır, uzun-güçlü kaslar kullanılır).</p>`);
S(9,"Yatak Kenarına Çekme ve Yukarı Çekme",`<h3>Yatak kenarına çekme</h3>${OL(["Hemşire başucuna yakın tarafta; hastanın <strong>kolları dirsek ve bilekten desteklenip göğüs üzerinde birleştirilir</strong> (sürtünme azalır).","Bir el boyun altından geçip <strong>uzak omuzu</strong> tutar, ön kol baş-boynu destekler; diğer kol <strong>kürek kemiği altına</strong> girer.","Gövde kendine doğru çekilir (ağırlık öndeki ayaktan arkaya).","Kalça hizasına geçilir: bir kol bel, diğeri <strong>kalça altından</strong> geçirilip kalça çekilir.","Son olarak kollar <strong>diz ve ayak bilekleri altından</strong> geçirilip bacaklar çekilir; omurga ve bacaklar düz olmalı.","<strong>3 hemşire</strong> varsa: en güçlü kalça hizasında, daha az güçlü baş, en az güçlü ayak hizasında; <strong>koordineli</strong> hareket."])}<h3>Yatakta yukarı çekme</h3><p>Hasta sırtüstü, yatağın baş kısmını tutar; hemşire bir elini omuz, diğerini kalça altına koyar; <strong>ortak komutla</strong> yukarı çekilir (çarşaf yardımıyla da yapılabilir).</p>`);
S(9,"Supine → Lateral / Prone / Sims",`<h3>Supine → Lateral</h3>${OL(["Hasta çevrileceği yönün <strong>tersi</strong> tarafa çekilir.","Başı döndürüleceği tarafın tersine çevrilir.","Döndürülecek taraftaki kol <strong>gövdeden uzakta</strong> (altında sıkışmasın), diğer kol göğüste.","Döndürülecek taraftaki bacak altta olacak şekilde <strong>bacaklar çaprazlanır</strong>.","Karşı tarafta durulur (önce kenarlık kaldırılır); <strong>uzak omuz ve kalçadan</strong> tutularak çevrilir.","Yastıklar: baş-boyun-omuz, sırt; alt kol avuç içi yukarı, üst kol avuç içi aşağı ve omuz hizasında yastıkta; alt bacak hafif geride ve düz, <strong>üst bacak fleksiyonda, kalça hizasında yastıkta</strong>; <strong>ayak tabanına 90° destek</strong>."])}<h3>Supine → Prone</h3><p>Yan çevrilir, sonra yüzüstü; <strong>bacaklar birleşik, kollar gövdeye yakın</strong>; baş yüz yastığa kapanmasın diye <strong>ters yöne</strong>; kollar başın iki yanında fleksiyonda; göğüs-karın arasına <strong>katlanmış ince havlu</strong>; bilekten dize yastık, ayak uçları yatağa değmez. <strong>Solunum güçlüğünde hemen yan/sırtüstü.</strong></p><h3>Supine → Sims</h3><p>Lateralden farkı: çevrilecek taraftaki kol <strong>dirsek düz, el kalçanın altında</strong>; kalça hafif geride; alttaki kolda <strong>radial nabız kontrolü</strong>.</p>`);
S(9,"Oturtma, Yataktan Sandalyeye, Yürütme, Sedye",`<h3>Yatak kenarında oturtma</h3>${OL(["Yatak başı dik oturana kadar yükseltilir.","Hemşire bel hizasında; bir kol hastanın kolu ve üst sırt altında, diğer kol <strong>bacakların üstünden</strong>.","Dizlerden kavranıp <strong>tek hareketle</strong> bacaklar sarkıtılır, gövde dikleştirilir.","<strong>Baş dönmesi</strong> gözlenir; sandalyeye almadan önce birkaç dakika oturtulur."])}<h3>Yataktan sandalyeye alma</h3>${OL(["Sandalye yatağa <strong>45°</strong>, frenler kilitli, ayaklık kalkık.","Hasta yatak kenarında oturtulup gözlenir; denge/baş dönmesi değerlendirilir; <strong>kaymayan terlik</strong> giydirilir.","Hemşire kalça-dizlerini büker, <strong>öndeki dizi hastanın dizlerine</strong> dayar.","Hasta koltuk altından kavranır, hastadan hemşirenin omuzlarını tutması istenir.","Koordineli hareketle sandalyeye geçilir, uygun oturma pozisyonu verilir."])}<h3>3 kişiyle sedyeye taşıma</h3><p>Sedye yatağın ayak ucuna <strong>dik açıyla</strong>, tekerlekler kilitli; <strong>en uzun kişi başucunda</strong> (baş-boyun-omuz ekseni korunur), ortadaki kalça altında, ayak ucundaki ayak bilekleri altında; boy sırasına göre.</p>`);
S(9,"Egzersiz Türleri (ROM)",`<p><strong>ROM (Range of Motion):</strong> eklem açıklığını sürdüren egzersizler. <strong>Aktif egzersizde</strong> hareketi bireyin kendisi yapar; <strong>pasif egzersizde</strong> eklem başkası veya araçla hareket ettirilir.</p>${UL(["<strong>İzotonik:</strong> kas kısalır, eklem oynar; kas gücü, hipertrofi, kemik yoğunluğu ve kardiyorespiratuvar işlev artar (squat, koşu, yüzme).","<strong>İzometrik:</strong> kas kasılır, <strong>uzunluk ve eklem değişmez</strong> (plank, duvar oturuşu, iki eli birbirine itme).","<strong>İzokinetik:</strong> kasın dirence karşı kasıldığı egzersiz (ayak bileğine ağırlık bağlayarak diz egzersizi)."])}<h3>Dikkat edilecekler</h3>${UL(["Egzersiz mümkün olduğunca <strong>aktif</strong> yaptırılır; <strong>kontraktürü</strong> önlemek için düzenli yapılır.","Önce birey ve eklemin hareket yeteneği değerlendirilir; hareketler <strong>yavaş, ağrısız</strong>, eklem zorlanmaz.","Hemşire ve hasta rahat pozisyonda olmalı; eklem <strong>alttan desteklenir</strong>."])}`);

S(10,"Yaşamsal Bulgulara Giriş",`<p>Sağlık durumunun önemli göstergeleri: <strong>vücut sıcaklığı, solunum, nabız ve kan basıncı</strong>. Normal değerlerinden sapma <strong>homeostazinin bozulmasına</strong> işaret eder.</p><h3>Neden alınır?</h3><p>Sağlık durumunu izlemek ve ortaya çıkan sorunları tanımlamak; bakım veren hemşirenin önemli sorumluluğudur.</p><h3>Dikkat edilecekler</h3>${UL(["Bakım veren hemşire alır; her bulgunun <strong>normal sınırı</strong> bilinir.","Bireyin <strong>temel verileri</strong> bilinir, önceki değerlerle karşılaştırılır.","Tanı, tedavi ve ilaçlar bilinir; düzenli aralıklarla ölçülür; çevresel koşullar kontrol edilir.","Araç-gereç (tansiyon aleti, termometre) doğru çalışıyor mu <strong>mutlaka</strong> kontrol edilir."])}<h3>Değerlendirme zamanları</h3><p>Hasta kabulünde, hekim istemi/klinik standartlarda, <strong>cerrahi ve invaziv girişim öncesi-sonrası</strong>, kalp-solunum-ısıyı etkileyen ilaç öncesi-sonrası, ani bozulmada (bilinç kaybı, ağrı artışı), hemşirelik girişimleri (mobilizasyon, ROM) öncesi, hasta farklılık bildirdiğinde.</p>`);
S(10,"Vücut Sıcaklığı ve Düzenlenmesi",`<p>Vücut sıcaklığı = <strong>ısı üretimi − ısı kaybı</strong>. İç sıcaklık (derin doku) <strong>37 °C</strong>; ortalamadan ±0,6-1 °C'den fazla sapmaz. Organizma <strong>35-43 °C</strong> arasında yaşayabilir.</p><h3>Isı üretimini artıranlar</h3><p>Bazal metabolizma, kas çalışması, tiroid hormonları, sempatik uyarı (epinefrin, norepinefrin).</p><h3>Isı kaybı yolları</h3>${UL(["<strong>Radyasyon (ışınım):</strong> temas olmadan yüzeyden yüzeye (ampül, lamba).","<strong>Kondüksiyon (iletim):</strong> doğrudan temasla (ılık/soğuk uygulama).","<strong>Konveksiyon:</strong> hava akımıyla (pencere açmak).","<strong>Evaporasyon:</strong> buharlaşmayla; 1 g su başına 0,58 kalori (ter)."])}<h3>Düzenleme: hipotalamus (“hipotalamik termostat”)</h3><p>Isı yükselince: <strong>vazodilatasyon, terleme, ısı üretiminin azalması</strong>. Isı düşünce: <strong>vazokonstrüksiyon, piloereksiyon, titreme ve tiroksin salınımıyla ısı üretiminin artması</strong>. Derinin görevi: yalıtım, ısı toplama-dağıtma, ısı duyusu.</p><p><strong>Etkileyenler:</strong> yaş, hormonlar (kadında dalgalanma), aktivite, stres, çevre; <strong>günlük döngü: 01-04 arası en düşük, 16-18 arası en yüksek</strong>.</p>`);
S(10,"Termometre Çeşitleri",`${UL(["<strong>Civalı cam:</strong> hazne, sütun, gövde (35-43 °C ölçeği). Dezavantaj: ölçüm uzun, nozokomiyal enfeksiyon taşır, dezenfeksiyon gerekir, kırılırsa çevreye zararlı. Kullanımdan önce-sonra sabunlu su + <strong>1/30'luk Savlon</strong> ile dezenfekte.","<strong>Tek kullanımlık:</strong> 50 noktalı alıcı matriks; matrikse dokunulmaz, serin (en fazla 30 °C) yerde saklanır. Avantaj: enfeksiyon yok, kırılmaz; dezavantaj: okuması güç, geç okunursa renk geri döner.","<strong>Elektronik (dijital):</strong> pilli, prob + gösterge, <strong>tek kullanımlık kılıf</strong>; 1-2 dk; oral, aksiller, rektal. Dezavantaj: pil çevreyi kirletir.","<strong>Kızılötesi timpanik membran:</strong> dış kulak yolu; <strong>1-2 sn</strong>; karotis kanı nedeniyle iç ısıyı yansıtır; dezenfeksiyon gerektirmez.","<strong>Kızılötesi temporal arter:</strong> temassız veya temaslı; 2 sn; invaziv değil, kılıf gerekmez, alkollü tamponla silinir."])}<h3>Cam termometre kırılırsa</h3><p>Civaya <strong>elle dokunma</strong> (temas ettiyse 15 dk yıka), alanı boşalt, eldiven-maske tak, civayı <strong>iğnesiz enjektörle</strong> çek, <strong>metal kapaksız</strong> kapta topla, <strong>süpürge kullanma</strong>, havalandır ama <strong>klimayı kapat</strong>.</p>`);
S(10,"Ölçüm Yolları ve Normal Değerler",`${UL(["<strong>Oral:</strong> dil altı sağ/sol boşluk, 5 dk. Bilinçsiz, bebek-çocuk, istemsiz kasılma, ağız solunumu/enfeksiyonu, sık öksürük durumlarında yapılmaz; sigara, sıcak/soğuk içecek, sakız sonrası <strong>20-30 dk</strong> beklenir.","<strong>Aksiller:</strong> en yaygın, çapraz enfeksiyon riski en az; terliyse <strong>ovmadan tamponla</strong> silinir; kol gövdede, ön kol göğüste. Enfeksiyonlu ve çok zayıflarda yapılmaz.","<strong>Rektal:</strong> oral/aksiller yapılamayanlarda; Sims pozisyonu, bebekte sırtüstü bacaklar yukarı; kayganlaştırıcı; ilerletme <strong>erişkin 3,8 cm, çocuk 2,5 cm, bebek 1,25 cm</strong>; direnç varsa durdurulur; eldiven şart. Rektum ameliyatı, diyare, hemoroid, perianal enfeksiyonda yapılmaz; vagal uyarıyla aritmi riski.","<strong>Timpanik:</strong> işitme cihazı çıkarılır, lens temiz olmalı, tek kullanımlık kılıf; <strong>erişkin ve 3 yaş üstü: kulak kepçesi yukarı-geriye</strong>, 2 ay-3 yaş arası <strong>aşağı-geriye</strong>. Kulak kiri, enfeksiyon, kafatası yaralanması, kulak ameliyatı sorun yaratır.","<strong>Temporal arter:</strong> alın açık, prob alın ortasında 2,5-5 cm; şakağa doğru kaydırılır, yüzün altına değil. Terli alın, kozmetik, şapka, hava akımı, duş/yüzme sonrası <strong>30 dk</strong> beklenir."])}<table class="tbl"><tr><th>Yol</th><th>Normal</th><th>Ortalama</th></tr><tr><td>Oral</td><td>36,5-37,5</td><td>37</td></tr><tr><td>Rektal</td><td>37-38</td><td>37,5</td></tr><tr><td>Aksiller</td><td>36-37</td><td>36,5</td></tr><tr><td>Timpanik</td><td>36,5-37,5</td><td>37</td></tr><tr><td>Temporal</td><td>36-37</td><td>36,5</td></tr></table>`);
S(10,"Ateş ve Hipotermi",`<p><strong>Ateş</strong> savunma mekanizmasıdır, hastalık değil belirtidir (enfeksiyon, ödem, doku hasarı, aşı). <strong>Rektal ≥38 °C</strong> ateştir.</p>${UL(["&lt;38,5 °C: hafif ateş","38,5-38,9 °C: orta ateş","≥39 °C: yüksek ateş","≥40-41,1 °C: <strong>hiperpireksi</strong> (acil, derhal düşürülmeli)"])}<p><strong>Hipotermi:</strong> vücut sıcaklığının normalin altında olması; kalp, akciğer, beyin gibi yaşamsal organların ısısı <strong>35 °C altına</strong> inince belirtiler başlar.</p>`);
S(10,"Solunumun Değerlendirilmesi",`<p>Solunum <strong>sayı, ritim ve derinlik</strong> açısından değerlendirilir. Erişkinde normal <strong>12-20/dk</strong>.</p><table class="tbl"><tr><th>Yaş</th><th>Solunum/dk</th></tr><tr><td>Yenidoğan</td><td>35-50</td></tr><tr><td>Bebek (6 ay)</td><td>30-40</td></tr><tr><td>Oyun çocuğu (2 yaş)</td><td>25-32</td></tr><tr><td>Çocuk</td><td>20-30</td></tr><tr><td>Yetişkin</td><td>12-20</td></tr><tr><td>İleri yaş</td><td>12-24</td></tr></table><p><strong>Etkenler:</strong> ateş (0,6 °C artış ≈ 4 solunum), egzersiz, ağrı-anksiyete, ilaçlar (morfin baskılar), anemi, kafa içi basınç artışı, sigara-alkol. Morfin derinliği azaltır; egzersiz ve korku artırır.</p><h3>Terimler</h3>${UL(["<strong>Eupne:</strong> normal, kolay solunum. <strong>Apne:</strong> geçici durma.","<strong>Taşipne:</strong> hız &gt;20/dk (düzenli). <strong>Bradipne:</strong> hız &lt;12/dk.","<strong>Hiperpne/Hipopne:</strong> derinlik artışı/azalışı. <strong>Hiperventilasyon/Hipoventilasyon:</strong> hız ve derinliğin birlikte artışı/azalışı.","<strong>Dispne:</strong> güç soluma, çaba var; ortopnede rahatlar. <strong>Hipoksi:</strong> doku oksijen yetersizliği. <strong>Siyanoz:</strong> deoksijene Hb ≥5 g/dl olunca cildin mavimsi rengi."])}<h3>Sayma</h3><p>Nabız sayımından hemen sonra, <strong>elini radyal arterden çekmeden</strong>, hasta fark etmeden (istemli kontrol etmesin); <strong>30 sn sayılıp ×2</strong>; anormallik varsa ve yenidoğan/çocukta <strong>tam 1 dk</strong>.</p>`);
S(10,"Nabız",`<p>Nabız, her sistolde aortaya atılan kanın arter duvarına yaptığı basıncın deride hissedilmesidir. Sinoatriyal nodülden dakikada 60-100 uyaran çıkar. <strong>Strok volüm</strong> (60-70 ml) × nabız = <strong>kardiyak output</strong>.</p><p>Nabız <strong>hız, ritim ve dolgunluk</strong> açısından değerlendirilir; erişkinde dinlenmede <strong>60-100/dk</strong>.</p><h3>Etkenler</h3>${UL(["Yaşla <strong>ters orantılı</strong>; kadında erkekten 7-8 atım fazla.","Aktivite, heyecan, ağrı, kanama (500 ml kayıp) artırır; ateş <strong>0,6 °C → 7-8 atım</strong>.","Digital nabzı azaltır; epinefrin artırır; uzun boylu-zayıflarda yavaş."])}<h3>Periferik nabız yerleri</h3><p>Temporal, karotis, brakial, radyal, femoral, popliteal, dorsalis pedis, posterior tibial. <strong>En çok kullanılan: radyal.</strong></p><h3>Radyal sayım</h3><p>İşaret-orta-yüzük parmak radyal arter üzerinde, <strong>başparmak bileğin üstünde</strong> (kendi nabzını hissetmemek için); <strong>30 sn ×2</strong>, anormalde 1 dk; aktiviteden sonra 10-15 dk dinlenme.</p><h3>Apikal nabız</h3><p>Steteskop + saat; fowler/semi fowler; <strong>sol midklaviküler hat ile 5-6. kosta arası</strong>, sternumdan ≈8 cm solda; steteskop avuçta ısıtılır; <strong>1 dk sayılır</strong>.</p><p><strong>Apikal-radyal birlikte (iki hemşire):</strong> aritmide. Radyal nabız apikalden düşükse fark <strong>defisit</strong>tir (zayıf atımlar perifere yansımaz).</p>`);
S(10,"Arteriyel Kan Basıncı",`<p>Ventriküllerden atılan kanın arter duvarına yaptığı basınç; <strong>mmHg</strong> ile ölçülür. <strong>Sistolik</strong> (ventrikül sistolü, maksimal) ve <strong>diyastolik</strong> basınç. Normal yetişkin <strong>120/80</strong>; geniş sınırlar 100-140 / 60-90.</p>${UL(["<strong>Hipotansiyon:</strong> sistolik 85-90 mmHg altı. <strong>Hipertansiyon:</strong> sistolik 140 mmHg üstü.","<strong>Nabız basıncı</strong> = sistolik − diyastolik; ortalama <strong>30-50 mmHg</strong>."])}<table class="tbl"><tr><th>Yaş</th><th>Ortalama KB</th></tr><tr><td>Yenidoğan</td><td>40/–</td></tr><tr><td>1 ay</td><td>85/54</td></tr><tr><td>1 yaş</td><td>95/65</td></tr><tr><td>6 yaş</td><td>105/65</td></tr><tr><td>10-13 yaş</td><td>110/65</td></tr><tr><td>14+ yaş</td><td>120/80</td></tr></table><p><strong>Etkenler:</strong> yaş, anksiyete-korku-ağrı (sempatik), cinsiyet, <strong>akşam sabaha göre 5-10 mmHg yüksek</strong>, <strong>yatarken daha yüksek</strong>, ilaçlar, egzersiz, dolu mesane, sıkı giysi (korse).</p>`);
S(10,"Tansiyon Aleti ve Ölçüm Teknikleri",`<p><strong>Sfigmomanometre:</strong> manometre (civalı, aneroid, elektronik) + basınç manşonu/manşet. Erişkin manşon <strong>12×23 cm</strong>; manşon boyutu kol çapına uymalı: <strong>dar manşet yüksek</strong>, geniş manşet düşük değer verir. Puvar + hava ayar düğmesi; steteskop.</p>${UL(["Civalı manometre dik olmalı, boşken <strong>sıfırda</strong>, hava deliği açık; göz düzleminde ve ≤1 m uzakta.","<strong>Brakial arter</strong> sık kullanılır. <strong>Ölçülmeyecek kol:</strong> IV sıvı, hemodiyaliz şantı, koltuk altı travma, <strong>mastektomi</strong>. Bu durumda <strong>popliteal arter</strong> (yüzüstü, sistolik 10-40 mmHg daha yüksek).","İki kol farkı en fazla <strong>10 (15) mmHg</strong>; sağ kol 5-10 mmHg yüksek olabilir."])}<h3>Oskültasyon ve Korotkoff</h3><p>İlk ses (<strong>Evre I</strong>) = <strong>sistolik</strong>; sesin tamamen kesildiği an (<strong>Evre V</strong>) = <strong>diyastolik</strong>. Evre II hışırtı, III daha kuvvetli, IV boğuklaşma. Girdaplı kan akımı titreşim yapar.</p><h3>Palpasyon tekniği</h3><p>Zayıf nabızlı (şiddetli kanama, zayıf miyokard) hastada; radyal nabız kaybolana dek şişir, <strong>nabız tekrar hissedilince</strong> değer sistoliktir. Hipertansiyonlu veya KB bilinmeyen hastada <strong>iki teknik birlikte</strong> kullanılır.</p>`);
S(10,"Kan Basıncı Ölçüm Basamakları ve Hatalar",`${OL(["El yıka; ağrı, aktivite (egzersiz/sigara sonrası 10-15 dk dinlenme) sorgula; işlemi anlat.","Oturt/yatır, <strong>5 dk dinlendir</strong>; kol kalp düzeyinde, alttan destekli, avuç içi yukarı. (Dirsek kalp seviyesinden her 10 cm farkta KB 8-10 mmHg değişir.)","Kolu sıkan giysi çıkarılır; uygun manşet; manometre sıfır kontrolü.","Brakial arter palpe edilir; manşon ortası arterin üzerinde, manşet <strong>2,5 cm (dirsekten ~3 cm) yukarıda</strong>, manşon boşken sarılır.","Hava ayar düğmesi kapatılır; radyal nabız kaybolana dek şişirilir, <strong>+30 mmHg</strong> hesaplanır; havası boşaltılır, <strong>30-60 sn beklenir</strong>.","Steteskop alıcısı brakial arter üzerinde (manşetin altında <strong>değil</strong>); hedef basınca şişirilir; <strong>2-3 mmHg/sn</strong> boşaltılır.","İlk Korotkoff = sistolik; kaybolma = diyastolik; manşet hızla boşaltılır. Tekrar için <strong>30-60 sn bekle</strong>."])}<h3>Hatalar → sonuç</h3><p><strong>Yanlış yüksek:</strong> manşetin hastaya göre dar olması, çok gevşek sarılması, manometre sıfırının ayarlanmamış olması, egzersiz sonrası ölçüm, bacak bacak üstüne atma, kolun desteksiz olması, yumruk yapma, konuşma, kıyafet üzerine sarma, ayakta ölçüm.<br><strong>Yanlış düşük:</strong> ölçüm yapanın işitme sorunu, steteskop kulaklığının yanlış takılması, çevre gürültüsü, bağlantı borularının çatlak/dolanık olması, oskültasyon sırasında manşonun yeniden şişirilmesi.</p>`);

S(11,"Tıbbi Asepsiye Uygun El Yıkama",`<p><strong>Amaç:</strong> ellerdeki kalıcı ve geçici flora mikroorganizma sayısını azaltmak; sağlık çalışanından hastaya bulaşı engellemek. <strong>Malzeme:</strong> sabun, kâğıt havlu, nemlendirici/krem.</p>${OL(["Lavabo önünde, <strong>üniforma lavaboya değmeyecek</strong> şekilde durulur; <strong>takılar çıkarılır</strong>.","Musluk <strong>kâğıt havluyla</strong> açılır, su <strong>ılık</strong> ayarlanır (havlu yoksa musluk vidası elle açılır).","Eller ve bilekler ıslatılır; <strong>eller dirsek düzeyinin altında</strong> tutulur.","Kalıp sabun veya <strong>4 ml sıvı sabun</strong> alınıp köpürtülür; kalıp sabunun köpüğü çalkalanarak sabunluğa bırakılır.","Tırnak araları varsa <strong>fırça</strong> ile temizlenir.","El ayası, elin üstü, her parmak, parmak araları ve eklemler <strong>dairesel hareketlerle</strong> ovulur; <strong>önce eller</strong> temizlenir (kirliyi temiz bileğe sıçratmamak için).","Eller çalkalanır; sonra bilek ve ön kol ovulup çalkalanır. <strong>Eller aşağıya tutulur</strong>, su akıtılır. Ovma <strong>10-30 sn</strong> (gerekirse 1-4 dk).","Kâğıt havluyla <strong>önce eller</strong> kurulanır (en temiz bölge), musluk kâğıt havluyla kapatılır; eller <strong>bel üstünde</strong> tutulur.","Kâğıt havlu yoksa eller sabunluyken musluk vidası sabunlanıp avuçtaki suyla durulanır.","Gerekirse krem/nemlendirici sürülür."])}`);
S(11,"Steril Eldiven Giyme ve Çıkarma",`<p><strong>Amaç:</strong> steril alanı korumak ve sterilitenin sürdürülmesi.</p>${OL(["Yüzükler çıkarılır, eller yıkanıp kurulanır; <strong>uygun numara</strong> eldiven seçilir.","Paket <strong>delik/ıslak olmamalı, son kullanma tarihi geçmemeli</strong>.","Dış paket açılır, iç paket <strong>bel düzeyi üstünde kuru-temiz masaya</strong> konur; konçlar hemşireye yakın.","İç paket kitap gibi açılır; paketin iç yüzüne ve eldivenlere dokunulmaz.","<strong>Önce dominant olmayan ele</strong>, sonra dominant ele giyilir.","Sağ elin başparmağı ve ilk iki parmağıyla sol eldivenin <strong>bükülmüş koncundan</strong> tutulur; el düz hat boyunca sokulur; konç bırakılır.","Eldivenli elin başparmağı açılır, <strong>dört parmak eldivenin bükülmüş konç içine</strong> sokulup diğer ele giydirilir.","Parmak araları birbirine sokularak eldivenler yerleştirilir; <strong>delik kontrol edilir</strong> (delikse kontamine, yenisi giyilir).","Eller bel üstünde, görüş alanında tutulur; <strong>hiçbir yere değdirilmez</strong>."])}<h3>Çıkarma</h3>${OL(["Sağ el dominantsa <strong>önce sol</strong> eldiven çıkarılır: koncun yakınından (bileğe değmeden) <strong>tersyüz</strong> edilerek çıkarılır.","Çıkan eldiven eldivenli elin içinde tutulur.","Eldivensiz elin <strong>dört parmağı</strong> diğer eldivenin koncu iç yüzüne sokulur, dış yüze değmeden tersyüz çıkarılır.","<strong>Eller yıkanır.</strong>"])}`);
S(11,"Kişisel Koruyucu Ekipman (İzolasyon) Kullanımı",`<p><strong>Malzemeler:</strong> tek kullanımlık önlük, eldiven, maske, bone, gözlük, yüz koruyucu.</p><h3>Giyinme</h3>${OL(["İzolasyon nedenini içeren tıbbi öykü değerlendirilir; <strong>takılar çıkarılır</strong>; el hijyeni; <strong>izolasyon türüne göre</strong> malzeme belirlenir.","Uzun saçlar bağlanır; <strong>bone</strong> saçların tamamını içine alacak şekilde takılır.","<strong>Önlük</strong> açık kısmı arkada giyilir, kollar parmak uçlarına çekilir, <strong>boyundan ve belden</strong> bağlanır.","<strong>Maske:</strong> metal şerit burun kanatları üzerinde; ağız, burun, çene kaplanır; üst bağ kulakların üstünden, alt bağ altından başın arkasında bağlanır; şerit burunda sıkıştırılır.","Gerekirse <strong>gözlük ve yüz koruyucu</strong>; el hijyeni; <strong>eldiven önlüğün kol ağzının üstüne</strong> gelecek şekilde giyilir."])}<h3>Odada</h3><p>Kimlik doğrulama, bilgilendirme, mahremiyet, yatak fren-yükseklik-kenarlık kontrolü, bakım. Kirli malzeme <strong>sağlam, nem geçirmez tek katlı</strong> torbaya; <strong>çok kirli çarşaf ve ıslak atıklar çift katlı</strong> torbaya; torba ağzı sıkıca bağlanır.</p>`);
S(11,"İzolasyonda Çıkarma Sırası",`${OL(["Önlüğün bağı önden bağlıysa <strong>eldiven çıkarmadan önce çözülür</strong>.","<strong>Eldiven:</strong> biri kol ağzından tutulup tersyüz çıkarılır ve diğer eldivenli elin avuç içine alınır; eldivensiz elle diğerinin kol ağzı <strong>iç yüzünden</strong> tutulup tersyüz çıkarılır.","Gerekirse el hijyeni; <strong>gözlük ve yüz koruyucu</strong> çıkarılır.","<strong>Önlük:</strong> önce boyun, sonra bel bağcıkları çözülür; kirli kısım içeride kalacak şekilde omuzlardan aşağı bırakılır; dış yüze dokunmadan kollar çıkarılır, omuzların iç yüzünden tutulur, atık kutusuna atılır.","<strong>Maske:</strong> dış yüzeye dokunmadan <strong>önce alt, sonra üst</strong> bağ çözülür. Solunum izolasyonunda maske <strong>odadan çıkarken</strong> çıkarılır.","<strong>Bone</strong> dış yüzeye temas etmeden çıkarılır.","El hijyeni; notlar odadan çıkıldıktan sonra yazılır; oda kapısı kapatılır; kayıt hemşire gözlem formuna yapılır."])}`);
S(11,"Beceri Rehberi: Yaşamsal Bulgular",`<h3>Radyal nabız + solunum</h3>${OL(["El yıkama, kimlik, bilgi; <strong>nabız/solunumu etkileyen faktörler</strong> (yaş, aktivite, ilaç, anksiyete, IV tedavi) değerlendirilir.","Supine veya fowler; supine ise kol gövdeye paralel; fowler ise <strong>dirsek 90° fleksiyon, kalp hizasında destek</strong>; el bileği bükülmeden <strong>avuç içi aşağı</strong>.","Parmaklar radyal arterde, başparmak bileğin üstünde, <strong>hafif basınç</strong>; hız, ritim, dolgunluk değerlendirilir.","Nabız <strong>30 sn</strong> (anormalse 60 sn) sayılır; basınç değiştirilmeden <strong>göğüs kafesi gözlenir</strong>; solunum 30 sn (anormalse 60 sn) sayılır; dakikalık değerler hesaplanır.","Önceki değerlerle karşılaştırma ve kayıt."])}<h3>Apikal nabız</h3>${OL(["Fowler/semi fowler; göğüs açılır (mahremiyet).","Apeks: <strong>sol klavikula orta hattından inen hayali çizginin sol 5-6. kostalar arası boşlukla kesiştiği nokta</strong> (sol memenin altı, sternumdan ≈8 cm).","Steteskop alıcısı apekse yerleştirilir; <strong>60 sn</strong> sayılır; göğüs kapatılır, rahat pozisyon, yatak kenarlıkları kaldırılır, yatak en düşük seviye."])}<h3>Temporal ve timpanik ısı</h3><p><strong>Temporal:</strong> alın açık; termometre cildin uygun uzaklığında; başlat düğmesi; <strong>sinyal sesi gelene dek</strong> alında tutulur; değer okunur. <strong>Timpanik:</strong> ucuna tek kullanımlık prop; baş yana; kulak kepçesi erişkinde yukarı-geriye, çocukta aşağı-geriye; prob <strong>dış kulak girişine, çene hattı doğrultusunda</strong>; sinyal sesinden sonra çıkarılır; prop <strong>tıbbi atık</strong> kutusuna.</p>`);
S(11,"Beceri Rehberi: Brakial Arterden Kan Basıncı",`${OL(["Etkileyen faktörler (fistül, IV sıvı, mastektomi, inme, yaş, aktivite, anksiyete, ilaç) değerlendirilir; eller yıkanır; kimlik, bilgi, mahremiyet; yatak freni-yükseklik-kenarlık.","Supine/fowler/semi fowler; uygun kol seçilir; kıyafet kolu sıkmayacak şekilde açılır; <strong>ön kol kalp hizasında desteklenir</strong>, avuç içi yukarı; brakial arter palpe edilir.","Manşet brakial arterin <strong>2,5-5 cm yukarısından, bir parmak boşluk kalacak sıkılıkta</strong> sarılır; manometre kalp seviyesinde; puvar hava ayar düğmesi kapatılır; <strong>ibre sıfırda mı</strong> kontrol edilir.","<strong>Palpasyonla</strong> sistolik belirlenir: pasif el ile radyal nabız, nabız kayboluncaya dek şişir, o değer not edilir, boşalt, <strong>üzerine 30 mmHg eklenir</strong>.","Oskültasyondan önce <strong>30-60 sn beklenir</strong>; steteskop brakial arterde; hedef değere şişirilir; <strong>2-3 mmHg/sn</strong> boşaltılır; <strong>ilk Korotkoff</strong> (sistolik) ve <strong>kaybolma</strong> (diyastolik) okunur.","Manşet hızla boşaltılıp çıkarılır; tekrarlanacaksa <strong>30-60 sn</strong> beklenir; rahat pozisyon, kenarlıklar, düşük yatak, malzemeler, <strong>el hijyeni</strong>, kayıt."])}`);

function startTimerCustom(sn,onTimeout,color){
 clearTimer();const t0=Date.now();
 _tm=setInterval(()=>{
  const bar=document.getElementById('tbar');
  if(!bar||STATE.answered){clearTimer();return}
  const left=Math.max(0,sn-(Date.now()-t0)/1000);
  bar.style.width=(left/sn*100)+'%';
  bar.style.background=left<=3?'var(--no)':(color||'var(--wr)');
  const tn=document.getElementById('tnum');if(tn)tn.textContent=Math.ceil(left)+' sn';
  if(left<=0){clearTimer();toast('⏰ Süre doldu!');onTimeout()}
 },100);
}
const hpPills=()=>`<span class="pill gold">⭐ ${STATE.xp} Puan</span><span class="pill hp">${'❤️'.repeat(Math.max(0,STATE.hp))}${'🖤'.repeat(Math.max(0,3-STATE.hp))}</span><button class="btn small sec" onclick="renderModule(${STATE.level})">← Çık</button>`;
const reviewCard=()=>STATE.review.length?`<div class="card"><h2>📝 Yanlışlarını Gözden Geçir</h2>${STATE.review.map(r=>`<div class="review-item"><b>${r.q}</b><br>Doğru: <span style="color:var(--ok)">${r.correct}</span></div>`).join('')}</div>`:'';
const endCard=(icon,title,sub,fn)=>`<div class="top"><span class="pill gold">⭐ ${STATE.xp} Puan</span></div><div class="card center"><div class="big">${icon}</div><h2>${title}</h2><p class="sub">${sub}</p><button class="btn" onclick="${fn}(${STATE.level})">Tekrar Oyna 🔁</button><br><br><button class="btn sec" onclick="renderModule(${STATE.level})">← Modüle Dön</button></div>`;

// ---------- 1) DOĞRU / YANLIŞ ----------
function startTrueFalse(m){
 STATE.mode="tf";STATE.level=m;STATE.qi=0;STATE.hp=3;STATE.correct=0;STATE.wrong=0;STATE.review=[];STATE.combo=0;
 STATE.tfPool=shuffle(modQ(m)).slice(0,15).map(q=>Math.random()<.5?{q:q.q,a:shuffle(q.w)[0],dogru:false,gercek:q.a,e:q.e}:{q:q.q,a:q.a,dogru:true,gercek:q.a,e:q.e});
 showTF();
}
function showTF(){
 if(STATE.qi>=STATE.tfPool.length){tfEnd();return}
 const it=STATE.tfPool[STATE.qi];STATE.answered=false;
 $('#app').innerHTML=`<div class="top">${hpPills()}</div><div class="pg"><i style="width:${STATE.qi/STATE.tfPool.length*100}%"></i></div>
 <div class="card"><h2>⚡ Doğru/Yanlış – ${STATE.qi+1}/${STATE.tfPool.length}</h2><div class="tm"><span id="tnum">10</span><i id="tbar"></i></div>
 <p style="font-size:1.05rem;font-weight:600;margin:14px 0">${it.q}</p>
 <div class="ex" style="border-left-color:var(--wr)"><b>İfade:</b> ${it.a}</div><p class="sub center">Bu ifade doğru mu, yanlış mı?</p>
 <div style="display:flex;gap:8px"><button class="btn ok" style="flex:1" onclick="pickTF(true)">✅ DOĞRU</button><button class="btn danger" style="flex:1" onclick="pickTF(false)">❌ YANLIŞ</button></div><div id="fb"></div></div>`;
 startTimerCustom(10,()=>pickTF(null),'var(--wr)');
}
function pickTF(c){
 if(STATE.answered)return;STATE.answered=true;clearTimer();
 const it=STATE.tfPool[STATE.qi];let fb='';
 if(c===it.dogru){STATE.correct++;STATE.combo++;if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;addXP(2);showCombo(STATE.combo);fb='<p><b>✅ Doğru!</b> +2 Puan</p>'}
 else{STATE.wrong++;STATE.combo=0;STATE.hp--;STATE.review.push({q:it.q,correct:it.gercek,chosen:it.a,e:it.e});fb=`<p><b>❌ Yanlış!</b> Doğru cevap: <b>${it.gercek}</b></p>`}
 fb+=`<div class="ex">📖 ${it.e}</div>`;checkBadges();
 const last=STATE.qi+1>=STATE.tfPool.length,dead=STATE.hp<=0;
 fb+=`<button class="btn" onclick="${dead?'gameOver()':last?'tfEnd()':'nextTF()'}">${dead?'Canın bitti…':last?'Bitir 🏁':'Sonraki ▶'}</button>`;
 $('#fb').innerHTML=fb;document.querySelector('.top').innerHTML=hpPills();
}
function nextTF(){STATE.qi++;showTF()}
function tfEnd(){if(STATE.correct>=10){STATE.tfWins++;if(STATE.user)saveUser()}checkBadges();
 $('#app').innerHTML=endCard('⚡','Doğru/Yanlış Bitti!',`${STATE.correct} doğru • ${STATE.wrong} yanlış`,'startTrueFalse')+reviewCard()}

// ---------- 2) EŞLEŞTİRME ----------
function startMatch(m){
 STATE.mode="match";STATE.level=m;const pool=shuffle(modQ(m)).slice(0,6);let cards=[];
 pool.forEach((q,i)=>{cards.push({type:'q',text:q.q,pairId:i});cards.push({type:'a',text:q.a,pairId:i})});
 STATE.matchCards=shuffle(cards).map((c,i)=>({...c,uid:i,open:false,done:false}));
 STATE.matchFirst=null;STATE.matchSecond=null;STATE.matchLock=false;STATE.matchMoves=0;STATE.matchStart=Date.now();STATE.matchCorrect=0;STATE.matchWrong=0;
 showMatch();
}
function showMatch(){
 const cs=STATE.matchCards,tot=cs.length/2,dn=cs.filter(c=>c.done).length/2;
 $('#app').innerHTML=`<div class="top"><span class="pill gold">⭐ ${STATE.xp} Puan</span><span class="pill">🎯 ${dn}/${tot}</span><span class="pill">🔄 ${STATE.matchMoves} hamle</span><button class="btn small sec" onclick="renderModule(${STATE.level})">← Çık</button></div>
 <div class="card"><h2>🃏 Eşleştirme Oyunu</h2><p class="sub">Soru ile doğru cevabı eşleştir. Tüm çiftleri bul!</p><div class="match-grid">
 ${cs.map(c=>{const show=c.open||c.done;return `<button class="match-card ${c.done?'ok':c.open?'open':''}" onclick="flipMatch(${c.uid})" ${c.done?'disabled':''}>${show?`<span>${c.type==='q'?'❓':'💡'} ${c.text.slice(0,60)}${c.text.length>60?'…':''}</span>`:'<span style="font-size:2rem">?</span>'}</button>`}).join('')}
 </div></div>`;
}
function flipMatch(uid){
 if(STATE.matchLock)return;const c=STATE.matchCards.find(x=>x.uid===uid);if(!c||c.open||c.done)return;c.open=true;
 if(STATE.matchFirst===null){STATE.matchFirst=uid;showMatch();return}
 if(STATE.matchSecond!==null)return;
 STATE.matchSecond=uid;showMatch();STATE.matchMoves++;
 const a=STATE.matchCards.find(x=>x.uid===STATE.matchFirst),b=c;
 if(a.pairId===b.pairId&&a.type!==b.type){
  a.done=b.done=true;addXP(3);STATE.correct++;STATE.combo++;STATE.matchCorrect++;if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;
  showCombo(STATE.combo);toast('✅ Eşleşti! +3 Puan');STATE.matchFirst=STATE.matchSecond=null;checkBadges();
  setTimeout(()=>{showMatch();if(STATE.matchCards.every(x=>x.done))matchComplete()},500);
 }else{
  STATE.matchLock=true;STATE.wrong++;STATE.combo=0;STATE.matchWrong++;toast('❌ Eşleşmedi');
  setTimeout(()=>{a.open=b.open=false;STATE.matchFirst=STATE.matchSecond=null;STATE.matchLock=false;showMatch()},900);
 }
}
function matchComplete(){
 const sn=Math.round((Date.now()-STATE.matchStart)/1000);STATE.matchWins++;if(STATE.user)saveUser();checkBadges();
 $('#app').innerHTML=endCard('🎉','Eşleştirme Tamamlandı!',`${STATE.matchCorrect} eşleşme • ${STATE.matchWrong} hata • ${STATE.matchMoves} hamle • ${sn} saniye`,'startMatch');
}

// ---------- 3) ZAMANA KARŞI ----------
function startTimeAttack(m){
 clearInterval(STATE.taInterval);
 STATE.mode="ta";STATE.level=m;STATE.taCorrect=0;STATE.taWrong=0;STATE.taTime=60;STATE.taPool=shuffle(modQ(m));STATE.taIdx=0;STATE.combo=0;STATE.hp=3;STATE.review=[];
 showTimeAttack();
 STATE.taInterval=setInterval(()=>{
  STATE.taTime--;const el=document.getElementById('taTimer');
  if(el){el.textContent=STATE.taTime+' sn';if(STATE.taTime<=10)el.style.color='var(--no)'}
  const bar=document.getElementById('tbar');if(bar)bar.style.width=(STATE.taTime/60*100)+'%';
  if(STATE.taTime<=0){clearInterval(STATE.taInterval);taEnd()}
 },1000);
}
function showTimeAttack(){
 if(STATE.taIdx>=STATE.taPool.length){STATE.taIdx=0;STATE.taPool=shuffle(STATE.taPool)}
 const q=STATE.taPool[STATE.taIdx];
 STATE.currentOpts=shuffle([{t:q.a,ok:true},...shuffle(q.w).slice(0,2).map(w=>({t:w,ok:false}))]);STATE.answered=false;
 $('#app').innerHTML=`<div class="top"><span class="pill gold">⭐ ${STATE.xp} Puan</span><span class="pill">🎯 ${STATE.taCorrect}</span><span class="pill" id="taTimer" style="color:var(--wr)">${STATE.taTime} sn</span><button class="btn small sec" onclick="clearInterval(STATE.taInterval);renderModule(${STATE.level})">← Çık</button></div>
 <div class="tm"><i id="tbar" style="background:var(--wr);width:${STATE.taTime/60*100}%"></i></div>
 <div class="card"><h2>⏱️ Zamana Karşı</h2><p class="sub">60 saniyede kaç soru çözebilirsin? Her doğru +2 puan, 3 yanlışta oyun biter.</p>
 <p style="font-size:1.05rem;font-weight:600;margin:14px 0">${q.q}</p><div id="taOpts">${STATE.currentOpts.map((o,i)=>`<button class="op" onclick="pickTA(${i})">${o.t}</button>`).join('')}</div></div>`;
}
function pickTA(i){
 if(STATE.answered)return;STATE.answered=true;const q=STATE.taPool[STATE.taIdx],o=STATE.currentOpts[i];
 document.querySelectorAll('#taOpts .op').forEach((b,j)=>{b.disabled=true;if(STATE.currentOpts[j].ok)b.classList.add('g');else if(j===i)b.classList.add('r')});
 if(o.ok){STATE.taCorrect++;STATE.correct++;addXP(2);STATE.combo++;if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;showCombo(STATE.combo);toast('✅ +2 Puan')}
 else{STATE.taWrong++;STATE.wrong++;STATE.combo=0;STATE.hp--;STATE.review.push({q:q.q,correct:q.a,chosen:o.t,e:q.e});toast('❌ Yanlış');
  if(STATE.hp<=0){clearInterval(STATE.taInterval);taEnd();return}}
 setTimeout(()=>{STATE.taIdx++;if(STATE.taTime>0&&STATE.mode==="ta")showTimeAttack()},500);
}
function taEnd(){
 clearInterval(STATE.taInterval);if(STATE.taCorrect>STATE.taBest){STATE.taBest=STATE.taCorrect;if(STATE.user)saveUser()}checkBadges();
 $('#app').innerHTML=endCard('⏱️',STATE.taTime<=0?'Süre Doldu!':'Can Bitti!',`${STATE.taCorrect} doğru • ${STATE.taWrong} yanlış`,'startTimeAttack')+reviewCard();
}

// ---------- 4) KELİME AVI ----------
function startHangman(m){STATE.mode="hm";STATE.level=m;STATE.hmCorrect=0;STATE.hmWrongCount=0;STATE.hmPool=shuffle(modQ(m));STATE.hmIdx=0;STATE.review=[];STATE.combo=0;showHangman()}
function showHangman(){
 if(STATE.hmIdx>=STATE.hmPool.length){hangmanEnd();return}
 const q=STATE.hmPool[STATE.hmIdx];
 const ws=q.a.split(/[\s,()\-–\/]+/).map(w=>w.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'')).filter(w=>w.length>=4).sort((a,b)=>b.length-a.length);
 if(!ws.length){STATE.hmIdx++;showHangman();return}
 STATE.hmWord=TR(ws[0]);STATE.hmUsed=[];STATE.hmWrong=0;renderHangmanGame(q);
}
function renderHangmanGame(q){
 const word=STATE.hmWord,mask=word.split('').map(l=>STATE.hmUsed.includes(l)?l:'_').join(' ');
 const alf='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'.split(''),kalan=6-STATE.hmWrong,face=['😊','🙂','😐','😟','😰','😵','💀'][STATE.hmWrong];
 $('#app').innerHTML=`<div class="top"><span class="pill gold">⭐ ${STATE.xp} Puan</span><span class="pill hp">${'❤️'.repeat(Math.max(0,kalan))}</span><span class="pill">${STATE.hmIdx+1}/${STATE.hmPool.length}</span><button class="btn small sec" onclick="renderModule(${STATE.level})">← Çık</button></div>
 <div class="card"><h2>🎯 Kelime Avı</h2><p class="sub">İpucu (cevabın en uzun kelimesini bul): ${q.q}</p><div class="center" style="font-size:3rem;line-height:1;margin:12px 0">${face}</div>
 <div class="center" style="font-size:1.5rem;font-weight:800;letter-spacing:4px;color:var(--pr);margin:16px 0;word-break:break-all">${mask}</div>
 <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px">${alf.map(l=>{const u=STATE.hmUsed.includes(l);return `<button class="op ${u?(word.includes(l)?'ok':'r'):''}" style="padding:8px 0;text-align:center;font-weight:800;margin:0" onclick="guessHM('${l}')" ${u?'disabled':''}>${l}</button>`}).join('')}</div><div id="hmFb" style="margin-top:12px"></div></div>`;
}
function guessHM(h){
 if(STATE.hmUsed.includes(h))return;STATE.hmUsed.push(h);const word=STATE.hmWord,q=STATE.hmPool[STATE.hmIdx];
 if(!word.includes(h))STATE.hmWrong++;
 const win=word.split('').every(l=>STATE.hmUsed.includes(l)),lose=STATE.hmWrong>=6;renderHangmanGame(q);
 if(win){addXP(5);STATE.correct++;STATE.combo++;STATE.hmCorrect++;if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;showCombo(STATE.combo);checkBadges();
  $('#hmFb').innerHTML=`<div class="ex" style="border-left-color:var(--ok)">🎉 <b>Bildin!</b> +5 Puan<br>Cevap: ${q.a}<br>${q.e}</div><button class="btn" onclick="nextHM()">Sonraki ▶</button>`}
 else if(lose){STATE.wrong++;STATE.combo=0;STATE.hmWrongCount++;STATE.review.push({q:q.q,correct:q.a,chosen:'—',e:q.e});
  $('#hmFb').innerHTML=`<div class="ex" style="border-left-color:var(--no)">❌ <b>Bilemedin.</b> Kelime: <b>${word}</b><br>Cevap: ${q.a}<br>${q.e}</div><button class="btn" onclick="nextHM()">Sonraki ▶</button>`}
}
function nextHM(){STATE.hmIdx++;showHangman()}
function hangmanEnd(){if(STATE.hmCorrect>STATE.hmBest){STATE.hmBest=STATE.hmCorrect;if(STATE.user)saveUser()}checkBadges();
 $('#app').innerHTML=endCard('🎯','Kelime Avı Bitti!',`${STATE.hmCorrect} doğru • ${STATE.hmWrongCount} yanlış`,'startHangman')}

function startWordBubble(m){STATE.mode="wb";STATE.level=m;STATE.qi=0;STATE.hp=3;STATE.correct=0;STATE.wrong=0;STATE.review=[];STATE.combo=0;STATE.wbPool=shuffle(modQ(m)).slice(0,12);showWordBubble()}
function showWordBubble(){
 if(STATE.qi>=STATE.wbPool.length){wbEnd();return}
 const q=STATE.wbPool[STATE.qi];
 STATE.currentOpts=shuffle([{t:q.a,ok:true},...shuffle(q.w).slice(0,3).map(w=>({t:w,ok:false}))]);STATE.answered=false;
 $('#app').innerHTML=`<div class="top">${hpPills()}</div><div class="pg"><i style="width:${STATE.qi/STATE.wbPool.length*100}%"></i></div>
 <div class="card"><h2>🫧 Kelime Bulutu – ${STATE.qi+1}/${STATE.wbPool.length}</h2><div class="ex" style="border-left-color:var(--pr);font-size:.95rem"><b>Soru:</b> ${q.q}</div>
 <p class="sub center" style="margin-top:12px">Doğru cevap hangisi?</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
 ${STATE.currentOpts.map((o,i)=>`<button class="op" style="text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center;font-weight:700" onclick="pickWB(${i})">${o.t}</button>`).join('')}</div><div id="wbFb" style="margin-top:12px"></div></div>`;
}
function pickWB(i){
 if(STATE.answered)return;STATE.answered=true;const q=STATE.wbPool[STATE.qi],o=STATE.currentOpts[i];
 document.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(STATE.currentOpts[j].ok)b.classList.add('g');else if(j===i)b.classList.add('r')});
 let fb='';
 if(o.ok){STATE.correct++;STATE.combo++;addXP(2);if(STATE.combo>STATE.maxCombo)STATE.maxCombo=STATE.combo;showCombo(STATE.combo);fb='<p><b>✅ Doğru!</b> +2 Puan</p>'}
 else{STATE.wrong++;STATE.combo=0;STATE.hp--;STATE.review.push({q:q.q,correct:q.a,chosen:o.t,e:q.e});fb=`<p><b>❌ Yanlış!</b> Doğru: <b>${q.a}</b></p>`}
 fb+=`<div class="ex">📖 ${q.e}</div>`;checkBadges();
 const last=STATE.qi+1>=STATE.wbPool.length,dead=STATE.hp<=0;
 fb+=`<button class="btn" onclick="${dead?'gameOver()':last?'wbEnd()':'nextWB()'}">${dead?'Canın bitti…':last?'Bitir 🏁':'Sonraki ▶'}</button>`;
 $('#wbFb').innerHTML=fb;document.querySelector('.top').innerHTML=hpPills();
}
function nextWB(){STATE.qi++;showWordBubble()}
function wbEnd(){if(STATE.correct>STATE.wbBest){STATE.wbBest=STATE.correct;if(STATE.user)saveUser()}checkBadges();
 $('#app').innerHTML=endCard('🫧','Kelime Bulutu Bitti!',`${STATE.correct} doğru • ${STATE.wrong} yanlış`,'startWordBubble')+reviewCard()}

const gameGrid=m=>`<div class="game-grid">
 <div class="game-btn" onclick="startTrueFalse(${m})"><span class="icon">⚡</span><span class="name">Doğru/Yanlış</span><span class="desc">10 sn'de karar ver</span></div>
 <div class="game-btn" onclick="startMatch(${m})"><span class="icon">🃏</span><span class="name">Eşleştirme</span><span class="desc">Kartları eşleştir</span></div>
 <div class="game-btn" onclick="startTimeAttack(${m})"><span class="icon">⏱️</span><span class="name">Zamana Karşı</span><span class="desc">60 sn hücum</span></div>
 <div class="game-btn" onclick="startHangman(${m})"><span class="icon">🎯</span><span class="name">Kelime Avı</span><span class="desc">Adam asmaca</span></div>
 <div class="game-btn" onclick="startWordBubble(${m})"><span class="icon">🫧</span><span class="name">Kelime Bulutu</span><span class="desc">Soruyu bul</span></div>
 <div class="game-btn" onclick="startLevel(${m})"><span class="icon">🎯</span><span class="name">Klasik</span><span class="desc">15 soru</span></div></div>`;
function renderModule(m){
 STATE.mode="mod";const x=MODS[m],lk=m>=STATE.unlocked,qn=Math.min(15,modQ(m).length),cw=modCW(m),done=STATE.cw||{};
 $('#app').innerHTML=`${topBar()}<div class="card"><div class="big">${x.i}</div><h1 class="center">${m+1}. ${x.t}</h1><p class="sub center">${'⭐'.repeat(STATE.stars[m]||0)||'Henüz yıldız yok'}</p>
 <button class="btn" onclick="renderLearn(${m},0)">📖 Öğren (${modSlides(m).length} slayt)</button><br><br>
 <button class="btn ${lk?'sec':'warn'}" ${lk?'disabled':''} onclick="startLevel(${m})">${lk?'🔒 Yarışma (önceki modülün yarışmasını bitir)':'🎯 Klasik Yarışma ('+qn+' soru)'}</button></div>
 <div class="card"><h2>🎮 Mini Oyunlar</h2><p class="sub">Aynı modülün sorularıyla 5 farklı oyun modu:</p>${gameGrid(m)}</div>
 <div class="card"><h2>🧩 Çengel Bulmaca</h2>${cw.map(z=>`<button class="lv" onclick="openCrossword(${z.i})"><span class="i">${z.c.i}</span><span><b>${z.c.t}</b><small>${(done[z.i]||[]).length}/${z.c.w.length} kelime</small></span></button>`).join('')}</div>`;
 window.scrollTo(0,0);
}
function renderQuiz(){
 STATE.mode="quiz";
 $('#app').innerHTML=`${topBar()}<div class="card"><h1>🎯 Yarışma</h1><p class="sub">${QUESTIONS.length} soru • 6 farklı oyun modu!</p>
 <h2>📚 Modül Yarışmaları</h2>${MODS.map((_,m)=>modCard(m,'startLevel')).join('')}
 <h2 style="margin-top:14px">🎮 Mini Oyunlar</h2><p class="sub">Modül seç, oyunu seç:</p>
 ${MODS.map((x,m)=>`<div style="margin-bottom:12px"><b style="font-size:.9rem">${x.i} ${m+1}. ${x.t}</b>${gameGrid(m)}</div>`).join('')}
 <h2 style="margin-top:14px">👹 Boss Savaşı</h2><button class="btn danger" onclick="startBoss()">Boss Savaşı ⚔️</button></div>`;
}


renderAuth();
</script></body></html>
