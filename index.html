<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hemşireliğin Temel Kavramları – Mega Oyun</title>
<style>
:root{--bg:#0f0c29;--bg2:#1a1633;--cd:#211d40;--cd2:#2a2452;--tx:#f0edff;--mu:#a9a4d1;--pr:#8f74ff;--pr2:#6c47ff;--ok:#12a150;--no:#e5484d;--wr:#f5a623;--ln:#352f61;--gold:#ffd700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:780px;margin:0 auto;padding:12px;padding-bottom:50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pill{background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.pill.gold{border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.25)}
.pill.hp{border-color:var(--no)}
.pill.energy{border-color:var(--pr)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;font-weight:800;font-size:.95rem;color:var(--mu);transition:.25s}
.tabs button.active{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent;box-shadow:0 4px 18px rgba(108,71,255,.4)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pr),var(--wr),var(--ok))}
h1{font-size:1.45rem;margin:.2em 0;background:linear-gradient(90deg,var(--pr),var(--wr));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:0 0 8px;color:var(--wr)}
.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
button{font:inherit;color:var(--tx);cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:var(--cd2);border:1px solid var(--ln);border-radius:12px;padding:12px;width:100%;margin-bottom:10px;outline:none}
input:focus,select:focus{border-color:var(--pr)}
label{display:block;font-size:.82rem;color:var(--mu);margin-bottom:4px;font-weight:600}
.lv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:8px;transition:.25s}
.lv:hover:not([disabled]){transform:translateX(4px);border-color:var(--pr);box-shadow:0 4px 16px rgba(143,116,255,.2)}
.lv[disabled]{opacity:.4;cursor:not-allowed}
.lv b{display:block;font-size:.95rem}
.lv span.i{font-size:1.6rem;flex-shrink:0}
.lv small{color:var(--mu);font-size:.78rem}
.lv .lock{margin-left:auto;font-size:1.2rem;opacity:.5}
.lv .done{margin-left:auto;color:var(--ok);font-size:1.1rem}
.lv .stars{margin-left:auto;color:var(--gold);font-size:.8rem;letter-spacing:1px}
.op{display:block;width:100%;text-align:left;background:var(--cd2);border:2px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;transition:.2s;font-size:.92rem;position:relative}
.op:hover:not([disabled]){border-color:var(--pr);transform:translateY(-2px)}
.op[disabled]{cursor:default}
.op.g{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--cd2));animation:pop .4s}
.op.r{border-color:var(--no);background:color-mix(in srgb,var(--no) 22%,var(--cd2));animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;width:100%;font-size:.95rem;box-shadow:0 4px 14px rgba(108,71,255,.4);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:var(--cd2);border:1px solid var(--ln);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,var(--wr),#e09520)}
.btn.danger{background:linear-gradient(135deg,var(--no),#b83538)}
.btn.ok{background:linear-gradient(135deg,var(--ok),#0d7a3a)}
.btn.small{padding:9px 14px;font-size:.82rem;width:auto}
.pg{height:9px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:12px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--wr));transition:width .4s;border-radius:9px}
.ex{border-left:4px solid var(--pr);padding:10px 12px;margin:12px 0;font-size:.88rem;background:rgba(143,116,255,.08);border-radius:0 10px 10px 0;line-height:1.6}
.big{font-size:3rem;text-align:center;line-height:1;margin:8px 0}
.center{text-align:center}
.combo{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:2.8rem;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.8);pointer-events:none;z-index:999;animation:comboAnim 1s ease-out forwards}
@keyframes comboAnim{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--cd2);border:1px solid var(--ln);border-radius:99px;padding:5px 10px;font-size:.75rem;margin:3px 3px 0 0}
.badge.earned{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,215,0,.05))}
.badge.locked{opacity:.4}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{background:var(--cd2);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.stat .val{font-size:1.3rem;font-weight:900;color:var(--pr)}
.stat .lbl{font-size:.72rem;color:var(--mu);margin-top:2px}
.helper{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.helper button{flex:1;min-width:70px;background:var(--cd2);border:1px solid var(--ln);border-radius:10px;padding:9px;font-size:.78rem;font-weight:600;transition:.2s}
.helper button:hover:not([disabled]){border-color:var(--pr)}
.helper button[disabled]{opacity:.3;cursor:not-allowed}
.boss{background:linear-gradient(135deg,#2a0a0a,#1a0a2a);border-color:var(--no)}
.boss::before{background:linear-gradient(90deg,var(--no),var(--wr))}
.boss-hp{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}
.boss-hp i{display:block;height:100%;background:linear-gradient(90deg,var(--no),#ff6b6b);transition:width .4s}
.rank-box{text-align:center;padding:14px;background:var(--cd2);border-radius:14px;margin-bottom:12px}
.rank-icon{font-size:2.5rem}
.rank-name{font-weight:800;color:var(--gold);font-size:1.05rem;margin-top:4px}
.rank-xp{font-size:.8rem;color:var(--mu)}
.xpbar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wr));transition:width .4s}
.review-item{background:var(--cd2);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:.82rem;border-left:3px solid var(--no)}
.review-item.ok{border-left-color:var(--ok)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cd);border:1px solid var(--pr);border-radius:12px;padding:10px 18px;font-weight:700;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%;font-size:.9rem;animation:toastIn .4s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.slide-content{font-size:.9rem;line-height:1.7}
.slide-content ul{margin:6px 0;padding-left:20px}
.slide-content li{margin-bottom:4px}
.slide-content strong{color:var(--wr)}
.slide-content em{color:var(--pr);font-style:normal}
.slide-nav{display:flex;gap:6px;margin-top:12px}
.slide-nav button{flex:1;background:var(--cd2);border:1px solid var(--ln);border-radius:10px;padding:10px;font-weight:700;font-size:.85rem}
.slide-nav button:hover{border-color:var(--pr)}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cd2);border-radius:12px;margin-bottom:6px;font-size:.88rem}
.lb-row.me{border:2px solid var(--gold);background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,215,0,.02))}
.lb-rank{font-weight:900;font-size:1.1rem;color:var(--gold);min-width:28px;text-align:center}
.lb-name{flex:1;font-weight:600}
.lb-score{font-weight:800;color:var(--pr)}
.lb-sub{font-size:.72rem;color:var(--mu)}
.admin-table{width:100%;border-collapse:collapse;font-size:.82rem}
.admin-table th,.admin-table td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--ln)}
.admin-table th{color:var(--mu);font-weight:700;font-size:.75rem;text-transform:uppercase}
.admin-table tr:hover{background:var(--cd2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{text-align:center}
.auth-tabs{display:flex;gap:6px;margin-bottom:14px}
.auth-tabs button{flex:1;background:var(--cd2);border:1px solid var(--ln);border-radius:12px;padding:10px;font-weight:700;color:var(--mu)}
.auth-tabs button.active{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--ln);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.offline{background:var(--wr);color:#1a1633;text-align:center;padding:4px;font-size:.75rem;font-weight:700;border-radius:8px;margin-bottom:8px}

// ==================== SLIDES VERİSİ ====================
const SLIDES=[
{t:"Kavram Nedir?",c:`<p><strong>Kavram</strong>, bir varlığı, olayı, durumu veya düşünceyi ortak özelliklerine göre zihnimizde temsil eden genel bir düşünce birimidir.</p><ul><li>Gözlenebilen ya da hissedilebilen algıların, olayların, durumların adıdır.</li><li>Bir objenin ya da durumun zihnimizde şekillenmesine, nesnelerin isimlendirilmesine, aralarında ilişki kurulmasına yardım eder.</li><li>Benzer özellikleri olan şeyleri tek bir isim altında toplarız.</li></ul><p><em>Örnek:</em> "Masa" kavramı — farklı şekil ve renkte masalar olabilir ama hepsinin ortak özelliği "üzerine bir şey konabilen ayaklı mobilya" olmasıdır.</p><p><em>Örnek:</em> "Sevgi" kavramı — insanı bir şeye veya bir kimseye karşı yakın ilgi ve bağlılık göstermeye yönelten duygu (soyut).</p>`},
{t:"Kavram Türleri",c:`<h3>Somut Kavramlar</h3><p>Görülebilen, dokunulabilen şeylerdir. Örn: masa, elma, kalem</p><h3>Soyut Kavramlar</h3><p>Duyularla algılanamayan, düşünsel şeylerdir. Örn: sağlık, sevgi, özgürlük, adalet</p>`},
{t:"Kavramların Özellikleri",c:`<ul><li><strong>Geneldir:</strong> Tek bir varlığı değil, bir grubu anlatır.</li><li><strong>Soyuttur:</strong> Zihinsel bir üründür (gözle görülemez ama düşünülür).</li><li><strong>Dil ile ifade edilir:</strong> Kelimeler kavramları temsil eder.</li><li><strong>Ölçülebilir:</strong> Kavramların öğeleri olan davranışlar, özellikler, faaliyetler açıklandığı ve tanımlandığı zaman ölçülebilir.</li><li><strong>Öğrenmenin temelidir:</strong> Bilgiyi anlamlı hâle getirir.</li><li><strong>Bellekte saklanır:</strong> Gerektiğinde ortaya çıkarlar.</li></ul>`},
{t:"Kavram Öğrenme",c:`<p>Kavram öğrenme, sadece okulda değil <strong>yaşam boyu öğrenmenin temelidir</strong>.</p><p>Bireyin benzer özellikleri taşıyan nesne, olay veya durumları ortak bir kategori altında tanımayı ve ayırt etmeyi öğrenmesidir.</p><p>Yani kişi, <em>"bu buna benziyor, şu ondan farklı"</em> diyebilmeye başladığında kavram öğrenme gerçekleşir.</p><ul><li>Birey dünyaya geldiğinde başlar, ölünceye kadar devam eder.</li><li>Yaş ilerledikçe çocuk daha karmaşık kavramları öğrenir.</li><li>Çocuklar kavramların örneklerini rastlantısal olarak deneyim kazanarak öğrenirler.</li><li>Kavram öğrenmenin planlı biçimde öğretimi okullarda gerçekleşir.</li></ul>`},
{t:"Kavram Öğrenme Süreci – 4 Aşama",c:`<h3>1. Gözlem ve Deneyim</h3><p>Kişi çevresindeki nesne ve olayları fark eder. Örneğin bir çocuk farklı türde kediler görür: siyah, beyaz, tüylü, kısa kuyruklu… ama hepsi "kedi"dir.</p><h3>2. Benzerlik ve Farklılıkları Ayırt Etme</h3><p>Bu aşama kavram öğrenmenin <strong>kalbidir</strong>. Kişinin çevresindeki nesne, olay veya durumların ortak özelliklerini (benzerlikleri) bulması ve ayrıştırıcı özelliklerini (farklılıkları) fark etmesi sürecidir.</p><p><em>Örnek:</em> Hemşire, doktor, destek personel — hepsi sağlık alanında çalışır, insanlara yardım eder (sağlık ekibi). Ama hemşire bakım verir, doktor tanı koyar, destek personel bakıma yardımcı olur.</p><p><strong>Önemi:</strong> Düşünme ve sınıflandırma becerilerini geliştirir; kavram yanılgılarını önler; kavramlar arası ilişkileri anlamayı kolaylaştırır; bilgiyi anlamlı hale getirir.</p><h3>3. Genelleme Yapma</h3><p>Kişinin öğrendiği bilgiyi yeni durumlara aktarabilmesini sağlar. Bireyin benzer özellikler taşıyan farklı durumları aynı kavram altında toplayabilme becerisidir.</p><p><em>Örnek:</em> Öğrenci hemşirenin ateş ölçtüğünü, yara temizlediğini, beslenmeyi düzenlediğini öğrenmiş olsun. Hepsinin ortak yönü: hastanın gereksinimlerine yönelik bakım. Artık psikolojik destek gördüğünde de "Bu da hemşirelik bakımıdır." diyebilir.</p><h3>4. Uygulama ve Pekiştirme</h3><p>Kavram öğrenmenin son ve en kalıcı basamağıdır. Uygulama: öğrenilen kavramın yeni durumlarda doğru şekilde kullanılabilmesi. Pekiştirme: kavramın tekrar edilerek, farklı örneklerde kullanılarak kalıcı hâle getirilmesi.</p><p><strong>Önemi:</strong> Kalıcı öğrenmeyi sağlar; bilgiyi davranışa dönüştürür; hatalı öğrenmeleri düzeltir; kavramlar arası ilişkiyi güçlendirir; gerçek mesleki becerilerin gelişmesine katkı sağlar.</p>`},
{t:"Kavram Haritaları",c:`<p>Kavram haritaları, kavramların ve bu kavramlar arasındaki ilişkilerin grafiksel bir teknikle sunulmasıdır.</p><p>Bilginin zihinde nasıl anlamlandırıldığı ve kavramlar arasındaki bağların zihinde nasıl yapılandırıldığını ifade eden şematik bir gösterimdir.</p><p>Bir kavram haritası daha geniş bir kavram başlığı altındaki kavramların birbirleriyle ilişkilerini gösteren <strong>iki boyutlu bir şemadır</strong>.</p><h3>İşlevleri</h3><ul><li>Görselleştirme</li><li>İlişkilendirme</li><li>Somutlaştırma</li><li>Sınıflandırma</li><li><strong>Anlamlandırma (En temel işlevi)</strong></li><li>Bilgiyi Organize Etme</li></ul>`},
{t:"Kavram Haritası Çizim Kuralları",c:`<ul><li>Öğrencinin seviyesine uygun bir konu, metin seçilmeli; konu, öğrencinin önceki bilgilerinin bir devamı niteliğinde olmalı.</li><li>Haritalanacak metin iyice okunmalı; metnin en önemli düşüncesi, en genel kavramı veya teması ana kavram olarak seçilmeli.</li><li>Anahtar kavramlar seçilmeli ve listelenmeli.</li><li>Her kavram haritada yalnızca bir kez yer almalı.</li><li>Kavramlarla ilgili açıklama ve ilkeler listede yer almamalı.</li><li>Aynı önem seviyesindeki kavramlar aynı hiyerarşik düzeyde bulunmalı, aynı renk ya da şekilde olmalı.</li><li>Kavramlar kutu ya da yuvarlak içine alınmalı.</li><li>İki kavram arasındaki ilişki gösterilmek isteniyorsa, iki kutu arasına çizgi çizilmeli; oklar çok önemlidir.</li><li>Çizginin üstüne birkaç kelimeyle ilişki yazılmalı ("etkiler", "oluşturur", "içerir").</li><li>İlişki ve önermeler kutulanmamalı.</li><li>Her bir ilişki en az bir kavramı ilgilendiren bir önerme olmalı.</li><li>Haritaların değişik bölümlerinde çapraz bağlantılar yer almalı.</li><li>Haritaya güçlü bir temeli olan başlık seçilmeli; haritalar basit olmalı.</li><li>Haritalama işi bittikten sonra ufak bir paragrafla çizilen harita özetlenmelidir.</li></ul>`},
{t:"Kavram Haritalarının Faydaları",c:`<ul><li><strong>Bilgiyi düzenler:</strong> Karmaşık konular arasında ilişkileri görmeyi sağlar.</li><li><strong>Anlamlı öğrenmeyi destekler:</strong> Ezber yerine neden–sonuç ilişkisi kurmayı öğretir.</li><li><strong>Klinik düşünmeyi geliştirir:</strong> Hemşirelikte vaka analizlerinde kullanılır.</li><li><strong>Kalıcı öğrenme sağlar:</strong> Görsel ve kavramsal hafızayı birlikte kullanır.</li><li><strong>Öğrenme düzeyini ölçer:</strong> Öğrencinin kavramları nasıl bağladığı görülür.</li></ul><p>Hemşirelikte kullanımı: karmaşık bilgileri anlamlandırma, hasta bakım sürecini planlama, hemşirelik tanılarını ilişkilendirme.</p>`},
{t:"Hemşireliğin Temel Kavramları",c:`<p>Hemşirelik, insan, çevre, sağlık/hastalık vb. kavramlar, hemşirelik disiplinini oluşturan bilimsel içerikte yer alan <strong>temel kavramlardır</strong>.</p><p>Bir bilim ve sanat olarak tanımlanan hemşirelik disiplininde geliştirilen kuram ya da modeller, hemşirenin hasta bakımına sistematik yaklaşımını sağlayan araçlardır.</p><p>Hemşirelik kuram ve modellerinden dolayısıyla hizmetten söz edebilmek için en sık kullanılan hemşirelik tanımları ve bu tanımlarda yer alan temel kavramları ele almak gerekir.</p>`},
{t:"İnsan",c:`<p>İnsan bedensel, duygusal, sosyal ve entelektüel gereksinimleri olan bir bütündür. Bireyin sağlıklı olabilmesi için tüm bu gereksinimlerinin dengeli ve yeterli bir biçimde karşılanması gerekir.</p><p>Hemşirelik birey, aile ya da toplumun sağlık ve hastalıkları ile ilgili gereksinimlerini saptar ve bu gereksinimleri karşılamada bireye yardımcı olur.</p><p>Hemşireliğin temel amacı insana yardımdır; diğer bir deyişle kendi temel gereksinimlerini karşılayamayan bireylere yardımdır.</p><h3>Felsefi Tanımlar</h3><ul><li><strong>Aristo:</strong> İnsanı medenileşmiş ve bilgi yeteneğine sahip insan olarak tanımlar.</li><li><strong>Platon:</strong> İnsanı tüyleri olmayan varlık olarak ifade eder.</li><li><strong>TDK:</strong> Toplum halinde bir kültür çevresinde yaşayan, düşünme ve konuşma yeteneği olan, evreni bütün olarak kavrayabilen, bulguları sonucunda değiştirebilen ve biçimlendirebilen canlıdır.</li></ul><h3>Bilimsel Tanımlar</h3><ul><li><strong>Biyolojik:</strong> Milyonlarca hücrelerden oluşan oldukça karmaşık bir organizasyondur.</li><li><strong>Psikolojik:</strong> Diğer canlılardan daha yüksek duygusal, bilişsel ve devinimsel güçleri olan canlıdır.</li><li><strong>Sosyolojik:</strong> Diğer canlılara bakarak, kültürel değerler yaratan, toplumsal kurallar koyarak toplum içinde yaşayabilen varlıktır.</li></ul><h3>Hemşire Liderlere Göre İnsan</h3><ul><li><strong>Orem:</strong> İnsan, hayatını devam ettirebilmek için kendi öz-bakımlarını karşılayabilen varlıktır. İnsan ve çevre birbirleriyle bir bütün oluştururlar ve bunların birindeki değişiklik öz-bakım sistemini etkileyebilir.</li><li><strong>Henderson:</strong> İnsan kavramını biyolojik, psikolojik, sosyolojik ve ahlaki bileşenler üzerine temellendirmiştir. İnsanın 14 temel gereksinimini oluşturmuştur.</li><li><strong>Abdellah:</strong> "Holizm" (bütünlük) ve "hümanizm" kavramları üzerinde durmuştur. Hasta birey bir bütündür, parçaları ise onun sorunudur ve bütün parçalarından büyük değildir.</li></ul>`},
{t:"İnsanın Özellikleri",c:`<h3>Biyolojik</h3><p>Yaş, genetik yapı, cinsiyet, ırk, biyolojik ritim, büyüme-gelişme, asit-baz dengesi, dolaşım, sindirim, elektrolit dengesi, immün yanıt, mobilite, üreme, solunum, vücut ısı düzenleme, geçmiş hastalıklar, fiziksel sağlık</p><h3>Psikolojik</h3><p>Tutum, temel gereksinimler, beden imajı, iletişim, baş etme mekanizmaları, savunma mekanizmaları, duygu durumları, algılama, kendilik kavramı, değerler, bilinç, bilgi, hafıza, düşünme süreci</p><h3>Sosyolojik</h3><p>Temel gereksinimler, kültür, aile, gruba üye olma, dil, yaşam tarzı, diğerleri ile ilişkiler, roller, rol tanımları, okul sistemleri</p><h3>Spiritual</h3><p>İnançlar, yaşam felsefesi, din, değerler, temel gereksinimler</p>`},
{t:"Holizm (Bütüncüllük) Kuramı",c:`<p>Yaşayan organizmanın parçalardan oluştuğunu, <strong>bütünün parçaların toplamından daha büyük ve karmaşık olduğu</strong> esasına dayanır.</p><p>İnsanın birbirinden ayrılmaz olan parçaların tek başına ele alınmasının doğru sonuçlar vermeyeceğini savunur.</p><p>Holizm kavramı, mantıksal olarak hümanizmden ortaya çıkmıştır. Holizm, bireyi parçaların bir bütünü olarak görür ve bireyin bütün yönleriyle ilgilenir.</p><p>Günümüzde "bütüncül sağlık" görüşü; tüm insanlara, kendi çevreleri içinde yaklaşım gösterilmesini öngörür ve bireyin fiziksel, mental, sosyal bir varlık olduğunu ve her bireyin diğerlerinden ayrı bir nitelik taşıdığını kabul eder.</p>`},
{t:"Genel Sistem Teorisi",c:`<p>Van Bertalanffy tarafından <strong>1930'ların sonunda</strong> tanımlanmıştır. Sistem; girdi, süreç ve geribildirim parçalarından oluşmaktadır.</p><h3>Temel Kavramlar</h3><ul><li>Sistem parçaları arasında ilişkileri olan bir bütündür.</li><li>Sistem açık veya kapalı olabilir.</li><li>Yaşayan tüm sistemler açık sistemlerdir.</li><li>Sistem alt, üst sistemlerden oluşur.</li><li>Bir parçadaki değişiklik diğerini etkiler.</li><li>Sistemin homeostazisi (iç denge) vardır.</li></ul><p><em>Örnek:</em> Diyabetik bir hasta pnömoni olsa alt sistemlerde değişim olur. Enfeksiyon kan şekerinin değişimine neden olacak. Bu nedenle hastaneye yatması gerekecek. Hastaneye yatması ile bireyin kendi yaşamı, aile toplumdaki rolleri etkilenecektir.</p><p>İnsan alt sistemleri: Üreme, lenf, üriner, kardiyovasküler, solunum, sinir, sindirim, kas-iskelet.</p>`},
{t:"İnsanın Temel Gereksinimleri – Maslow",c:`<p>Temel gereksinimler teorisi <strong>Abraham Maslow (1940)</strong> tarafından oluşturulmuştur.</p><h3>Maslow Piramidi (alttan üste)</h3><ul><li>Fizyolojik ihtiyaçlar (Nefes alma, yeme, içme, uyuma, sevişme)</li><li>Güvenlik ihtiyaçları (Kendini, ailesini, toplumunu güven ve emniyet içinde ve tehlikeden uzak hissetmek)</li><li>Ait olma ve sevgi ihtiyaçları (Başkaları ile ilişki kurmak, kabul edilmek ve bir yere ait olmak)</li><li>Değer ihtiyaçları (Prestij, başarı, yeterli olmak ve başkalarınca benimsenip tanınmak)</li><li>Kendini gerçekleştirme ihtiyaçları (Kişisel tatmin, kişisel başarı, kişinin potansiyelini ortaya çıkarması)</li></ul><h3>Özellikleri</h3><ul><li>İnsanlar gereksinimlerini kendi önceliklerine göre karşılarlar.</li><li>Temel gereksinimlerin tümünün karşılanması gerekir, ancak bazı gereksinimlerin karşılanması ertelenebilir.</li><li>Temel insan gereksinimlerinin karşılanamaması homeostatik dengeyi bozabilir.</li><li>Bir gereksinim iç ya da dış uyaranlar aracılığıyla hissedilir.</li><li>Birey bu gereksiniminin karşılanmasına farklı biçimlerde tepki verebilir. Önceki yaşantılar, yaşam tarzı, kültürel değerler, inançlar bunu etkiler.</li><li>Temel insan gereksinimleri birbiriyle ilişkilidir.</li></ul><p>Etkileyen faktörler: yaş, cinsiyet, zeka, duygular, eğitim, sosyal ve ekonomik olanaklar, iyilik ya da hastalık durumu.</p>`},
{t:"Virginia Henderson'a Göre 14 Temel Gereksinim",c:`<ul><li>Yeterli beslenme</li><li>Boşaltım</li><li>Hareket ve pozisyon düzenleme</li><li>Normal solunum</li><li>Uyku ve dinlenme</li><li>Uygun giyinme</li><li>Beden ısısını düzenleme</li><li>Beden temizliği, deri bütünlüğü</li><li>Çevredeki tehlikelerden kaçınma</li><li>İletişim kurma</li><li>İnanışlara göre ibadet edebilme</li><li>Başarı ile çalışma</li><li>Eğlenme</li><li>Normal gelişme için öğrenme, keşfetme ve merak giderme</li></ul>`},
{t:"Roper, Logan ve Tierney – Günlük Yaşam Aktiviteleri",c:`<p>Günlük Yaşam Aktivitesi Modeli, hemşirelik süreci uygulamasının özellikle <strong>tanılama aşamasında</strong> gerçek ve olası sorunların saptanmasında kolaylık sağlamaktadır.</p><h3>12 Günlük Yaşam Aktivitesi</h3><ol><li>Hastanın ve çevrenin güvenliğini sağlama ve sürdürme</li><li>İletişim</li><li>Solunum</li><li>Yeme ve içme</li><li>Boşaltım alışkanlığı</li><li>Bireysel hijyen</li><li>Beden sıcaklığının kontrolü</li><li>Hareket</li><li>Çalışma ve eğlence alışkanlıkları</li><li>Cinselliğini ifade etme</li><li>Uyku alışkanlığı</li><li>Ölüm</li></ol><p>Hemşire hasta bireyin gereksinimlerini karşılarken onun kendine olan saygısını ve güvenini yitirmemesine özen göstermeli, en kısa zamanda bağımsız duruma gelmesi için ona yardımcı olmalıdır.</p>`},
{t:"Çevre",c:`<h3>Tanımlar</h3><ul><li><strong>Nightingale:</strong> Çevreyi, hastalık ve ölüme yol açan, organizmanın gelişmesini ve yaşamını etkileyen etmenler ve dış çevrenin bütünü olarak ele almıştır.</li><li><strong>Peplau:</strong> Çevreyi "organizma dışında var olan şartlar ve daha çok gelenek ve inançlarla şekillendirilmiş kültürel çevre" olarak ele almıştır.</li><li><strong>Roy:</strong> Çevreyi "kişilerin ve grupların davranışını ve gelişmesini etkileyen, tüm şartlar, durumlar ve etrafını saran tüm etkenler" olarak tanımlamıştır.</li><li><strong>Roger:</strong> Çevreyi "bölümleri farklı özellik gösteren, istenilen şekle sokulamayan dört boyutlu enerji alanının tanımlanması" olarak belirtmiştir.</li></ul><p>Sistem teorisi çevreyi <strong>iç ve dış</strong> olarak tanımlamaktadır. İç: Biyolojik, psikolojik, sosyolojik, spiritüel sistemler. Dış: Fizik çevre (su, ısı, hava), sosyal, ekonomik, politik sistemler.</p>`},
{t:"Fizik, Biyolojik, Sosyal ve Kültürel Çevre",c:`<h3>Fizik Çevre</h3><p>İklim, gürültü, coğrafya, hava, su, besin</p><h3>Biyolojik Çevre</h3><p>Mikroorganizmalar, patojenler, bitkiler, hayvanlar, ekosistem</p><h3>Sosyal Çevre</h3><p>Kişiler arası ilişkiler, aile, gruplar, toplum, kültür</p><h3>Kültürel Çevre</h3><p>Değerler, etnik, din, ırk, dil, iletişim, gelenek, görenekler</p><p>Yakın çevreyi tanımlayan ve koşulları doğal yolla destekleyen veya geliştiren ortamdır. Hava, su, yiyecek, ses, aydınlatma, iklim, coğrafya fiziki çevreyi oluşturan ve insan sağlığını etkileyen önemli öğelerdir.</p>`},
{t:"İklim ve Sağlık",c:`<p>İklim, bir bölgede uzun yıllar boyunca gözlenen sıcaklık, nem, yağış, rüzgâr ve hava basıncı gibi hava olaylarının genel durumudur. İklim, çevrenin fiziksel bir bileşeni olarak bireyin sağlık durumunu, hastalık riskini ve iyileşme sürecini doğrudan etkiler.</p><h3>İklimin Sağlık Üzerine Etkileri</h3><ul><li><strong>Aşırı sıcak hava:</strong> Dehidratasyon (susuzluk), sıcak çarpması, tansiyon düşüklüğü, kalp hastalıklarının alevlenmesi</li><li><strong>Aşırı soğuk hava:</strong> Üşüme, hipotermi, donma, solunum yolu hastalıklarında artış</li><li><strong>Rüzgâr ve ani hava değişimleri:</strong> Migren, kas ağrısı, eklem ağrıları, alerjik reaksiyonlar</li><li><strong>Yüksek nem:</strong> Terleme artışı, mantar enfeksiyonları, solunum güçlüğü</li><li><strong>Hava kirliliği ve düşük hava kalitesi:</strong> Astım, KOAH, kalp-damar hastalıkları riskini artırır</li></ul><p>İklim sadece bedenimizi değil, ruh hâlimizi de etkiler. Güneş ışığının az olduğu dönemlerde (kış aylarında) depresyon ve halsizlik daha sık görülür. Buna <strong>"mevsimsel duygudurum bozukluğu"</strong> denir.</p>`},
{t:"Coğrafya ve Sağlık",c:`<p>Coğrafya, bireyin yaşadığı çevrenin fiziksel ve sosyal özelliklerini belirler; bu da sağlık düzeyini, hastalık riskini ve bakım gereksinimlerini doğrudan etkiler.</p><p><em>Örnek:</em> Deniz kenarında yaşayanlar daha çok balık ve deniz ürünleri, iç bölgelerde yaşayanlar daha çok tahıl ve et tüketir.</p><h3>Bölge Türleri ve Hemşirenin Rolü</h3><ul><li><strong>Tropikal (Brezilya, Nijerya):</strong> Enfeksiyonlar → Enfeksiyon kontrolü, aşılama</li><li><strong>Çöl (Mısır, Suudi Arabistan):</strong> Isı çarpması, su kıtlığı → Eğitim, koruyucu önlemler</li><li><strong>Dağlık (Nepal, Peru):</strong> Oksijen azlığı → Kronik hastaların takibi</li><li><strong>Soğuk (Norveç, Rusya):</strong> Hipotermi, depresyon → Isı kontrolü, psikososyal destek</li><li><strong>Kentsel (Çin, Hindistan):</strong> Hava kirliliği → Sağlık taramaları, eğitim</li><li><strong>Kırsal (Hindistan, Türkiye):</strong> Erişim sorunu → Gezici hemşirelik hizmeti</li><li><strong>Adalar (Japonya, Filipinler):</strong> Afet riski, nem → Afet yönetimi, destek hizmeti</li></ul>`},
{t:"Nightingale'in Çevre Kavramı",c:`<ul><li><strong>Havalandırma:</strong> Kötü ve küf kokulu bir hava hastalıklara kaynak oluşturduğundan hava cereyanı yaratmaksızın, odaların pencereler yoluyla havalandırmasını önermiştir.</li><li><strong>Isıtma:</strong> Hastanın beden ısısının azalmasına karşı uyanık davranarak yerel sıcak uygulamalar yardımı ile ısının korunması sağlanmalıdır.</li><li><strong>Koku:</strong> Hastalığa sebep olabilecek zararlı kokuların çevreden uzaklaştırılması bakımın kapsamındadır.</li><li><strong>Gürültü:</strong> Hastaların çoğu sessiz ortamlarda uyudukları için özellikle ani gürültüler uyku düzenini bozacaktır.</li><li><strong>Aydınlatma:</strong> Hasta yatakları gökyüzü ve güneşi görecek şekilde pencere kenarına yerleştirilmelidir.</li></ul>`},
{t:"Biyolojik Çevre",c:`<p>Bireyin yakın çevresinin yanı sıra yakın çevresinden bir bölümünü oluşturan hava, su gibi birçok canlı türünün yaşamı için gerekli koşulları sağlayan ortamdır. İç ve dış çevre olarak ikiye ayrılır.</p><ul><li><strong>Biyolojik iç çevre:</strong> Yaş, genetik özellikler, ırk…</li><li><strong>Biyolojik dış çevre:</strong> Güneş, ısı, mikroorganizmalar ve evrendeki diğer tüm canlılar</li></ul>`},
{t:"Sosyal Çevre ve Sosyal Sistem Tipleri",c:`<p>İnsanın yakın çevresi (aile), geniş çevresi (grup, toplum) ve evrensel çevresi (ülke, dünya, uzay) ile etkileşim sürecine bağlı, bireyin toplumlaşma olgusunu sağlayan bir ortamdır.</p><h3>Aile</h3><p>Sosyal sistemin temel yapısıdır. Ailenin 3 temel fonksiyonu:</p><ul><li><strong>Fiziksel fonksiyon:</strong> Yeme, içme, sağlık bakımı sağlama…</li><li><strong>Duygulanım fonksiyonu:</strong> Hissetme, paylaşım…</li><li><strong>Sosyal fonksiyon:</strong> Sosyal değerler ve davranışlar</li></ul><h3>Grup</h3><p>Belirli zamanlarda belirli amaç ve fonksiyonları yerine getirmek için bir araya gelen topluluklardır. Örnek: Türk Kızılayı Sağlık grupları gibi.</p><h3>Toplum</h3><p>Aynı yönetim altında, aynı bölgede yaşayan ve ortak kültürü olan gruplardır.</p>`},
{t:"Kültür",c:`<p>Kültür; nesiller boyu oluşan, toplum üyelerinin paylaştığı ve ilettiği sembollerin tümüdür.</p><h3>Kültürün 3 Özelliği</h3><ul><li><strong>Kültür öğrenilir:</strong> Kişi davranışları, tutumları ve inançları içinde yaşadığı, onu destekleyen ve eğiten kültürel aile sisteminden öğrenir.</li><li><strong>Kültür değişir, fakat aynı zamanda durağandır, sabittir:</strong> Dil, normlar, gelenek ve göreneklerin sabit olması ile ilgilidir.</li><li><strong>Her kültürün bileşenleri ve örüntüleri vardır:</strong> İletişim sistemi, aile sistemi, gelenekler, görenekler, adetler ve dil.</li></ul><h3>Kültürel Değişkenler</h3><ul><li><strong>Dil:</strong> İletişim en önemli değişkenlerden biridir.</li><li><strong>Din:</strong> Bireyin inancı, sıklıkla acı çekme, hastalığa anlam verme, yetersizlik hissetme ve ölümü kabul etmede etkilidir.</li><li><strong>Aile yapısı:</strong> Ailenin özellikleri içinde yaşadığı toplumun kültürel özelliklerinden etkilenir.</li><li><strong>Beslenme davranışları:</strong> Kültürel etkiler nedeniyle kişilerin beslenme biçimleri etkilenmektedir.</li></ul>`},
{t:"Kültürel Örnekler",c:`<ul><li><strong>Hindistan:</strong> Vejetaryen beslenme yaygındır; bazı hastalar et ürünlerini reddedebilir.</li><li><strong>Japonya:</strong> Balık ağırlıklı diyet, uzun yaşam ve düşük kalp hastalıkları ile ilişkilidir. Hamam ve düzenli banyo kültürü, bulaşıcı hastalıkların düşük görülmesini destekler.</li><li><strong>Afrika ve Güney Asya:</strong> Bazı topluluklarda el yıkama ve tuvalet hijyeni geleneksel ritüellere bağlıdır.</li><li><strong>Meksika/Latin Amerika:</strong> "Sobador" adı verilen geleneksel masajcılar bebek ve annenin sağlığını destekler.</li><li><strong>Orta Doğu:</strong> Ramazan ayında oruç tutulur; abdest ve temizliğe verilen önem suyla temizlik kültürü sağlar. Lohusa döneminde anneye özel beslenme ve istirahat uygulamaları (lohusa şerbeti, sıcak tutulma).</li><li><strong>Türkiye:</strong> Kadın aşerdiği şeyleri yiyemezse bebeğin sakat doğacağına, tatlıya aşerenin çocuğunun zeki, nara aşerenin güzel olacağına inanma gibi inanışlar vardır.</li><li><strong>Navajo Yerlileri:</strong> Kundak yapılan çocuklarda çok görülen doğuştan kalça eklemi çıkığı çok yaygın olduğundan hastalık olarak kabul edilmez.</li></ul>`},
{t:"Sağlık Tanımları",c:`<ul><li><strong>Dünya Sağlık Örgütü (1947):</strong> "Sağlık; yalnızca hastalık ve sakatlığın olmayışı değil, fiziksel, mental ve sosyal yönden tam bir iyilik halidir."</li><li><strong>Orem:</strong> Sağlığı bireyin bedensel ve işlevsel olarak bir bütün içinde olma durumu olarak belirtmiştir.</li><li><strong>Nightingale:</strong> Sağlığı iyi olma ve kişinin var olan potansiyelini mümkün olduğu en üst düzeyde kullanma olarak tanımlamıştır.</li><li><strong>Travelbee:</strong> Sağlığı subjektif ve objektif sağlık kriterleriyle tanımlamıştır.</li><li><strong>Hildegard E. Peplau (1952):</strong> Sağlığı; kişilik ve diğer insan süreçleri olan yapılanmacılığın, yaratıcılığın ve üretkenliğin devamı olarak tanımlamıştır.</li><li><strong>Virginia Henderson (1955):</strong> Sağlığı bağımsızlık ve hemşirelik bakımı olmaksızın 14 temel alandaki gereksinimleri bağımsız olarak gerçekleştirebilmek olarak tanımlamıştır.</li><li><strong>Faye Gleen Abdellah (1960):</strong> Bozulma ya da bozulma olasılığının ve karşılanamayan bireysel ihtiyaçların olduğu zaman olarak tanımlamıştır.</li><li><strong>Martha E. Rogers (1970):</strong> İnsanın çevre ile etkileşiminden ortaya çıkan ve insanın potansiyelini maksimuma doğru çıkmasıdır.</li></ul>`},
{t:"Subjektif ve Objektif Sağlık",c:`<h3>Subjektif Sağlık</h3><p>Bireyin kendisinin, fiziksel, ruhsal ve sosyal yönden durumunu algılaması halidir. Bu bakış açısına göre birey, hasta olmadığı halde kendisini hasta ya da hasta olduğu halde kendisini sağlıklı algılayabilir.</p><h3>Objektif Sağlık</h3><p>Doktor muayenesi ve tanı testleri sonuçlarına göre belirlenen hastalığın olmamasıdır. Bu durumda bir kişiye sağlıklı diyebilmek için; hem bireyin kendini sübjektif olarak sağlıklı algılaması, hem de objektif olarak gerçekten sağlıklı olması gerekir.</p>`},
{t:"Sağlık Kavramını Etkileyenler",c:`<p>Sağlık kavramını etkileyen dört temel unsur:</p><ul><li><strong>Çevre</strong></li><li><strong>İnsan biyolojisi (genetik)</strong></li><li><strong>Yaşam stili (alışkanlıklar, yaşam prensipleri)</strong></li><li><strong>Sağlık bakımı</strong></li></ul>`},
{t:"Sağlık Kavramı Üç Durum",c:`<ul><li><strong>Negatif Sağlık:</strong> "Sağlıksızlık" (engellilik, yaralanma, sakatlık ve hastalık…)</li><li><strong>Nötral Sağlık:</strong> Herhangi bir hastalık veya rahatsızlık durumunun olmadığı, dengeli bir sağlık kavramını belirtmektedir.</li><li><strong>Pozitif Sağlık:</strong> Sağlığın pozitif yönü tanımda "tam bir iyilik durumu" şeklinde ifade edilmektedir.</li></ul>`},
{t:"Hastalık",c:`<p>Hastalık bireyin fiziksel, ruhsal, entelektüel, sosyal ve gelişim evrelerinde ya da spiritüel fonksiyonlarında gerileme veya azalmanın meydana gelmesidir.</p><p>DSÖ ise hastalığı; fiziksel, akılsal ve sosyal tam bir iyilik halinin yokluğu şeklinde tanımlamıştır.</p><h3>Disease ve Illness Farkı</h3><ul><li><strong>Tıbbi açıdan hastalık (disease) (objektif):</strong> Belirli işaret ve semptomlarla kendini gösteren patolojik bir anormalliği ifade eder.</li><li><strong>Birey açısından hastalık (illness) (subjektif):</strong> Sağlıksızlığın veya patolojik sürecin sonuçlarının, öznel deneyim içinde bireylerce algılanması.</li></ul><p><em>Örnek:</em> Bir kişi hipertansiyon tanısı almış, diyeti ilaç ve egzersizlerle tansiyonunu düzenlemiş olabilir. Bu kişi kendisini hasta hissetmeyebilir. Başka bir kişi ise ağrı hissedebilir ve buna bağlı olarak kendisini hasta olarak algılayabilir ancak herhangi bir tıbbi tanı konmayabilir.</p>`},
{t:"Akut ve Kronik Hastalık",c:`<h3>Akut Hastalık</h3><p>Kısa sürede ortaya çıkmıştır ve ciddidir. Birçok fonksiyonu etkileyebilir.</p><h3>Kronik Hastalık</h3><p>Genellikle altı aydan daha uzun süreli olan ve belli aralıklarla tekrarı olan bir durumdur. Hastalarda, birbirine benzer sınırlılıklar, patolojik sonuçlar doğurur. Hastaların, bu duruma uyum sağlayarak yaşamlarını devam ettirmeyi öğrenmeleri gerekir.</p>`},
{t:"Hasta Olma Davranışı",c:`<p>Hasta olma davranışını kişisel özellikler, sosyal statü, sosyal normlar, olanaklar, kişinin çevresi gibi birçok şey etkilemektedir.</p><h3>İçsel Değişkenler</h3><p>Bireyin hastalık ve hastalığın semptomlarını nasıl algıladığı hastalığa karşı olan davranışlarını etkiler.</p><h3>Dışsal Değişkenler</h3><p>Sosyal gruplar; kişinin kültürü, ekonomik durumu, sağlık sisteminin ve kuruluşunun özellikleri, sosyal desteği gibi özellikler bireyin sağlık davranışını etkileyen dışsal değişkenlerdir.</p>`},
{t:"Hastalığın Birey ve Aile Üzerinde Etkileri",c:`<ul><li><strong>Davranışsal ve Emosyonel Etkiler:</strong> Bireyler hastalığa ve tedavisine farklı biçimlerde tepki verirler. Hastalık tanısı almayla beraber bireyler anksiyete, şok, inkar, öfke, içe kapanma gibi tepkiler gösterir.</li><li><strong>Beden İmajı Etkisi:</strong> Bacak amputasyonu gibi beden imajını etkileyecek bir durum olduğunda genel olarak birey; şok, geri çekilme, bilgilenme, kabul ve rehabilitasyon aşamalarını geçirirler.</li><li><strong>Kendilik Kavramına Etkisi:</strong> Kendilik algısı kişiliğin tüm alanlarının zihindeki imajıdır. Kendilik kavramındaki etkilenme çok komplekstir ve ancak kişilerin rollerindeki değişimler ile gözlenebilir.</li><li><strong>Aile Rollerine ve Dinamiklerine Etkisi:</strong> Hastalık durumunda aile içindeki rollerde değişim olur. Bu durum stres ve çatışmalara neden olabilir.</li></ul>`},
{t:"Sağlık, İnanç ve Uygulamalarını Etkileyen Değişkenler",c:`<h3>İç Değişkenler</h3><ul><li><strong>Büyüme Gelişme Düzeyi ve Dönemi:</strong> Çocukluk, adölesan, erişkin dönem için sağlık kavramları farklı olarak ele alınmalıdır. Çocuklar için hastalık ve özellikle hastaneye yatma korku ve anksiyete anlamına gelir.</li><li><strong>Entelektüel Düzeyi:</strong> Kişinin sağlıklı ve vücut fonksiyonlarına ilişkin bilgisi, bilgi eksikliği, hatalı bilgileri ve eğitimi düzeyi, geçmiş deneyimleri sağlığa ilişkin inançları etkilemektedir.</li><li><strong>Fonksiyonların Algılanması:</strong> Kişilerin fiziksel fonksiyonları inanç ve uygulamalarını etkilemektedir.</li><li><strong>Emosyonel Faktörler:</strong> Kişilerin stresi, depresyonu ve korkuları sağlık inanç ve uygulamalarını etkileyebilir.</li><li><strong>Spiritüel Faktörler:</strong> Kişinin ailesi, arkadaşları ile iletişimleri, yaşamın anlamı, kişinin yaşam biçiminin nasıl olacağını şekillendiren özellikleridir.</li></ul><h3>Dış Değişkenler</h3><ul><li><strong>Aile:</strong> Aile kişinin hastalık ciddiyeti ile ilgili algısını, hastalığa karşı önlemleri ve hastalığa karşı tepkileri etkilemektedir.</li><li><strong>Kültürel Özellikler:</strong> Kültür sağlık bakım sistemine yaklaşımı, kişisel sağlık uygulamalarını, hasta hemşire iletişimini etkiler.</li><li><strong>Sosyo-ekonomik Faktörler:</strong> Ekonomik durum kişinin sağlığını korumasını etkilediği gibi sağlık sorunları çıktığında çözüm arama davranışlarını da etkileyecektir.</li></ul>`},
{t:"Sağlığı Koruma, İyilik ve Hastalıkları Önleme",c:`<ul><li><strong>Sağlığı Koruma:</strong> Düzenli egzersiz yapma, iyi beslenme, sağlığın var olan durumunu sürdürmeye odaklanmaktadır.</li><li><strong>İyilik kavramı:</strong> Kendi sorumluluğunu alma, stres yönetimi, fiziksel farkındalık gibi kişinin kendisini sağlıklı hissetmesi için neler yapması gerektiğini öğrenmesidir.</li><li><strong>Hastalığın önlenmesi:</strong> İmmünizasyon programları gibi sağlığın seviyesini artırmaya ya da hastalıkları önlemeye yönelik aktiviteleri içerir.</li></ul><h3>Sağlık Düzeyinin Belirleyicileri</h3><ul><li>Fizik aktivite</li><li>Aşırı kilo ve obezite</li><li>Sigara kullanımı</li><li>Madde kullanımı</li><li>Seksüel davranışın sorumluluğunu alma</li><li>Mental sağlık</li><li>Şiddet</li><li>Çevre kalitesi</li><li>İmmünizasyon</li><li>Sağlığa ulaşılabilirlik</li></ul>`},
{t:"Smith'in Sağlık Modeli",c:`<ul><li><strong>Klinik model:</strong> En dar bakış açısına sahip olan modeldir. İnsanların fizyolojik sistemlerinin fonksiyonları ile ilişkili modeldir. Klinik modele göre sağlık hastalık kavramının tersidir.</li><li><strong>Rol performans modeli:</strong> Bu model sağlık kavramına sosyal ve psikolojik boyutlar katmıştır. Eğer bir kişi kendisinden beklenen rolleri yerine getiremiyorsa o kişi klinik olarak sağlıklı görünse de hasta olabilir.</li><li><strong>Adaptif model (Uyum Modeli):</strong> Klinik model ve rol performans modelinin birleşimi uyum modelidir. Sağlık, fizik ve sosyal çevre ile bireyin etkili etkileşimidir.</li><li><strong>Eudaimonistik model:</strong> Smith'e göre sağlık kavramının en kapsamlı bu modeldir. Bu modelde sağlıklı kişi biyolojik olarak en iyi durumda ne olmak istiyorsa ve ne yapmak istiyorsa onu başarabildiği bir durum olarak tanımlanmaktadır.</li></ul>`},
{t:"Sağlık İnanç Modeli",c:`<p>1950'lerin başında, hastalıkların önlenmesi ve erken tanısında yer alan tarama programlarına katılımın yetersizliğini açıklamak için <strong>Rosenstock</strong> tarafından geliştirilmiştir.</p><h3>Modelin Esasları</h3><ul><li><strong>Hassasiyet/duyarlılık algısı:</strong> Hastalık olma olasılığı</li><li><strong>Ciddiyet algısı:</strong> Hastalığın ciddiyet ve kişinin yaşamı için ne kadar ciddi tehlikeli olduğunun algısı</li><li><strong>Yarar:</strong> Olası sağlık davranışının hastalığı azaltma olasılığı</li><li><strong>Hastalığın tedavi algısı:</strong> Hastalığın tedavi edilebilirliğine olan inanç</li><li><strong>Maliyet:</strong> Sağlık davranışının zaman, para, enerji açısından maliyeti, ağrı ve rahatsızlık gibi olası yan etkileri</li><li><strong>İpuçları:</strong> Sağlık arama davranışına ilişkin gazete, televizyon haberleri, kişideki semptomlar, ya da sağlık çalışanları ile iletişimlerinden aldığı ipuçları.</li></ul>`},
{t:"Pender'in Sağlığı Geliştirme Modeli",c:`<p>Pender tarafından <strong>1980</strong> yılında geliştirilmiş olup <strong>1987 ve 1996</strong> yılında revize edilmiştir.</p><p>Modelin sağlığı geliştirme alanındaki uygulamalara yol gösterecek nitelikte ve sağlığı koruma modellerinin tamamlayıcısı olması amaçlanmıştır.</p><p>Modele göre; bireylerin davranışı üzerinde önceki davranışlarının etkili olduğu belirtilmektedir.</p><h3>Model Bileşenleri (1996)</h3><ul><li><strong>Bireysel Özellikler ve Deneyimler:</strong> Önceki davranışlarla ilişki, bireysel özellikler (biyolojik, psikolojik, sosyo-kültürel)</li><li><strong>Davranışa Özgü Kavramlar:</strong> Yarar algısı, engel algısı, öz-etkililik algısı, aktiviteyle ilişkili etki, kişilerarası etkiler, durumsal etkiler (seçimler, tercihler, estetik)</li><li><strong>Davranış Çıktısı:</strong> Acil gereksinimlerin ve tercihlerin karşılanması, davranışa ilişkin plan yapma, sağlığı geliştirme davranışı</li></ul>`},
{t:"Neuman'ın Sağlık/Hastalık Sürekliliği Modeli",c:`<p>Model; <strong>Neuman (1990)</strong> tarafından oluşturulmuştur. Neuman sağlığın bir çizgi üzerinde sürekli olarak değiştiğini; genetik, yaş, yaşam tarzı ve çevre gibi faktörlerin bunda etkili olduğunu açıklar.</p><p>Çizgi üzerindeki durumlar: <strong>Üst düzey iyilik (esenlik) → iyi düzey → normal → hastalık → ölüm</strong></p>`},
{t:"Üst Düzey Esenlik Modeli",c:`<p>1950'nin sonlarında geliştirilmiştir. <strong>Dunn (1977)</strong> tarafından revize edilmiştir.</p><p>Modelin amacı bireyin sağlık potansiyelini en üst düzeye çıkarmaktır. Sağlık bakımı hastalığın tedavisinden çok, bireyin sağlığını geliştirme ve hastalığı önleme aktivitelerini kapsar.</p>`},
{t:"Suchman'ın 5 Hastalık Evresi",c:`<p>Suchman'a göre bireyler hasta olduklarında davranışları iç ve dış etkenlerden etkilenince hastalık davranışının 5 evresinden geçerler.</p><ol><li><strong>Semptomların yaşanması:</strong> Bir şeylerin yolunda olmadığının fark edilmesi</li><li><strong>Hasta rolünü üstlenme:</strong> Bireyin hasta olduğunu ve yardıma ihtiyacı olduğunun fark edilmesi</li><li><strong>Tıbbi bakım ile temas:</strong> Profesyonel yardım almaya karar verilmesi</li><li><strong>Bağımlı hasta rolü:</strong> Kontrolün hekime bırakılması</li><li><strong>İyileşme ve rehabilitasyon:</strong> Hasta rolünün terk edilmesi</li></ol>`},
{t:"Hemşirelik Tanımları",c:`<ul><li><strong>ICN (Uluslararası Hemşirelik Konseyi):</strong> Hemşirelik; kişinin, ailenin ve toplumun sağlığını koruma ve geliştirmeye yardım eden, hastalık halinde iyileştirme, rehabilite etmeye katılan bir meslek grubu olarak tanımlanmıştır.</li><li><strong>THD (Türk Hemşireler Derneği) (1981):</strong> Hemşireliği; bireyin, ailenin ve toplumun sağlığını ve esenliğini koruma, geliştirme ve hastalık halinde iyileşme amacına yönelik hemşirelik hizmetlerinin planlanması, örgütlenmesi, uygulanması ve değerlendirilmesinden, bu kişilerin eğitiminden sorumlu bilim ve sanattan oluşan bir sağlık disiplini şeklinde tanımlamıştır.</li><li><strong>ANA (Amerikan Hemşireler Birliği) (1980):</strong> Hemşireliği; var olan ve olabilecek olan sağlık sorunlarına karşı gösterilen insan tepkilerinin tanı ve tedavisidir olarak tanımlamıştır.</li></ul>`},
{t:"Hemşirelik Kanunu (2007)",c:`<p>02.05.2007 tarihinde yayınlanan Hemşirelik Kanununda hemşirelik;</p><p>Türkiye'de üniversitelerin hemşirelik ile ilgili lisans eğitimi veren fakülte ve yüksekokullarından mezun olan ve diplomaları sağlık bakanlığınca tescil edilenler ile öğrenimlerini yurt dışında hemşirelik ile ilgili, devlet tarafından tanınan bir okulda tamamlayarak denklikleri onaylanan ve diplomaları sağlık bakanlığınca tescil edilenlere <strong>Hemşire</strong> ünvanı verilir olarak yayınlanmıştır.</p><h3>Madde 4 – Hemşirelerin Görevleri</h3><ul><li>Tabip tarafından acil haller dışında yazılı olarak verilen tedavileri uygulamak,</li><li>Her ortamda bireyin, ailenin ve toplumun hemşirelik girişimleri ile karşılanabilecek sağlıkla ilgili ihtiyaçlarını belirlemek ve</li><li>Hemşirelik tanılama süreci kapsamında belirlenen ihtiyaçlar çerçevesinde hemşirelik bakımını planlamak, uygulamak, denetlemek ve değerlendirmekle görevli ve yetkili sağlık personelidir.</li></ul>`},
{t:"Hemşirenin Mesleki Sorumlulukları",c:`<ul><li>Mesleki uygulamalarının sorumluluğunu üstlenir.</li><li>Mesleki uygulama standartlarının geliştirilmesine katkıda bulunur ve standartlara göre hizmet verir.</li><li>Bireysel olarak mesleki bilgi ve becerisini geliştirerek yeterliliğini sürdürür.</li><li>Mesleğin onuru ve saygınlığını yansıtacak tutum ve davranışlar içinde bulunur.</li><li>Bilimsel araştırmalara katılarak mesleki bilgi yüküne ve uygulama standartlarının geliştirilmesine katkıda bulunur.</li><li>Mesleki örgütlenmenin güçlendirilmesine katkıda bulunur.</li><li>Mesleki uygulamalarını meslektaşları ve sağlık ekibinin diğer üyeleriyle saygılı, yapıcı ve etkin bir iletişim ve iş birliği içinde gerçekleştirir.</li><li>Hemşirelik öğrencilerine uygun öğrenme ortamlarının hazırlanması ve desteklenmesinde sorumluluk üstlenir.</li><li>Araştırmalara ve kanıta dayalı mesleki bilgi birikiminin geliştirilmesinde sorumluluk üstlenir.</li><li>Meslektaşları ile onların gelişimlerini destekleyici ve ait olma duygusunu güçlendirici nitelikte profesyonel ilişki kurar.</li></ul>`},
{t:"Çağdaş Hemşirelik Rolleri",c:`<p>Çağdaş hemşirelik rolleri, hemşireliğin sadece hasta bakımıyla sınırlı olmadığını, toplum sağlığından araştırmaya, eğitimden liderliğe kadar geniş bir yelpazede görevler üstlendiğini gösterir.</p><h3>1. Bakım Rolü (Caregiver)</h3><p>Hastaların fiziksel, psikolojik ve sosyal gereksinimlerini karşılamak, güvenli ve etkili bakım sunmak. Görevler: ilaç uygulamak, yara bakımı yapmak, vital bulguları izlemek, ağrı yönetimi ve psikososyal destek sağlamak.</p><h3>2. Öğretici / Eğitici Rol (Educator)</h3><p>Hastaları, aileleri ve toplum üyelerini sağlık konularında bilgilendirmek ve eğitmek. Örnek: Diyabetli hastaya insülin uygulama ve kan şekeri takibini öğretmek.</p><h3>3. Danışman / Rehber Rol (Counselor / Advocate)</h3><p>Bireyleri, aileleri veya toplumu sağlık kararlarında yönlendirmek; haklarını korumak. Örnek: Kanser hastasının tedavi seçeneklerini açıklayarak karar sürecine destek olmak.</p><h3>4. Araştırmacı / Bilimsel Rol (Researcher)</h3><p>Hemşirelik uygulamalarını geliştirmek için araştırma yapmak, veri toplamak ve analiz etmek.</p><h3>5. Yönetici / Lider Rol (Manager / Leader)</h3><p>Hemşirelik hizmetlerini organize etmek, ekip yönetmek, kaliteyi sağlamak.</p><h3>6. Toplum Sağlığı Hemşiresi (Public Health Nurse)</h3><p>Bireylerin ve toplulukların sağlığını korumak, hastalıkları önlemek. Aşı kampanyaları, sağlık taramaları, eğitim programları düzenlemek.</p><h3>7. Liderlik ve Politik Rol</h3><p>Sağlık politikalarının geliştirilmesine katkıda bulunmak, meslek grubunu temsil etmek.</p>`},
{t:"Kuram Nedir?",c:`<p>Kuram <strong>görüş</strong> demektir. Olayları açıklayan genel ilkedir. Kavramlar arasındaki ilişkiyi sağlar. Bilimsel bilginin ortaya çıkmasını sağlar.</p><h3>Kuramın Bileşenleri</h3><ul><li><strong>Kavramlar ve tanımlar:</strong> Kavramlar, kavramın kuramsal tanımları, kavramın işlevsel tanımları. Açıklar ve olguları sınıflandırır, kuramı oluşturur, ölçülmesini sağlar.</li><li><strong>İlişkisel açıklamalar/ifadeler:</strong> Kuramsal ifadeler, işlevsel ifadeler. Kavramları ve alt değişkenleri açıklar, kavramların ilişkilerini ölçer.</li><li><strong>Bağlantılar ve düzenleme:</strong> Kuramsal açıklamaların bağlantıları, işlevsel açıklamaların bağlantıları, kavramların organizasyonu ve tanımları, hipotezlerin oluşturulması.</li></ul>`},
{t:"Bir Kuramın Kabulü",c:`<p>Bir kuramın tam olarak kabul edilebilmesi için:</p><ul><li>Kuramın kavramları, tanımları, açıklamaları, bağlantıları ve bunlar arasındaki ilişkiyi net olarak açıklaması gerekir.</li><li>Bu kavramların, basit ve türemiş terimlerin, açıklamaların ve bağlantıların önerme ve hipotezlerle örüntülenmiş olması gerekir.</li><li>Karmaşık açıklama ve kavramlar kuramın bütününde mantıksal bir biçimde düzenlenmiş olması gerekir.</li><li>Kuram çok sayıda açıklama içerdiğinden, kavramsal ve bağlantısal açıklamalar bir düzen içinde sıralanır ve sistematize edilir.</li></ul>`},
{t:"Kuram Türleri",c:`<ul><li><strong>Grand Kuram:</strong> Kapsam olarak çok büyük ve karmaşıktır. İleri düzey araştırmaları gerektirir. Özellikle hemşirelik uygulamalarına temel olmaz ama hemşireliğin temellendiği soyut kavramların temel yapısının oluşmasını sağlar.</li><li><strong>Orta Ölçekli Kuramlar:</strong> Kapsam ve soyut kavramlar açısından daha sınırlıdır. Belli bir fenomenin uygulamaya nasıl aktarılacağını gösterir.</li><li><strong>Betimleyici/Açıklayıcı Kuramlar:</strong> Kuram gelişim sürecinin ilk basamağıdır. Fenomenin oluşturulma nedenini ve sonuçlarını tanımlar, yorumlar.</li><li><strong>Öngörü Kuramları:</strong> Bir fenomenin veya hemşirelik uygulamalarının sonuçlarını önceden tahmin eder ve belirler.</li></ul>`},
{t:"Hemşirelikte Kuramsal Çalışma Türleri",c:`<h3>Felsefeler</h3><p>Mantıksal tartışmalar veya görüşmeler analizler süresince hemşirelik fenomeninin anlaşılmasını sağlar.</p><h3>Kavramsal Modeller ve Grand Kuramlar</h3><p>Geniş kapsamlıdır ve insan, çevre, sağlık ve hemşirelik kavramlarının her birinin üzerindeki bakış açılarını içerir.</p><h3>Hemşirelik Kuramı</h3><p>Grand kurama göre daha az soyuttur ve orta düzey kurama göre daha spesifikir.</p><h3>Orta Düzey Hemşirelik Kuramları</h3><p>Grand kuram ve hemşirelik kuramlarından daha dar bir odak noktası olan ve daha çok somut bir türdür.</p><h3>Sınıflandırma</h3><ul><li><strong>Felsefeler:</strong> Nightingale, Watson, Ray, Benner, Martinsen, Erikson</li><li><strong>Kavramsal Modeller ve Grand Kuramlar:</strong> Levine, Rogers, Orem, King, Neuman, Roy, Johnson</li><li><strong>Kuramlar:</strong> Orlando, Pender, Leininger, Newman, Parse</li><li><strong>Orta Düzey Hemşirelik Kuramları:</strong> Mercer, Mishel, Reed, Kolcaba, Beck, Swanson</li></ul>`},
{t:"Kuramcılar ve Hemşirelik Modelleri",c:`<ul><li><strong>Nightingale (1860):</strong> Çevre koşullarını düzenleyerek iyileşmeyi kolaylaştırmak</li><li><strong>Peplau (1952):</strong> Hasta-hemşire etkileşimi, terapötik kişilerarası süreç</li><li><strong>Henderson (1955):</strong> Bağımsızlığı kazandırmak, 14 gereksinim</li><li><strong>Abdellah (1960):</strong> Bakım birey-aile-topluma; 21 hemşirelik problemi</li><li><strong>Rogers (1970):</strong> Üniter insan</li><li><strong>Orem (1971):</strong> Öz-bakıma yardım</li><li><strong>King (1971):</strong> İletişim, çevreye uyum</li><li><strong>Neuman (1972):</strong> Stresi azaltmak, birincil-ikincil-üçüncül önleme</li><li><strong>Leininger (1978):</strong> Transkültürel bakım</li><li><strong>Roy (1979):</strong> Adaptasyon</li><li><strong>Watson (1979):</strong> Bakım, bilim ve felsefe</li><li><strong>Benner-Wrubel (1989):</strong> Stresle baş etme</li><li><strong>Roper-Logan-Tierney (1983):</strong> Bireye özgü bakım, yaşam aktivitelerinde bağımsızlık</li></ul>`},
{t:"Kuramların Sınıflandırılması",c:`<h3>Felsefi Görüşe Göre</h3><ul><li><strong>Gereksinim kuramları:</strong> Bireylerin fiziksel ve mental gereksinimlerini karşılamak için bireylere yardım etmeye temellenmiştir. Ör: Henderson, Roper, Logan-Tierney</li><li><strong>Etkileşim kuramları:</strong> Bakım sürecine ve hemşire/hasta arasındaki ilişkinin devamlılığına yoğunlaşmıştır. Ör: Orlando, Peplau</li><li><strong>Bakımın sonucunu temel alan kuramlar:</strong> Bakımın yeterliliğine ve bireyin sonuçtan memnun olup olmadığına önem verir. Ör: Neuman, Roy</li></ul><h3>Tüm Kuramcıların Ortak Yönleri</h3><ul><li>Birey kendi sorumluluğunu alıncaya kadar onun sorumluluğunu üstlenme</li><li>Sağlığın sürdürülmesi veya yeniden kazanılması için çevreyi kontrol etme ya da değiştirme</li><li>Belirli amaçlara ulaşmada bireye yardımcı olma</li></ul>`},
{t:"Kuramların Analizi",c:`<ul><li><strong>Netlik:</strong> Bu kuram ne kadar net?</li><li><strong>Sadelik:</strong> Bu kuram ne kadar sadedir?</li><li><strong>Genellenebilirlik:</strong> Bu kuram ne kadar genellenebilir?</li><li><strong>Deneysel kesinlik:</strong> Bu kurama nasıl ulaşılabilir? Test edilebilir?</li><li><strong>Erişilebilir Sonuçlar:</strong> Bu kuram ne kadar önemli?</li></ul>`},
{t:"Kolcaba Konfor Kuramı",c:`<p>Kolcaba'nın Konfor Kuramı, hemodiyaliz hastalarında kullanılan bir orta düzey hemşirelik kuramıdır.</p><h3>Kuramın Bileşenleri</h3><ul><li><strong>Alfa baskısı (uyaranlar):</strong> Kolaylaştırıcı güçler, zorlayıcı güçler, etkileyen güçler</li><li><strong>Beta baskısı:</strong> Alfa baskısının birey tarafından algılanması</li><li><strong>Konfor düzeyleri:</strong> Ferahlama, rahatlama, üstünlük</li><li><strong>Sağlık gereksinimleri:</strong> Fiziksel boyut, psikospiritüel boyut, çevresel boyut, sosyokültürel boyut</li><li><strong>Konforu destekleyen hemşirelik girişimleri:</strong> Fiziksel semptomlar (etkili solunum, sıvı dengesi, beslenme, bulantı-kusmanın giderilmesi, eliminasyon, aktivite-egzersiz, uyku, yorgunluk, kaşıntı-ağrı kontrolü, vücut sıcaklığı), psikospiritüel semptomlar (anksiyete, depresyon, umutsuzluk, benlik saygısı, cinsel işlev, maneviyat), çevresel semptomlar (ışık, ses, ısı, havalandırma, mahremiyet, enfeksiyon önleme, düşme-kanama riski), sosyokültürel semptomlar (yalnızlık, sosyal izolasyon, sosyal destek, eğitim, rol kaybı)</li></ul>`}
];

const QUESTIONS=[
{q:"Kavram nedir?",a:"Bir varlığı, olayı, durumu veya düşünceyi ortak özelliklerine göre zihinde temsil eden genel düşünce birimi",w:["Yalnızca tek bir nesnenin adı","Bir olayın deneysel kanıtı","Somut nesnelerin fiziksel özelliği"],e:"Kavram, gözlenebilen/hissedilebilen algıların, olayların, durumların adıdır. Benzer özellikleri olan şeyleri tek isim altında toplarız."},
{q:"Hangisi SOYUT kavramdır?",a:"Adalet",w:["Elma","Kalem","Masa"],e:"Somut: görülebilen, dokunulabilen. Soyut: duyularla algılanamayan, düşünsel (sağlık, sevgi, özgürlük, adalet)."},
{q:"Aşağıdakilerden hangisi kavramların özelliği DEĞİLDİR?",a:"Tek bir varlığı anlatır",w:["Dil ile ifade edilir","Öğrenmenin temelidir","Geneldir"],e:"Kavramlar geneldir (bir grubu anlatır), soyuttur, dille ifade edilir, ölçülebilir, öğrenmenin temelidir, bellekte saklanır."},
{q:"Kavram öğrenme ne zaman başlar?",a:"Doğumla başlar, ölünceye kadar sürer",w:["Okula başlayınca","Ergenlikte","Yetişkinlikte"],e:"Kişi 'bu buna benziyor, şu ondan farklı' diyebildiğinde kavram öğrenme gerçekleşir. Yaş ilerledikçe daha karmaşık kavramlar öğrenilir."},
{q:"'Masa' kavramının ortak özelliği nedir?",a:"Üzerine bir şey konabilen ayaklı mobilya",w:["Sadece ahşap olması","Dört ayaklı olması","Yalnızca yemek için kullanılması"],e:"Farklı şekil ve renkte masalar olabilir ama hepsinin ortak özelliği 'üzerine bir şey konabilen ayaklı mobilya' olmasıdır."},
{q:"Kavramların genel olma özelliği ne anlama gelir?",a:"Tek bir varlığı değil, bir grubu anlatır",w:["Herkes tarafından bilinir","Sadece bilimsel ortamda kullanılır","Zamanla değişmez"],e:"Kavramlar geneldir; tek bir varlığı değil, benzer özellikleri olan bir grubu anlatır."},
{q:"Kavramlar neden ölçülebilir?",a:"Öğeleri olan davranışlar, özellikler ve faaliyetler tanımlandığında ölçülebilir",w:["Her kavramın sayısal değeri vardır","Uzunluk birimiyle ifade edilir","Yalnızca laboratuvarda ölçülür"],e:"Kavramların öğeleri olan davranışlar, özellikler, faaliyetler açıklandığı ve tanımlandığı zaman ölçülebilir."},
{q:"Kavramlar bellekte nasıl yer alır?",a:"Saklanarak gerektiğinde ortaya çıkarlar",w:["Yalnızca kısa süre kalır","Hiç unutulmaz","Sadece görsel olarak saklanır"],e:"Kavramlar bellekte saklanarak gerektiğinde ortaya çıkarlar."},
{q:"Kavram öğrenme süreci kaç aşamadır?",a:"4",w:["3","6","5"],e:"1) Gözlem ve deneyim 2) Benzerlik-farklılıkları ayırt etme 3) Genelleme 4) Uygulama ve pekiştirme."},
{q:"Kavram öğrenmenin 'kalbi' olan aşama hangisidir?",a:"Benzerlik ve farklılıkları ayırt etme",w:["Gözlem ve deneyim","Pekiştirme","Genelleme"],e:"Ortak (benzerlik) ve ayrıştırıcı (farklılık) özellikleri bulma. Bir şeyi gerçekten anlamak; onun neye benzediğini ve neyden farklı olduğunu fark etmekle başlar."},
{q:"Öğrenci, hemşirenin psikolojik desteğini de 'hemşirelik bakımı' olarak tanıyor. Bu hangi aşamadır?",a:"Genelleme",w:["Pekiştirme","Gözlem","Ayırt etme"],e:"Genelleme: öğrenileni yeni durumlara aktarma. Ateş ölçme, yara temizleme, beslenmeyi düzenleme ortak yönü 'gereksinime yönelik bakım'dır."},
{q:"Uygulama ve pekiştirme aşamasında ne olur?",a:"Kavram gerçek yaşamda kullanılır, tekrarlarla kalıcı olur",w:["Kavram ilk kez fark edilir","Kavram yalnızca ezberlenir","Kavram yanılgıları artar"],e:"Uygulama: kavramı yeni durumda doğru kullanma; pekiştirme: tekrar ve farklı örneklerle kalıcı kılma."},
{q:"Kavram öğrenme sürecinin ilk aşaması nedir?",a:"Gözlem ve deneyim",w:["Genelleme","Pekiştirme","Ayırt etme"],e:"Kişi çevresindeki nesne ve olayları fark eder. Örneğin bir çocuk farklı türde kediler görür."},
{q:"Benzerlik ve farklılıkları ayırt etme aşamasının önemi nedir?",a:"Düşünme ve sınıflandırma becerilerini geliştirir, kavram yanılgılarını önler",w:["Yalnızca ezberi artırır","Sınav başarısını düşürür","Kavramlar arası ilişkileri zayıflatır"],e:"Düşünme ve sınıflandırma becerilerini geliştirir; kavram yanılgılarını önler; kavramlar arası ilişkileri anlamayı kolaylaştırır; bilgiyi anlamlı hale getirir."},
{q:"Genelleme yapma neden önemlidir?",a:"Öğrenilen bilginin kalıcı ve anlamlı olmasını sağlar",w:["Yalnızca sınavda işe yarar","Ezberi artırır","Kavram yanılgılarını çoğaltır"],e:"Öğrenilen bilginin kalıcı ve anlamlı olmasını sağlar; kişi bilgiyi sadece ezberlemez, yeni durumlara uygular; kavram yanılgılarını önler; eleştirel düşünmeyi geliştirir."},
{q:"Uygulama ve pekiştirmenin önemi nedir?",a:"Kalıcı öğrenmeyi sağlar, bilgiyi davranışa dönüştürür",w:["Yalnızca teorik bilgi sağlar","Ezberi artırır","Hatalı öğrenmeleri çoğaltır"],e:"Kalıcı öğrenmeyi sağlar; bilgiyi davranışa dönüştürür; hatalı öğrenmeleri düzeltir; kavramlar arası ilişkiyi güçlendirir; gerçek mesleki becerilerin gelişmesine katkı sağlar."},
{q:"Kavram öğrenme neden yaşam boyu devam eder?",a:"Çünkü birey doğumdan ölüme kadar yeni deneyimlerle karşılaşır",w:["Sadece okulda öğrenilir","Yalnızca çocuklukta öğrenilir","Ergenlikte durur"],e:"Kavram öğrenme birey dünyaya geldiğinde başlar, ölünceye kadar devam eder. Yaş ilerledikçe daha karmaşık kavramlar öğrenilir."},
{q:"Kavram haritası nedir?",a:"Kavramlar ve aralarındaki ilişkilerin grafiksel bir teknikle sunulduğu iki boyutlu şema",w:["Kavramların alfabetik listesi","Konunun tek paragraflık özeti","Kavramların sözlük tanımı"],e:"Bilginin zihinde nasıl anlamlandırıldığını ve bağların nasıl yapılandırıldığını gösteren şematik gösterimdir."},
{q:"Kavram haritasının EN TEMEL işlevi hangisidir?",a:"Anlamlandırma",w:["Görselleştirme","Sınıflandırma","Bilgiyi organize etme"],e:"Diğer işlevler: görselleştirme, ilişkilendirme, somutlaştırma, sınıflandırma, bilgiyi organize etme. En temel işlev anlamlandırmadır."},
{q:"Kavram haritası çizim kurallarından hangisi doğrudur?",a:"Her kavram haritada yalnızca bir kez yer alır",w:["Açıklama ve ilkeler listede yer almalıdır","İlişkiler kutu içine alınmalıdır","Aynı düzeydeki kavramlar farklı renkte olmalıdır"],e:"Her kavram haritada yalnızca bir kez yer alır; açıklama ve ilkeler listede olmaz; ilişkiler kutulanmaz; aynı düzeydeki kavramlar aynı renk/şekilde olur."},
{q:"Hangisi kavram haritasının faydası DEĞİLDİR?",a:"Ezberi artırır",w:["Klinik düşünmeyi geliştirir","Öğrenme düzeyini ölçer","Bilgiyi düzenler"],e:"Faydalar: bilgiyi düzenler; anlamlı öğrenmeyi destekler (ezber yerine neden-sonuç); klinik düşünmeyi geliştirir; kalıcı öğrenme sağlar; öğrenme düzeyini ölçer."},
{q:"Kavram haritasında iki kavram arasındaki ilişki nasıl gösterilir?",a:"İki kutu arasına çizgi çizilir ve üzerine ilişki yazılır",w:["Kutular birleştirilir","Renklerle gösterilir","Yalnızca ok yönü yeterlidir"],e:"İki kutu arasına çizgi çizilmeli, ilişkinin yönünü gösteren oklar kullanılmalı ve çizginin üstüne birkaç kelimeyle ilişki yazılmalıdır."},
{q:"Kavram haritasında ilişki ve önermeler nasıl ifade edilir?",a:"Kutulanmaz, gerektirmelerle ifade edilir",w:["Kutu içine alınır","Yalnızca renkle gösterilir","Numaralandırılır"],e:"İlişki ve önermeler kutulanmamalı; gerektirmelerle ifade edilmeli. Örneğin 'etkiler', 'oluşturur', 'içerir'."},
{q:"Kavram haritası çiziminde ilk adım nedir?",a:"Öğrencinin seviyesine uygun konu/metin seçmek",w:["Kavramları kutu içine almak","Okları çizmek","Renkleri belirlemek"],e:"Öncelikle öğrencinin seviyesine uygun bir konu, metin seçilmeli; konu, öğrencinin önceki bilgilerinin bir devamı niteliğinde olmalı."},
{q:"Kavram haritasında çapraz bağlantılar neden gereklidir?",a:"Kavramların nasıl sentezlendiğini gösterir",w:["Haritayı karmaşıklaştırır","Yer kazanmak için","Süsleme amaçlıdır"],e:"Haritaların değişik bölümlerinde çapraz bağlantılar yer almalı; bu bağlantılar harita içindeki kavramların nasıl sentezlendiğini göstermelidir."},
{q:"Kavram haritaları hangi amaçla kullanılır?",a:"Karmaşık bilgileri anlamlandırma, bakım sürecini planlama, tanıları ilişkilendirme",w:["Yalnızca sınavda","Yalnızca not tutmada","Yalnızca ezberde"],e:"Hemşirelikte kavram haritası: karmaşık bilgileri anlamlandırmaya, hasta bakım sürecini planlamaya, hemşirelik tanılarını ilişkilendirmeye yardımcı olur."},
{q:"Kavram haritası neden basit olmalıdır?",a:"Çok kavram ve önerme içeren harita öğrenciye fayda vermez",w:["Zaman kazanmak için","Kâğıt tasarrufu için","Öğretmen istediği için"],e:"İçinde çok kavram ve önermelerin olduğu bir harita öğrencilere fayda vermeyeceği için haritalar basit olmalıdır."},

{q:"'İmmünizasyon programları' hangi kavrama örnektir?",a:"Hastalığın önlenmesi",w:["Sağlığı koruma","İyilik","Pozitif sağlık"],e:"Hastalığın önlenmesi: immünizasyon programları gibi sağlığın seviyesini artırmaya ya da hastalıkları önlemeye yönelik aktiviteleri içerir."},
